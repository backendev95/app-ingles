<script>
// Configuración opcional de Supabase para sincronizar tu progreso entre dispositivos.
// La "anon key" es pública por diseño: la seguridad la da la política RLS de la tabla
// (cada usuario solo puede leer y escribir su propia fila) y tu contraseña.
// Si la dejas vacía, puedes pegarla en la app, en Ajustes.
const SUPABASE_CONFIG = {
  url: "https://fbncbeljylsinufuwiqd.supabase.co",      // ej. "https://abcdxyz.supabase.co"
  anonKey: "sb_publishable_tw3c5iSVGVkbVp1M4t93fg_BS7wvFJh"   // ej. "eyJhbGciOiJIUzI1NiIs..."
};

// ===== CONTENIDO DEL CURSO (A2 → C2) =====
// Ejercicios: ["mc", pregunta, [opciones], índiceCorrecto, explicación]
//             ["fill", "frase con ___", ["respuestas aceptadas"], explicación]
//             ["ord", "significado en español", "frase correcta en inglés"]
const LEVELS = ["A2", "B1", "B2", "C1", "C2"];
const LEVEL_INFO = {
  A2: { name: "Básico alto", goal: "Hablar de tu rutina, tu pasado y tus planes con frases simples." },
  B1: { name: "Intermedio", goal: "Defenderte en viajes y en el trabajo, contar experiencias y dar opiniones." },
  B2: { name: "Intermedio alto", goal: "Conversar con fluidez con nativos, argumentar y entender textos complejos." },
  C1: { name: "Avanzado", goal: "Usar el inglés con flexibilidad en contextos académicos y profesionales." },
  C2: { name: "Maestría", goal: "Expresarte con precisión, matices y estilo casi como un nativo." }
};

const LESSONS = {
  A2: [
    { id: "a2-1", title: "Presente simple vs. continuo", explain: `<p><b>Presente simple</b>: hábitos y verdades. <i>I work in Bogotá. She drinks coffee every day.</i> En 3.ª persona (he/she/it) se agrega <b>-s</b>.</p><p><b>Presente continuo</b> (am/is/are + -ing): lo que pasa <b>ahora</b> o en este periodo. <i>I'm studying English this month.</i></p><p>Ojo: verbos de estado (<i>like, know, want, need</i>) casi nunca van en -ing: <i>I want</i>, no <i>I'm wanting</i>.</p>`, ex: [
      ["mc", "Look! It ___ outside.", ["rains", "is raining", "rain"], 1, "\"Look!\" indica que está pasando ahora: presente continuo."],
      ["fill", "My sister ___ (work) in a hospital.", ["works"], "Hábito/hecho permanente + 3.ª persona: works."],
      ["mc", "I ___ the answer.", ["know", "am knowing", "knows"], 0, "Know es verbo de estado: no se usa en -ing."],
      ["fill", "What ___ you doing right now?", ["are"], "Pregunta en continuo: are you doing."],
      ["ord", "Él no come carne.", "He doesn't eat meat"],
      ["mc", "___ she speak French?", ["Do", "Does", "Is"], 1, "He/she/it en presente simple usa does."],
      ["fill", "We usually ___ (go) to the gym on Mondays.", ["go"], "Usually = hábito → presente simple."]
    ]},
    { id: "a2-2", title: "Pasado simple", explain: `<p>Acciones terminadas en un momento del pasado. Regulares: <b>-ed</b> (<i>worked, played</i>). Irregulares hay que memorizarlos (<i>go → went, buy → bought, see → saw</i>).</p><p>Negativa y pregunta con <b>did</b> + verbo base: <i>I didn't go. Did you see it?</i> (nunca <i>didn't went</i>).</p>`, ex: [
      ["fill", "Yesterday I ___ (buy) a new phone.", ["bought"], "Buy es irregular: bought."],
      ["mc", "She didn't ___ to the party.", ["went", "go", "goes"], 1, "Después de didn't va el verbo base."],
      ["fill", "___ you see the match last night?", ["did"], "Pregunta en pasado: Did + sujeto + verbo base."],
      ["mc", "Pasado de 'think':", ["thinked", "thought", "taught"], 1, "Think → thought (taught es de teach)."],
      ["ord", "Fuimos a la playa el verano pasado.", "We went to the beach last summer"],
      ["fill", "They ___ (study) all night for the exam.", ["studied"], "Consonante + y → -ied."],
      ["mc", "Where ___ you born?", ["did", "were", "was"], 1, "Born usa el verbo be: Where were you born?"]
    ]},
    { id: "a2-3", title: "Futuro: going to vs. will", explain: `<p><b>Going to</b>: planes ya decididos y predicciones con evidencia. <i>I'm going to visit my parents. Look at those clouds, it's going to rain.</i></p><p><b>Will</b>: decisiones en el momento, promesas, ofertas y predicciones sin evidencia. <i>I'll help you. I think she'll win.</i></p>`, ex: [
      ["mc", "The phone is ringing. — I ___ answer it.", ["'ll", "'m going to", "am"], 0, "Decisión en el momento: will."],
      ["mc", "We ___ get married next June. We booked the venue.", ["will", "are going to", "go"], 1, "Plan ya decidido: going to."],
      ["fill", "Don't worry, I ___ tell anyone. (negativo de will)", ["won't", "will not"], "Promesa negativa: won't."],
      ["ord", "Voy a estudiar inglés todos los días.", "I am going to study English every day"],
      ["mc", "I think robots ___ do most jobs in the future.", ["will", "are going", "going to"], 0, "Opinión/predicción sin evidencia: will."],
      ["fill", "Be careful! You ___ going to fall!", ["are", "'re"], "Evidencia presente: you're going to fall."]
    ]},
    { id: "a2-4", title: "Comparativos y superlativos", explain: `<p>Adjetivos cortos: <b>-er / the -est</b> (<i>cheaper, the cheapest</i>). Largos: <b>more / the most</b> (<i>more expensive, the most expensive</i>).</p><p>Irregulares: <i>good → better → the best; bad → worse → the worst; far → farther/further</i>. Para comparar se usa <b>than</b>: <i>taller than me</i>.</p>`, ex: [
      ["fill", "Medellín is ___ (warm) than Bogotá.", ["warmer"], "Adjetivo corto: warm → warmer."],
      ["mc", "This is the ___ movie I've ever seen.", ["worse", "baddest", "worst"], 2, "Superlativo de bad: the worst."],
      ["fill", "English is ___ (easy) than Chinese.", ["easier"], "Consonante + y → -ier."],
      ["mc", "She is ___ intelligent than her brother.", ["more", "most", "-er"], 0, "Adjetivo largo: more intelligent than."],
      ["ord", "Este es el restaurante más caro de la ciudad.", "This is the most expensive restaurant in the city"],
      ["mc", "My English is ___ now than last year.", ["gooder", "better", "best"], 1, "Comparativo de good: better."]
    ]},
    { id: "a2-5", title: "Presente perfecto (introducción)", explain: `<p><b>have/has + participio</b> para experiencias de vida y resultados recientes, sin decir cuándo: <i>I've been to Mexico. She has lost her keys.</i></p><p>Palabras típicas: <b>ever, never, already, yet, just</b>. <i>Have you ever eaten sushi? I haven't finished yet. I've just arrived.</i></p>`, ex: [
      ["mc", "Have you ever ___ to London?", ["went", "been", "go"], 1, "Experiencia: have you ever been."],
      ["fill", "I have ___ (never) seen snow. (escribe never)", ["never"], "I have never seen..."],
      ["mc", "She ___ finished her homework yet.", ["hasn't", "didn't", "haven't"], 0, "Yet + presente perfecto; she → has."],
      ["fill", "We've ___ (just) eaten. (escribe just)", ["just"], "Just = hace un momento."],
      ["ord", "Ya he terminado el informe.", "I have already finished the report"],
      ["mc", "Participio de 'write':", ["wrote", "written", "writed"], 1, "Write – wrote – written."]
    ]},
    { id: "a2-6", title: "Modales: can, should, must, have to", explain: `<p><b>can</b>: habilidad/permiso. <b>should</b>: consejo. <b>must</b>: obligación fuerte (a menudo personal). <b>have to</b>: obligación externa. <b>don't have to</b>: no es necesario. <b>mustn't</b>: prohibido.</p><p>Después de un modal va el verbo base sin <i>to</i>: <i>You should rest</i> (no <i>should to rest</i>).</p>`, ex: [
      ["mc", "You look tired. You ___ go to bed early.", ["should", "must to", "can to"], 0, "Consejo: should + verbo base."],
      ["mc", "It's Sunday. I ___ work today. Great!", ["mustn't", "don't have to", "can't"], 1, "No es necesario → don't have to."],
      ["mc", "You ___ smoke in the hospital. It's forbidden.", ["don't have to", "mustn't", "shouldn't to"], 1, "Prohibición → mustn't."],
      ["fill", "___ you swim? — Yes, I can.", ["can"], "Habilidad: Can you swim?"],
      ["ord", "Tengo que trabajar mañana.", "I have to work tomorrow"],
      ["mc", "She ___ wear a uniform at her job.", ["has to", "have to", "must to"], 0, "3.ª persona: has to."]
    ]},
    { id: "a2-7", title: "Contables e incontables", explain: `<p><b>much</b> con incontables (<i>much water, much money</i>), <b>many</b> con contables plurales (<i>many people</i>). <b>a lot of</b> sirve para ambos.</p><p><b>some</b> en afirmativas y ofrecimientos; <b>any</b> en negativas y preguntas. Incontables comunes que en español sí se cuentan: <i>information, advice, news, furniture, homework</i>.</p>`, ex: [
      ["mc", "How ___ money do you have?", ["many", "much", "a few"], 1, "Money es incontable: much."],
      ["mc", "There aren't ___ eggs in the fridge.", ["some", "any", "much"], 1, "Negativa: any."],
      ["mc", "Can you give me some ___?", ["advices", "advice", "an advice"], 1, "Advice es incontable."],
      ["fill", "How ___ people came to the party?", ["many"], "People es contable plural: many."],
      ["ord", "Necesito algo de información.", "I need some information"],
      ["mc", "The news ___ very good today.", ["are", "is", "were"], 1, "News es singular incontable: is."]
    ]},
    { id: "a2-8", title: "Errores típicos de hispanohablantes", explain: `<p>Calcos del español que conviene evitar:</p><ul><li><i>I have 25 years</i> → <b>I am 25 years old</b></li><li><i>People is</i> → <b>People are</b></li><li><i>Explain me</i> → <b>Explain to me</b></li><li><i>Is raining</i> → <b>It is raining</b> (el sujeto es obligatorio)</li><li>Falsos amigos: <i>actually</i> = en realidad; <i>embarrassed</i> = avergonzado; <i>library</i> = biblioteca; <i>assist</i> = ayudar</li></ul>`, ex: [
      ["mc", "¿Cuál es correcta?", ["I have 30 years.", "I am 30 years old.", "I have 30 years old."], 1, "La edad se dice con be."],
      ["mc", "¿Cuál es correcta?", ["People is happy.", "People are happy.", "The people is happy."], 1, "People es plural."],
      ["mc", "'Actually' significa:", ["actualmente", "en realidad", "activamente"], 1, "Actualmente = currently/nowadays."],
      ["mc", "¿Cuál es correcta?", ["Can you explain me this?", "Can you explain this to me?", "Can you explain to me this?"], 1, "Explain something to someone."],
      ["fill", "___ is very cold today. (sujeto)", ["it"], "El inglés necesita sujeto: It is cold."],
      ["mc", "'Estoy embarazada' es:", ["I'm embarrassed.", "I'm pregnant.", "I'm embarazed."], 1, "Embarrassed = avergonzado/a."]
    ]}
  ],
  B1: [
    { id: "b1-1", title: "Presente perfecto vs. pasado simple", explain: `<p><b>Pasado simple</b>: momento terminado y específico (<i>yesterday, in 2019, last week</i>).</p><p><b>Presente perfecto</b>: periodo que sigue abierto o tiempo no especificado, y duración con <b>for</b> (periodo) / <b>since</b> (punto de inicio): <i>I've lived here for five years / since 2020.</i></p>`, ex: [
      ["mc", "I ___ here since 2018.", ["live", "lived", "have lived"], 2, "Since + algo que sigue: presente perfecto."],
      ["mc", "I ___ him last Friday.", ["have seen", "saw", "see"], 1, "Last Friday es un momento terminado."],
      ["fill", "She has worked here ___ ten years.", ["for"], "Duración: for."],
      ["fill", "They have been married ___ 2015.", ["since"], "Punto de inicio: since."],
      ["ord", "¿Cuánto tiempo has estudiado inglés?", "How long have you studied English"],
      ["mc", "___ you finish the project yesterday?", ["Have", "Did", "Has"], 1, "Yesterday → pasado simple."]
    ]},
    { id: "b1-2", title: "Pasado continuo", explain: `<p><b>was/were + -ing</b>: acción en progreso en el pasado, a menudo interrumpida por otra en pasado simple: <i>I was cooking when the phone rang.</i></p><p><b>while</b> suele ir con el continuo: <i>While I was driving, it started to rain.</i></p>`, ex: [
      ["mc", "I ___ TV when the lights went out.", ["watched", "was watching", "am watching"], 1, "Acción en progreso interrumpida."],
      ["fill", "What ___ you doing at 8 pm last night?", ["were"], "You → were."],
      ["mc", "While she ___, she cut her finger.", ["cooked", "was cooking", "cooks"], 1, "While + pasado continuo."],
      ["ord", "Estaba lloviendo cuando salimos.", "It was raining when we left"],
      ["mc", "He ___ when I called him.", ["was sleeping", "slept", "sleeping"], 0, "Acción en progreso."],
      ["fill", "They ___ (not / listen) when the teacher explained it.", ["weren't listening", "were not listening"], "Negativa: weren't + -ing."]
    ]},
    { id: "b1-3", title: "Condicionales 1 y 2", explain: `<p><b>Primer condicional</b> (real/posible): <i>If + presente, will + verbo</i>. <i>If it rains, I'll stay home.</i></p><p><b>Segundo condicional</b> (hipotético/irreal): <i>If + pasado, would + verbo</i>. <i>If I had more money, I would travel.</i> Con be se prefiere <b>were</b>: <i>If I were you...</i></p>`, ex: [
      ["mc", "If I ___ rich, I would buy a house in Cartagena.", ["am", "were", "will be"], 1, "Hipotético: If I were."],
      ["fill", "If you study, you ___ pass the exam.", ["will", "'ll"], "Real/posible: will."],
      ["mc", "If I ___ you, I'd accept the job.", ["were", "am", "would be"], 0, "Consejo: If I were you."],
      ["mc", "What would you do if you ___ the lottery?", ["win", "won", "will win"], 1, "Segundo condicional: pasado."],
      ["ord", "Si llueve, nos quedaremos en casa.", "If it rains we will stay at home"],
      ["mc", "If she ___ earlier, she won't be late.", ["leaves", "left", "will leave"], 0, "Tras if no va will: presente."]
    ]},
    { id: "b1-4", title: "La voz pasiva", explain: `<p><b>be + participio</b> cuando importa más la acción que quién la hace: <i>English is spoken here. The bridge was built in 1990.</i></p><p>Quién lo hizo se indica con <b>by</b>: <i>The book was written by García Márquez.</i></p>`, ex: [
      ["mc", "Coffee ___ in Colombia.", ["grows", "is grown", "is growing"], 1, "Pasiva en presente: is grown."],
      ["fill", "The Mona Lisa was ___ (paint) by Leonardo da Vinci.", ["painted"], "Participio: painted."],
      ["mc", "My car ___ yesterday.", ["was stolen", "stole", "is stolen"], 0, "Pasiva en pasado."],
      ["ord", "Las cartas son entregadas cada mañana.", "The letters are delivered every morning"],
      ["mc", "This house ___ in 1950.", ["built", "was built", "is build"], 1, "Pasiva pasado."],
      ["fill", "The emails ___ sent automatically every day. (presente)", ["are"], "Plural presente: are sent."]
    ]},
    { id: "b1-5", title: "Oraciones relativas", explain: `<p><b>who</b> para personas, <b>which</b> para cosas, <b>that</b> para ambos (en definiciones), <b>where</b> para lugares, <b>whose</b> para posesión.</p><p><i>The woman who lives next door is a doctor. The city where I was born is small.</i></p>`, ex: [
      ["mc", "The man ___ called you is my boss.", ["which", "who", "where"], 1, "Persona: who."],
      ["mc", "This is the restaurant ___ we had our first date.", ["which", "where", "who"], 1, "Lugar: where."],
      ["fill", "That's the girl ___ father is a pilot.", ["whose"], "Posesión: whose."],
      ["mc", "The laptop ___ I bought is very fast.", ["who", "which", "whose"], 1, "Cosa: which/that."],
      ["ord", "El libro que estoy leyendo es interesante.", "The book that I am reading is interesting"]
    ]},
    { id: "b1-6", title: "Estilo indirecto (reported speech)", explain: `<p>Al contar lo que alguien dijo, los tiempos suelen “retroceder”: <i>“I am tired” → She said (that) she was tired. “I will call” → He said he would call.</i></p><p><b>say</b> no lleva persona; <b>tell</b> sí: <i>She told me that...</i></p>`, ex: [
      ["mc", "\"I'm busy.\" → He said he ___ busy.", ["is", "was", "were"], 1, "Presente → pasado."],
      ["mc", "She ___ me that she was leaving.", ["said", "told", "say"], 1, "Tell + persona."],
      ["fill", "\"I will help you.\" → She said she ___ help me.", ["would"], "Will → would."],
      ["mc", "\"I can swim.\" → He said he ___ swim.", ["can", "could", "may"], 1, "Can → could."],
      ["ord", "Me dijo que estaba cansado.", "He told me that he was tired"]
    ]},
    { id: "b1-7", title: "Used to / be used to / get used to", explain: `<p><b>used to + verbo</b>: hábitos del pasado que ya no ocurren: <i>I used to smoke.</i></p><p><b>be used to + -ing/sustantivo</b>: estar acostumbrado. <b>get used to</b>: acostumbrarse. <i>I'm used to waking up early. I'm getting used to the cold.</i></p>`, ex: [
      ["mc", "When I was a child, I ___ play football every day.", ["used to", "am used to", "use to"], 0, "Hábito pasado."],
      ["mc", "I'm used to ___ in English at work.", ["speak", "speaking", "spoke"], 1, "Be used to + -ing."],
      ["fill", "Did you ___ to live in Cali? (use/used)", ["use"], "En pregunta con did: use to."],
      ["mc", "It took me months to ___ used to the food in London.", ["be", "get", "use"], 1, "Proceso de acostumbrarse: get used to."],
      ["ord", "Solía tener el pelo largo.", "I used to have long hair"]
    ]},
    { id: "b1-8", title: "Gerundio vs. infinitivo", explain: `<p>Algunos verbos van con <b>-ing</b>: <i>enjoy, avoid, finish, mind, suggest, keep</i>. Otros con <b>to + verbo</b>: <i>want, decide, hope, plan, agree, refuse</i>.</p><p>Después de preposición siempre -ing: <i>I'm interested in learning.</i></p>`, ex: [
      ["mc", "I enjoy ___ to music.", ["to listen", "listening", "listen"], 1, "Enjoy + -ing."],
      ["mc", "She decided ___ the job.", ["to accept", "accepting", "accept"], 0, "Decide + to."],
      ["fill", "Thank you for ___ (help) me.", ["helping"], "Preposición + -ing."],
      ["mc", "Would you mind ___ the window?", ["to open", "opening", "open"], 1, "Mind + -ing."],
      ["mc", "We're planning ___ to Europe.", ["to travel", "traveling", "travel"], 0, "Plan + to."],
      ["ord", "Dejé de fumar hace dos años.", "I stopped smoking two years ago"]
    ]}
  ],
  B2: [
    { id: "b2-1", title: "Tercer condicional y mixtos", explain: `<p><b>Tercer condicional</b> (pasado irreal): <i>If + had + participio, would have + participio</i>. <i>If I had studied, I would have passed.</i></p><p><b>Mixto</b> (pasado → presente): <i>If I had taken that job, I would be rich now.</i></p>`, ex: [
      ["mc", "If I had known, I ___ you.", ["would tell", "would have told", "will tell"], 1, "Tercer condicional."],
      ["fill", "If she ___ (leave) earlier, she wouldn't have missed the flight.", ["had left", "'d left"], "If + had + participio."],
      ["mc", "If I had studied medicine, I ___ a doctor now.", ["would have been", "would be", "will be"], 1, "Mixto: resultado presente."],
      ["mc", "We ___ the match if our goalkeeper hadn't got injured.", ["would win", "would have won", "won"], 1, "Resultado pasado."],
      ["ord", "Si hubiera sabido, habría venido.", "If I had known I would have come"]
    ]},
    { id: "b2-2", title: "Pasiva avanzada y causativo", explain: `<p>Pasiva en todos los tiempos: <i>has been done, is being done, will have been done</i>.</p><p><b>Causativo</b>: <i>have/get something done</i> = que otra persona lo haga por ti: <i>I had my hair cut. I'm getting my car repaired.</i></p>`, ex: [
      ["mc", "The road ___ at the moment.", ["is repaired", "is being repaired", "has repaired"], 1, "Pasiva continua."],
      ["mc", "I need to ___ my eyes tested.", ["have", "do", "make"], 0, "Causativo: have something done."],
      ["fill", "The results have ___ published. (be)", ["been"], "Pasiva perfecta: have been published."],
      ["mc", "She got her phone ___.", ["fix", "fixed", "fixing"], 1, "Get + objeto + participio."],
      ["ord", "Me cortaron el pelo ayer.", "I had my hair cut yesterday"]
    ]},
    { id: "b2-3", title: "Modales de deducción", explain: `<p>Presente: <b>must</b> (seguro que sí), <b>can't</b> (seguro que no), <b>might/may/could</b> (posible).</p><p>Pasado: <b>must have / can't have / might have + participio</b>. <i>She must have forgotten. He can't have seen us.</i></p>`, ex: [
      ["mc", "The lights are off. They ___ be at home.", ["must", "can't", "should"], 1, "Seguro que no."],
      ["mc", "He looks exhausted. He ___ worked all night.", ["must have", "can't have", "must"], 0, "Deducción pasada positiva."],
      ["fill", "I'm not sure where she is. She ___ be in a meeting. (posible)", ["might", "may", "could"], "Posibilidad."],
      ["mc", "You ___ seen John yesterday. He's in Japan!", ["must have", "can't have", "might have"], 1, "Imposible en el pasado."],
      ["ord", "Debe de haber perdido el bus.", "He must have missed the bus"]
    ]},
    { id: "b2-4", title: "Wish e If only", explain: `<p>Deseos sobre el presente: <b>wish + pasado</b> (<i>I wish I spoke better English</i>). Sobre el pasado: <b>wish + had + participio</b> (<i>I wish I had studied more</i>).</p><p>Quejas sobre otros: <b>wish + would</b> (<i>I wish you would stop talking</i>).</p>`, ex: [
      ["mc", "I wish I ___ taller.", ["am", "were", "will be"], 1, "Presente irreal: were."],
      ["mc", "I wish I ___ that. It was a mistake.", ["didn't say", "hadn't said", "don't say"], 1, "Arrepentimiento pasado."],
      ["fill", "I wish my neighbours ___ stop making noise.", ["would"], "Queja: wish + would."],
      ["mc", "If only I ___ more time!", ["have", "had", "will have"], 1, "If only + pasado."],
      ["ord", "Ojalá hubiera viajado más cuando era joven.", "I wish I had travelled more when I was young"]
    ]},
    { id: "b2-5", title: "Futuro continuo y perfecto", explain: `<p><b>Futuro continuo</b> (will be + -ing): acción en progreso en un momento futuro: <i>This time tomorrow I'll be flying to Madrid.</i></p><p><b>Futuro perfecto</b> (will have + participio): terminada antes de un momento futuro: <i>By 2030, I will have finished my degree.</i></p>`, ex: [
      ["mc", "By next year, I ___ here for a decade.", ["will work", "will have worked", "will be work"], 1, "Futuro perfecto con by."],
      ["mc", "Don't call at 9. I ___ dinner.", ["will have", "will be having", "have"], 1, "En progreso en ese momento."],
      ["fill", "By the time you arrive, we will have ___ (finish).", ["finished"], "Will have + participio."],
      ["ord", "Mañana a esta hora estaré trabajando.", "This time tomorrow I will be working"],
      ["mc", "She ___ the report by Friday.", ["will have finished", "will be finishing", "finishes"], 0, "Completado antes de un plazo."]
    ]},
    { id: "b2-6", title: "Conectores de contraste", explain: `<p><b>although/even though</b> + oración. <b>despite/in spite of</b> + sustantivo o -ing. <b>however</b> al inicio de oración, con coma. <b>whereas/while</b> para contrastar dos ideas.</p><p><i>Despite the rain, we went out. Although it was raining, we went out.</i></p>`, ex: [
      ["mc", "___ the traffic, we arrived on time.", ["Although", "Despite", "However"], 1, "Despite + sustantivo."],
      ["mc", "___ he was tired, he kept working.", ["Despite", "Although", "In spite"], 1, "Although + oración."],
      ["fill", "The plan is good. ___, it's too expensive.", ["however"], "However + coma."],
      ["mc", "In spite of ___ hard, he failed.", ["study", "studying", "studied"], 1, "In spite of + -ing."],
      ["mc", "I like coffee, ___ my wife prefers tea.", ["whereas", "despite", "however"], 0, "Contraste entre dos ideas."]
    ]},
    { id: "b2-7", title: "Phrasal verbs esenciales", explain: `<p>Verbo + partícula con significado nuevo: <i>give up</i> (rendirse/dejar), <i>look forward to</i> (esperar con ganas), <i>put off</i> (aplazar), <i>come up with</i> (idear), <i>run out of</i> (quedarse sin), <i>turn down</i> (rechazar), <i>figure out</i> (descifrar).</p>`, ex: [
      ["mc", "We've ___ milk. Can you buy some?", ["run out of", "given up", "put off"], 0, "Quedarse sin: run out of."],
      ["mc", "I'm looking forward to ___ you.", ["see", "seeing", "saw"], 1, "Look forward to + -ing."],
      ["fill", "Don't put ___ until tomorrow what you can do today.", ["off"], "Put off = aplazar."],
      ["mc", "She ___ a brilliant idea.", ["came up with", "turned down", "gave up"], 0, "Idear: come up with."],
      ["mc", "He ___ the job offer because the salary was low.", ["turned down", "turned up", "looked after"], 0, "Rechazar: turn down."],
      ["fill", "I can't figure ___ this problem.", ["out"], "Figure out = resolver/entender."]
    ]}
  ],
  C1: [
    { id: "c1-1", title: "Inversión para énfasis", explain: `<p>Tras expresiones negativas o restrictivas al inicio, se invierte sujeto y auxiliar (registro formal): <i>Never have I seen such chaos. Not only did she win, but she also broke the record. Hardly had we arrived when it started to rain. Under no circumstances should you open this.</i></p>`, ex: [
      ["mc", "Never ___ such a beautiful place.", ["I have seen", "have I seen", "I saw"], 1, "Never + auxiliar + sujeto."],
      ["mc", "Not only ___ late, but he also forgot the documents.", ["he was", "was he", "he is"], 1, "Not only + inversión."],
      ["fill", "Hardly ___ I sat down when the phone rang.", ["had"], "Hardly had + sujeto + participio."],
      ["mc", "Under no circumstances ___ leave the building.", ["you should", "should you", "you must"], 1, "Inversión obligatoria."],
      ["ord", "Rara vez he oído un argumento tan convincente.", "Rarely have I heard such a convincing argument"],
      ["mc", "Little ___ know what was about to happen.", ["did they", "they did", "they"], 0, "Little + did + sujeto."]
    ]},
    { id: "c1-2", title: "Oraciones escindidas (cleft sentences)", explain: `<p>Sirven para destacar información: <b>What I need is...</b>, <b>It was ... who/that...</b>, <b>All I want is...</b>, <b>The reason why... is that...</b></p><p><i>It was Maria who solved the problem. What surprised me was his attitude.</i></p>`, ex: [
      ["mc", "___ I need is a long holiday.", ["That", "What", "Which"], 1, "What + cláusula como sujeto."],
      ["mc", "It was my brother ___ broke the window.", ["which", "who", "what"], 1, "It was + persona + who."],
      ["fill", "___ I want is some peace and quiet. (todo lo que)", ["all"], "All I want is..."],
      ["ord", "Lo que más me molesta es su actitud.", "What annoys me most is his attitude"],
      ["mc", "The reason ___ I left is that I wasn't happy.", ["why", "because", "what"], 0, "The reason why..."]
    ]},
    { id: "c1-3", title: "Hipótesis avanzadas", explain: `<p>Formas formales o enfáticas: <b>Were I to...</b> / <b>Should you need...</b> / <b>Had I known...</b> (condicionales sin if). <b>But for / Without</b> + sustantivo. <b>It's (high) time</b> + pasado. <b>Supposing / Provided that / As long as</b>.</p>`, ex: [
      ["mc", "___ you need any help, don't hesitate to contact us.", ["If you should", "Should", "Would"], 1, "Should + sujeto = if."],

  { id: "a2-10", title: "Preposiciones: in, on, at", explain: `<p><b>Tiempo</b>: <b>at</b> + horas y momentos (<i>at 7, at night, at the weekend</i>); <b>on</b> + días y fechas (<i>on Monday, on 5 May</i>); <b>in</b> + meses, años, estaciones y partes del día (<i>in July, in 2020, in the morning</i>).</p><p><b>Lugar</b>: <b>at</b> un punto (<i>at the bus stop, at work</i>); <b>on</b> una superficie (<i>on the table, on the wall</i>); <b>in</b> dentro de un espacio (<i>in the box, in Bogotá</i>).</p>`, ex: [

  { title: "A day in the life of Laura", text: `Laura is twenty-eight years old and she lives in Bogotá with her cat, Milo. She works as a nurse in a big hospital in the north of the city.\n\nFrom Monday to Friday, she gets up at five o'clock because her shift starts at seven. She has a quick breakfast, usually coffee and an arepa, and then she takes the TransMilenio to work. The journey takes about forty minutes.\n\nHer job is difficult but she loves it. She helps patients, talks to doctors and writes reports. She often feels tired at the end of the day.\n\nOn weekends, Laura relaxes. On Saturdays she goes to the park with her friends and on Sundays she visits her parents in Chía. She is learning English because she wants to work in Canada one day.`, q: [

LESSONS.B1.push(
  { id: "b1-9", title: "Presente perfecto continuo", explain: `<p><b>have/has been + -ing</b>: acción que empezó en el pasado y <b>sigue</b> (o acaba de parar), con énfasis en la <b>duración</b>: <i>I've been waiting for an hour. She's been working here since March.</i></p><p>Comparación: <i>I've read the book</i> (terminado, resultado) vs. <i>I've been reading the book</i> (actividad en curso).</p>`, ex: [
    ["mc", "I'm tired because I ___ all day.", ["have worked", "have been working", "worked"], 1, "Duración + efecto presente."],
    ["fill", "How long have you ___ (learn) English?", ["been learning"], "How long + have been + -ing."],
    ["mc", "She ___ three emails this morning.", ["has written", "has been writing", "writes"], 0, "Cantidad terminada → simple."],
    ["tr", "Llevo dos horas esperándote.", ["I've been waiting for you for two hours.", "I have been waiting for you for two hours."], "Llevar + tiempo + gerundio = have been + -ing + for."],
    ["fix", "I am living here since 2019.", ["I have been living here since 2019.", "I've been living here since 2019.", "I have lived here since 2019.", "I've lived here since 2019."], "Con since no se usa el presente continuo."],
    ["mc", "It ___ all morning. The streets are wet.", ["has been raining", "rains", "is raining since"], 0, "Actividad reciente con resultado visible."],
    ["ord", "¿Cuánto tiempo llevas trabajando aquí?", "How long have you been working here"],
    ["mc", "I ___ him for ten years.", ["have been knowing", "have known", "know"], 1, "Know es de estado: no va en continuo."]
  ]},
  { id: "b1-10", title: "Too / enough, so / such", explain: `<p><b>too + adjetivo</b> = demasiado (problema): <i>It's too expensive.</i> <b>adjetivo + enough</b> = suficiente: <i>He isn't old enough.</i> <b>enough + sustantivo</b>: <i>enough time</i>.</p><p><b>so + adjetivo</b> y <b>such (a) + adjetivo + sustantivo</b> para intensificar: <i>It was so cold. It was such a cold day.</i></p>`, ex: [
    ["mc", "This coffee is ___ hot to drink.", ["too", "enough", "so"], 0, "Too + adj + to."],
    ["mc", "She isn't tall ___ to play basketball.", ["too", "enough", "such"], 1, "Adj + enough."],
    ["mc", "It was ___ a good film!", ["so", "such", "too"], 1, "Such a + adj + sustantivo."],
    ["fill", "We don't have ___ money for a new car.", ["enough"], "Enough + sustantivo."],
    ["fix", "The exam was such difficult.", ["The exam was so difficult."], "So + adjetivo solo."],
    ["tr", "Hacía demasiado frío para nadar.", ["It was too cold to swim.", "It was too cold for swimming."], "Too + adj + to + verbo."],
    ["mc", "They were ___ tired that they fell asleep.", ["such", "so", "too"], 1, "So + adj + that."]
  ]},
  { id: "b1-11", title: "Verbos modales de obligación en pasado", explain: `<p>Pasado de <b>must/have to</b>: <b>had to</b>. <i>I had to work late.</i> Pasado de <b>can</b>: <b>could / was able to</b>.</p><p><b>should have + participio</b> = crítica o arrepentimiento: <i>You should have told me.</i> <b>didn't need to</b> = no era necesario.</p>`, ex: [
    ["mc", "Yesterday I ___ wake up at 4 am for my flight.", ["must", "had to", "have to"], 1, "Pasado de have to."],
    ["mc", "You ___ studied more. You failed the exam.", ["should", "should have", "must have"], 1, "Crítica sobre el pasado."],
    ["fill", "When I was five, I ___ swim. (podía)", ["could"], "Habilidad pasada: could."],
    ["tr", "Tuve que llamar a mi jefe.", ["I had to call my boss."], "Had to + verbo."],

    ["mc", "We ___ take a taxi; my friend drove us.", ["didn't need to", "mustn't", "shouldn't have"], 0, "No fue necesario."],

READINGS.B1 = [
  { title: "Why I quit social media for a month", text: `Last January I decided to try an experiment: one month without social media. I deleted Instagram, TikTok and Facebook from my phone. I kept WhatsApp, because I need it for work.\n\nThe first week was really hard. I kept picking up my phone without thinking, and I felt anxious because I didn't know what my friends were doing. I realised that I used to check my phone more than a hundred times a day.\n\nBy the second week, things started to change. I was sleeping better, because I wasn't looking at a screen in bed. I read two books, something I hadn't done for years, and I started cooking more.\n\nThe biggest surprise was my relationships. Instead of liking my friends' photos, I called them or met them for coffee. Our conversations were longer and more real.\n\nWhen the month finished, I installed Instagram again, but I use it differently now. I've turned off notifications and I only check it once a day. I don't think social media is bad, but I've learnt that I need to control it, not the other way round.`, q: [
    ["Why did the writer keep WhatsApp?", ["To talk to family", "Because it's needed for work", "Because it's not social media", "To read news"], 1],
    ["How did the writer feel in the first week?", ["Relaxed", "Anxious", "Happy", "Bored"], 1],
    ["Why did the writer sleep better?", ["Because of exercise", "Because of no screen in bed", "Because of reading", "Because of less work"], 1],
    ["What changed in the writer's relationships?", ["They saw fewer friends.", "They had more real conversations.", "They argued more.", "Nothing changed."], 1],
    ["What is the writer's conclusion?", ["Social media is dangerous.", "Never use social media.", "You need to control social media.", "Social media is great."], 2]
  ], gloss: [["delete", "borrar"], ["kept", "seguí / conservé"], ["realise", "darse cuenta"], ["instead of", "en lugar de"], ["turn off", "desactivar"], ["the other way round", "al revés"]] },
  { title: "A complaint that worked", text: `Two months ago, I ordered a new laptop online. The website promised delivery in three days, but after two weeks it still hadn't arrived. I called customer service four times. Each time, a different person told me that the laptop was "on its way".\n\nI was getting really frustrated, so I decided to write a formal complaint. A friend who works in sales gave me some advice: be polite, be clear and say exactly what you want.\n\nIn my email, I explained the situation with dates and order numbers. I said that I was disappointed with the service and that I wanted either the laptop within five days or a full refund. I didn't shout or insult anyone.\n\nThe next day, the manager called me personally. She apologised, explained that there had been a problem with the warehouse, and offered me the laptop the same week plus a 20% discount on my next order.\n\nThe lesson? Anger doesn't solve problems, but a calm, organised complaint often does.`, q: [
    ["What was the original problem?", ["The laptop was broken.", "The laptop didn't arrive.", "The price was wrong.", "They sent the wrong model."], 1],
    ["What did the friend advise?", ["To shout", "To cancel the order", "To be polite and clear", "To call again"], 2],
    ["What did the writer ask for?", ["A discount", "The laptop in five days or a refund", "A new model", "To speak to the CEO"], 1],
    ["What caused the delay?", ["A strike", "A warehouse problem", "The weather", "A wrong address"], 1],
    ["What did the company offer?", ["Only an apology", "A free laptop", "The laptop plus a discount", "A refund only"], 2]
  ], gloss: [["delivery", "entrega"], ["on its way", "en camino"], ["frustrated", "frustrado"], ["either... or", "o... o"], ["apologise", "disculparse"], ["warehouse", "bodega"]] },
  { title: "Living abroad: expectations vs. reality", text: `When Daniel moved from Cali to Toronto to study, he thought the hardest thing would be the language. He had studied English for years and he could understand films without subtitles, so he felt confident.\n\nIn reality, the language was only one part of the challenge. People spoke much faster than in the films, and they used lots of expressions he had never heard. But the biggest surprise was the weather. His first winter was minus twenty degrees, and he didn't even have proper boots.\n\nHe also missed the food and the warmth of people back home. "In Colombia, you talk to strangers all the time. Here, people are friendly but more reserved," he says.\n\nAfter a year, though, Daniel feels at home. He has made friends from all over the world, he has learnt to love ice skating and his English has improved enormously. "If I had to give advice to someone moving abroad," he says, "I'd tell them to be patient. The first six months are difficult for everyone."`, q: [
    ["What did Daniel expect to be the hardest thing?", ["The weather", "The language", "The food", "Making friends"], 1],
    ["Why was understanding people difficult?", ["They had strong accents only.", "They spoke fast and used many expressions.", "They didn't want to talk.", "He didn't study English."], 1],
    ["What was the biggest surprise?", ["The food", "The prices", "The weather", "The university"], 2],
    ["How are people in Toronto, according to Daniel?", ["Rude", "Friendly but reserved", "Very open", "Always busy"], 1],
    ["What is his advice?", ["Learn more grammar", "Be patient", "Buy good boots", "Stay at home"], 1]
  ], gloss: [["subtitles", "subtítulos"], ["proper", "adecuado"], ["strangers", "desconocidos"], ["reserved", "reservado"], ["though", "sin embargo (al final)"], ["enormously", "enormemente"]] }
];

  { title: "Una experiencia que me cambió", task: "Cuenta una experiencia importante de tu vida: qué pasó, cómo te sentiste y qué aprendiste.", words: "120–150", phrases: ["I'll never forget the day when...", "At first, I felt... but then...", "While I was..., ...", "Looking back, I realise that...", "It taught me that..."], check: ["Combiné pasado simple y pasado continuo", "Usé conectores de secuencia (at first, then, finally)", "Describí sentimientos con adjetivos variados", "Expliqué qué aprendí (conclusión)"], model: "I'll never forget the day I moved to Bogotá on my own. I was nineteen and I had never lived away from my family. At first, I felt excited, but after a few weeks I was really lonely. While I was walking home one night, I met a neighbour who invited me to play football with his friends. That small invitation changed everything. I started to feel part of the city, and I made friends who are still very important to me. Looking back, I realise that I was too shy to ask for help. It taught me that it's OK to feel lost, and that saying yes to new people can change your life." },

  { id: "b2-10", title: "Formación de palabras", explain: `<p>Sufijos para crear sustantivos: <b>-ment, -tion, -ness, -ity</b> (<i>improve → improvement, decide → decision, happy → happiness, able → ability</i>). Adjetivos: <b>-ful, -less, -ous, -able, -ive</b> (<i>care → careful/careless, danger → dangerous</i>).</p><p>Prefijos negativos: <b>un-, in-, im-, dis-, ir-, il-</b> (<i>unreliable, impossible, dishonest, irresponsible, illegal</i>).</p>`, ex: [

  { title: "The four-day week: too good to be true?", text: `In recent years, hundreds of companies around the world have tested a four-day working week. The idea is simple: employees work 80% of the time, keep 100% of their salary, and promise to maintain at least 100% of their productivity.\n\nThe results of the largest trials have been surprisingly positive. Most participating companies reported that productivity stayed the same or even improved, while staff reported lower levels of stress and burnout. Many employees said they used the extra day for exercise, family or simply resting, which made them more focused when they returned to work. As a result, the majority of companies decided to keep the new schedule after the trial ended.\n\nHowever, critics point out that the model doesn't work for every sector. Hospitals, schools and restaurants, for example, need people present every day, so reducing hours often means hiring more staff, which increases costs. Others argue that some employees simply squeeze five days of work into four, ending up with longer and more intense days.\n\nThe debate is far from over. What seems clear is that the traditional nine-to-five, five-day week, designed more than a century ago, is no longer the only option.`, q: [

    ["What did most companies in the trials report?", ["Lower productivity", "Same or better productivity", "Higher costs", "More stress"], 1],
    ["Why might the model be difficult for hospitals?", ["Workers don't want it.", "They need staff every day, which means hiring more.", "It's illegal.", "Doctors earn too much."], 1],
    ["What criticism is mentioned about some employees?", ["They work less.", "They squeeze five days of work into four.", "They take more holidays.", "They lose their jobs."], 1],
    ["What is the writer's conclusion?", ["The four-day week is perfect.", "The debate is finished.", "The traditional week is no longer the only option.", "Companies should reject it."], 2]
  ], gloss: [["trial", "prueba / ensayo"], ["burnout", "agotamiento laboral"], ["staff", "personal"], ["point out", "señalar"], ["squeeze into", "meter a presión en"], ["far from over", "lejos de terminar"]] },
  { title: "The science of habits", text: `Why is it so hard to start going to the gym, yet so easy to keep checking our phones? According to researchers, the answer lies in how habits are formed.\n\nA habit, they explain, is a loop with three parts: a cue, a routine and a reward. The cue is a trigger, such as feeling bored or hearing a notification. The routine is the behaviour itself, like opening social media. The reward is the pleasant feeling we get, which teaches the brain to repeat the loop next time.\n\nThe problem with "good" habits is that their rewards are often delayed. The benefits of exercise or studying a language appear weeks or months later, whereas the reward of checking your phone is instant. That's why experts recommend creating small, immediate rewards for good behaviour, such as tracking your progress or enjoying a favourite coffee after a workout.\n\nAnother effective strategy is "habit stacking": attaching a new habit to an existing one. For instance, "After I make my morning coffee, I will review ten English words." By linking the new behaviour to a cue that already exists, it becomes much easier to remember and repeat.\n\nFinally, researchers insist that consistency matters more than intensity. Studying for ten minutes every day is likely to produce better results than studying for three hours once a week.`, q: [
    ["What are the three parts of a habit loop?", ["Goal, plan, result", "Cue, routine, reward", "Trigger, effort, pain", "Start, middle, end"], 1],
    ["Why are good habits hard to build?", ["They're boring.", "Their rewards are often delayed.", "They're expensive.", "They need friends."], 1],
    ["What do experts recommend?", ["Removing all rewards", "Creating small, immediate rewards", "Studying for hours", "Avoiding coffee"], 1],
    ["What is 'habit stacking'?", ["Doing many habits at once", "Attaching a new habit to an existing one", "Changing habits every week", "Writing a list of habits"], 1],
    ["According to the text, what matters more?", ["Intensity", "Talent", "Consistency", "Motivation"], 2]
  ], gloss: [["lies in", "reside en"], ["cue / trigger", "señal / detonante"], ["reward", "recompensa"], ["delayed", "diferido"], ["attach", "unir / adjuntar"], ["consistency", "constancia"]] },
  { title: "Opinion: Tourism is loving places to death", text: `Every year, millions of people travel to the same famous destinations: Venice, Barcelona, Machu Picchu, Cartagena. Tourism brings money and jobs, but in many places it has become a victim of its own success.\n\nIn some historic centres, rents have risen so much that local residents can no longer afford to live there. Apartments have been turned into short-term holiday rentals, and traditional shops have been replaced by souvenir stores. The result is a neighbourhood that looks beautiful in photos but has lost its soul.\n\nNatural sites suffer too. Popular trails are damaged by thousands of visitors, and fragile ecosystems are polluted by waste. Some destinations have responded by limiting the number of daily visitors or introducing tourist taxes, measures that were unthinkable a decade ago.\n\nI'm not suggesting we should stop travelling. Travel opens our minds and supports local economies. But we could all travel more responsibly: visiting less crowded places, staying longer instead of rushing between cities, and spending money in businesses owned by local people. If we don't change the way we travel, the places we love may not survive in the form we know them.`, q: [

    ["What is the writer's position?", ["Stop travelling", "Travel more responsibly", "Only travel locally", "Tourism has no problems"], 1],
    ["Which is NOT a suggestion from the writer?", ["Visit less crowded places", "Stay longer", "Use local businesses", "Travel only in groups"], 3]
  ], gloss: [["afford", "permitirse pagar"], ["short-term rentals", "alquileres de corta estancia"], ["soul", "alma"], ["trail", "sendero"], ["unthinkable", "impensable"], ["rush", "ir de prisa"]] }
];

  { title: "Ensayo: trabajo remoto", task: "Escribe un ensayo sobre las ventajas y desventajas del trabajo remoto y da tu opinión final.", words: "180–220", phrases: ["In recent years,... has become increasingly...", "One of the main advantages is that...", "Furthermore / Moreover,...", "However, it could be argued that...", "Taking everything into account, I believe..."], check: ["Tiene introducción, 2 párrafos de desarrollo y conclusión", "Usé conectores de contraste y adición variados", "Usé al menos una pasiva y un condicional", "Mi opinión es clara y está justificada", "No usé contracciones (registro neutro-formal)"], model: "In recent years, working from home has become increasingly common, especially since the pandemic. While it offers clear benefits, it also presents some challenges.\n\nOne of the main advantages is flexibility. Employees save time and money on commuting, and they can organise their day around their personal needs. Furthermore, many companies have found that productivity does not decrease when staff work remotely, and they can even reduce the cost of office space.\n\nHowever, it could be argued that remote work has a negative impact on teamwork and learning. Junior employees, in particular, may find it difficult to develop their skills without regular contact with experienced colleagues. In addition, some workers feel isolated and find it hard to separate their professional and private lives.\n\nTaking everything into account, I believe that a hybrid model is the most effective solution. If employees spent two or three days in the office, they would benefit from both the flexibility of remote work and the human connection of the workplace." },

  { title: "Carta formal de queja", task: "Escribe una carta a una aerolínea quejándote por un vuelo cancelado sin aviso y pidiendo una compensación.", words: "160–200", phrases: ["I am writing to complain about...", "To make matters worse,...", "I was extremely disappointed to...", "I would therefore like to request...", "I trust that you will deal with this matter promptly."], check: ["Expliqué los hechos con fechas y detalles", "Mantuve un tono firme pero educado", "Pedí una solución concreta", "Usé registro formal y sin contracciones"], model: "Dear Sir or Madam,\n\nI am writing to complain about the cancellation of flight AV245 from Bogotá to Madrid on 12 March, for which I had a confirmed booking.\n\nI arrived at the airport three hours before departure, only to be informed at the gate that the flight had been cancelled. No explanation was given, and I had not received any notification by email or text message. To make matters worse, the staff were unable to offer me an alternative flight until two days later, which meant that I missed an important business meeting.\n\nI was extremely disappointed by the lack of communication and the poor assistance I received. In addition, I had to pay for two nights in a hotel and several meals, for which I have kept the receipts.\n\nI would therefore like to request a full refund of these expenses, as well as the compensation to which I am entitled under your passenger rights policy.\n\nI trust that you will deal with this matter promptly.\n\nYours faithfully,\nMaría Fernanda López" }

  { id: "c1-7", title: "Tiempos narrativos avanzados", explain: `<p>Para narrar con precisión se combinan: <b>pasado simple</b> (eventos principales), <b>pasado continuo</b> (contexto), <b>pasado perfecto</b> (algo anterior) y <b>pasado perfecto continuo</b> (duración antes de otro momento): <i>By the time the police arrived, the thieves had already escaped. She had been working there for years before anyone noticed her talent.</i></p><p>Futuro en el pasado: <b>was going to / would / was about to</b>: <i>I was about to leave when he called.</i></p>`, ex: [

    ["mc", "She was exhausted because she ___ all night.", ["had been studying", "has studied", "was study"], 0, "Duración antes de un momento pasado."],

  { id: "c1-8", title: "Marcadores del discurso y cohesión", explain: `<p>En textos C1 se espera variedad y precisión: <b>adición</b> (furthermore, what is more, not to mention), <b>contraste</b> (nonetheless, even so, that said, on the other hand), <b>causa/efecto</b> (consequently, hence, owing to, given that), <b>concesión</b> (admittedly, granted), <b>ejemplificación</b> (to illustrate, namely), <b>conclusión</b> (all things considered, in short).</p><p>Ojo con la puntuación: <i>However,</i> / <i>Therefore,</i> al inicio llevan coma; <i>owing to</i> va con sustantivo.</p>`, ex: [
    ["mc", "The plan is risky. ___, it's our best option.", ["Even so", "Owing to", "Namely"], 0, "Contraste: even so."],
    ["mc", "The match was cancelled ___ the storm.", ["owing to", "although", "hence"], 0, "Owing to + sustantivo."],
    ["fill", "___, the results were disappointing. (Hay que admitirlo)", ["admittedly"], "Concesión: admittedly."],
    ["mc", "Prices rose sharply; ___, demand fell.", ["consequently", "nonetheless", "granted"], 0, "Efecto: consequently."],
    ["mc", "Two countries, ___ Peru and Chile, signed the deal.", ["namely", "hence", "albeit"], 0, "Namely = a saber."],
    ["fix", "Despite of the rain, we went out.", ["Despite the rain, we went out.", "In spite of the rain, we went out."], "Despite sin of."],
    ["tr", "Dicho esto, no estoy totalmente en contra.", ["That said, I'm not completely against it.", "That said, I am not completely against it.", "Having said that, I'm not completely against it.", "That said, I'm not totally against it."], "That said = dicho esto."],
    ["mc", "___, the new policy has been a success.", ["All things considered", "Owing to", "Even though"], 0, "Conclusión."]
  ]},
  { id: "c1-9", title: "Verbos con dependencias y patrones complejos", explain: `<p>Verbos cuyo significado cambia con -ing o to: <b>remember/forget</b> (<i>I remember meeting her</i> = recuerdo haberla conocido; <i>Remember to call</i> = no olvides llamar), <b>stop</b>, <b>try</b> (<i>try to</i> = esforzarse; <i>try -ing</i> = probar), <b>regret</b>, <b>go on</b>, <b>mean</b>.</p><p>Verbo + objeto + infinitivo sin to: <b>make, let, have</b> (<i>They made me wait</i>); con to: <b>allow, force, encourage</b>.</p>`, ex: [
    ["mc", "I'll never forget ___ the Pope.", ["to meet", "meeting", "meet"], 1, "Recuerdo del pasado: -ing."],
    ["mc", "We stopped ___ a coffee on the way.", ["to have", "having", "have"], 0, "Paramos para tomar: to."],
    ["mc", "If the printer doesn't work, try ___ it off and on.", ["to turn", "turning", "turn"], 1, "Probar una solución: -ing."],
    ["fill", "My boss made me ___ (stay) late.", ["stay"], "Make + objeto + verbo base."],

    ["tr", "Me animó a postularme al puesto.", ["She encouraged me to apply for the job.", "He encouraged me to apply for the job.", "She encouraged me to apply for the position.", "He encouraged me to apply for the position."], "Encourage + objeto + to."],
    ["mc", "This new job will mean ___ abroad.", ["to move", "moving", "move"], 1, "Mean + -ing = implicar."]

  { id: "c1-10", title: "Intensificadores, atenuadores y adverbios precisos", explain: `<p>Con adjetivos "fuertes" (absolutos) se usa <b>absolutely, utterly, totally</b>: <i>absolutely exhausted</i> (no <i>very exhausted</i>). Con adjetivos graduables, <b>very, extremely, fairly, rather</b>.</p><p>Colocaciones de adverbio: <i>deeply concerned, bitterly disappointed, highly recommended, widely believed, painfully slow, strongly disagree</i>. Atenuadores: <i>somewhat, slightly, a tad, to some extent</i>.</p>`, ex: [

READINGS.C1 = [
  { title: "The paradox of choice", text: `Conventional wisdom holds that more choice is always better. If one type of jam makes customers happy, surely twenty-four types will make them happier still. Yet a growing body of research suggests that, beyond a certain point, an abundance of options can be counterproductive.\n\nIn a frequently cited experiment, shoppers who were presented with a display of twenty-four varieties of jam were considerably more likely to stop and look than those who saw only six. However, they were roughly ten times less likely to actually make a purchase. Faced with too many alternatives, people seemed to become paralysed, unable to commit to a decision for fear of choosing wrongly.\n\nThe phenomenon extends well beyond supermarkets. Psychologists argue that excessive choice in careers, relationships and even streaming platforms can lead to anxiety, regret and a nagging sense that we might have done better. Paradoxically, those who insist on finding the "best" option, so-called maximisers, tend to report lower levels of satisfaction than "satisficers", who settle for an option that is simply good enough.\n\nThat said, the evidence is not entirely conclusive. Subsequent studies have struggled to replicate the original findings consistently, and some researchers contend that the effect depends heavily on context, such as how familiar people are with the product or how options are organised. What seems undeniable, however, is that more is not invariably better, and that learning when to stop searching may be a skill worth cultivating.`, q: [
    ["What is the 'conventional wisdom' mentioned in the first paragraph?", ["Fewer options are better.", "More choice always improves outcomes.", "Jam is a popular product.", "Customers dislike choosing."], 1],
    ["What happened with the 24-jam display?", ["It attracted fewer people.", "It attracted more people but led to far fewer purchases.", "Sales increased tenfold.", "Nobody stopped."], 1],
    ["How do 'maximisers' differ from 'satisficers'?", ["Maximisers are happier.", "Maximisers seek the best and tend to be less satisfied.", "Satisficers spend more money.", "There is no difference."], 1],
    ["What does the final paragraph suggest about the evidence?", ["It's completely conclusive.", "It has been proved false.", "It's not entirely conclusive and may depend on context.", "Nobody has tried to replicate it."], 2],
    ["What is the writer's overall stance?", ["Choice should be eliminated.", "More is not always better; knowing when to stop is valuable.", "Supermarkets should sell less jam.", "Psychology research is unreliable."], 1]
  ], gloss: [["conventional wisdom", "creencia generalizada"], ["counterproductive", "contraproducente"], ["commit to", "comprometerse con"], ["nagging", "persistente / que molesta"], ["settle for", "conformarse con"], ["invariably", "invariablemente"]] },
  { title: "Should we trust our memories?", text: `Most of us assume that our memories function rather like a video recording: an accurate, if occasionally blurry, record of what happened. Decades of research in cognitive psychology, however, paint a very different picture. Memory, it turns out, is not so much retrieved as reconstructed every time we recall an event.\n\nIn a series of landmark studies, participants watched footage of a car accident and were then asked how fast the cars were going when they "smashed into" or "hit" each other. Those who heard the word "smashed" not only estimated higher speeds but, a week later, were far more likely to falsely remember seeing broken glass at the scene. A single word had been enough to alter their recollection.\n\nThe implications are profound, particularly for the justice system. Eyewitness testimony has long been regarded as among the most persuasive forms of evidence in court, yet it has been implicated in a substantial proportion of wrongful convictions later overturned by DNA evidence. Witnesses are rarely lying; rather, they are sincerely convinced of memories that have been shaped by leading questions, conversations with others or media coverage.\n\nNone of this means that memory is useless. For everyday purposes, it serves us remarkably well. But it should make us more humble about the certainty with which we recount the past, and more cautious about treating confident recollection as proof of accuracy.`, q: [
    ["How do most people think memory works, according to the text?", ["Like a reconstruction", "Like a video recording", "Like a dream", "Like a computer search"], 1],
    ["What did the 'smashed' group tend to remember falsely?", ["A second car", "Broken glass", "A police officer", "Rain"], 1],
    ["Why is this research important for the justice system?", ["Witnesses often lie.", "Eyewitness testimony has contributed to wrongful convictions.", "DNA evidence is unreliable.", "Courts don't use witnesses."], 1],
    ["According to the writer, why do witnesses give inaccurate testimony?", ["They are paid to lie.", "They sincerely believe memories shaped by external influences.", "They have poor eyesight.", "They forget everything."], 1],
    ["What is the main lesson of the final paragraph?", ["Memory is useless.", "We should be more humble about the certainty of our memories.", "Eyewitnesses should be banned.", "We should record everything on video."], 1]

  { title: "Report: Reducing staff turnover", text: `Introduction\nThe aim of this report is to examine the reasons behind the high staff turnover recorded in the customer service department over the past year and to propose measures to address the issue.\n\nFindings\nExit interviews conducted with 34 former employees reveal three recurring concerns. Firstly, over two thirds of respondents cited a lack of opportunities for career progression as their primary reason for leaving. Secondly, many felt that their workload had increased substantially without a corresponding rise in salary. Finally, a significant number reported that they had received little or no feedback from their managers, which left them feeling undervalued.\n\nRecommendations\nIn light of these findings, it is recommended that the company introduce a clear career framework, outlining the skills and experience required for promotion at each level. Furthermore, workloads should be reviewed on a quarterly basis to ensure they remain manageable. It would also be advisable to provide training for managers in giving regular, constructive feedback.\n\nConclusion\nWhile implementing these measures will require an initial investment, the cost of recruiting and training new staff is considerably higher. Should the proposals be adopted, turnover is likely to fall significantly within twelve months.`, q: [

WRITING.C1 = [
  { title: "Ensayo: ¿regular la IA?", task: "Escribe un ensayo argumentativo: ¿deberían los gobiernos regular estrictamente la inteligencia artificial? Presenta ambas posturas y defiende la tuya.", words: "250–280", phrases: ["It is often argued that...", "Proponents of... contend that...", "While there is some merit in this view,...", "It would be naive to assume that...", "On balance, I would argue that..."], check: ["Introducción que contextualiza y plantea la tesis", "Contraargumento presentado con justicia y refutado", "Usé inversión, hedging o estructuras de énfasis al menos una vez", "Vocabulario preciso, sin repetir las mismas palabras", "Conclusión que no solo repite, sino que sintetiza"], model: "Few technologies have advanced as rapidly as artificial intelligence, and few have generated such intense debate. While some believe that strict regulation is essential to protect society, others warn that it could stifle innovation. This essay will argue that regulation is necessary, provided that it is targeted rather than restrictive.\n\nProponents of minimal regulation contend that excessive rules would slow progress and push companies to relocate to countries with looser legislation. There is some merit in this view: poorly designed laws could indeed place smaller firms at a disadvantage, since only large corporations can afford complex compliance processes.\n\nNevertheless, it would be naive to assume that the market will regulate itself. AI systems are already being used to make decisions about loans, job applications and even medical treatment, often with little transparency. Should these systems contain hidden biases, the consequences for marginalised groups could be severe. What is more, the potential for misinformation and fraud is growing at an alarming rate.\n\nThe solution, therefore, lies not in banning technologies but in regulating their use according to risk. Applications that affect people's rights or safety ought to be subject to independent audits and clear accountability, whereas low-risk tools could remain largely unrestricted.\n\nOn balance, I would argue that well-designed regulation is not an obstacle to innovation but a precondition for public trust. Without that trust, AI is unlikely to reach its full potential." },
  { title: "Informe para tu jefe", task: "Escribe un informe proponiendo una mejora en tu empresa (por ejemplo: formación, bienestar, procesos). Usa secciones con títulos.", words: "220–260", phrases: ["The aim of this report is to...", "It was found that... / Findings indicate that...", "In light of these findings, it is recommended that...", "It would also be advisable to...", "Should these measures be adopted,..."], check: ["Tiene títulos: Introduction, Findings, Recommendations, Conclusion", "Usé lenguaje impersonal y pasivas", "Las recomendaciones son concretas y justificadas", "Usé al menos un condicional formal (Should..., Were...)"], model: "Introduction\nThe aim of this report is to assess the effectiveness of the current onboarding process for new employees and to recommend improvements.\n\nFindings\nA survey of 25 employees who joined in the last year indicates that the onboarding process is perceived as disorganised. Over half reported that they did not receive the necessary equipment on their first day, and many stated that they had to rely on colleagues to understand basic procedures. Furthermore, it was found that new employees take on average four months to become fully productive, compared to the industry benchmark of two.\n\nRecommendations\nIn light of these findings, it is recommended that a structured two-week onboarding programme be introduced, including a clear schedule, training sessions and a designated mentor for each new employee. It would also be advisable to prepare all equipment and system access before the start date. Finally, a short feedback survey should be conducted after the first month in order to identify further areas for improvement.\n\nConclusion\nWhile these measures will require some time and coordination, they are relatively inexpensive. Should they be adopted, new employees are likely to become productive considerably sooner, which would benefit both the teams and the company as a whole." },
  { title: "Artículo de opinión", task: "Escribe un artículo para una revista sobre el impacto de las redes sociales en la forma en que nos relacionamos.", words: "230–260", phrases: ["Ask anyone under thirty...", "There is no denying that...", "What is rarely discussed, however, is...", "Paradoxically,...", "Perhaps the real question is not... but..."], check: ["Título atractivo y una apertura que enganche al lector", "Tono personal pero argumentado", "Usé preguntas retóricas o recursos de estilo", "Incluí al menos una oración escindida (What..., It is... that...)", "Final memorable"], model: "Connected, but Alone?\n\nAsk anyone under thirty how many friends they have, and the answer may well run into the hundreds. Ask how many of those they could call at three in the morning, and the number shrinks dramatically.\n\nThere is no denying that social media has transformed the way we relate to one another. It allows us to stay in touch with relatives abroad, find communities of like-minded people and share our lives instantly. For many, particularly those who feel isolated, these platforms have been a lifeline.\n\nWhat is rarely discussed, however, is the quality of these connections. Paradoxically, the more time we spend interacting online, the lonelier many of us seem to feel. Likes and comments offer a quick sense of approval, but they are no substitute for the depth of a face-to-face conversation. It is the effort of meeting in person, the awkward silences, the shared laughter, that builds genuine intimacy.\n\nNone of this means we should abandon our accounts. Perhaps the real question is not whether social media is good or bad, but whether we use it to enrich our relationships or to replace them. The next time you are tempted to scroll through a friend's photos, you might consider calling them instead. Chances are, they would be glad to hear from you." }
];

  { id: "c2-6", title: "Expresiones idiomáticas avanzadas", explain: `<p>El hablante C2 entiende y usa modismos con naturalidad, sin exagerar: <i>to be on thin ice</i> (en situación arriesgada), <i>to bite off more than you can chew</i> (abarcar demasiado), <i>to beat around the bush</i> (andarse con rodeos), <i>to throw someone under the bus</i> (traicionar para salvarse), <i>a can of worms</i> (asunto problemático), <i>to have a chip on your shoulder</i> (resentimiento).</p>`, ex: [

  { title: "The tyranny of metrics", text: `There is a seductive logic to measurement. What gets measured, the adage goes, gets managed, and in an era awash with data, it has become almost an article of faith that any institution worth its salt should quantify its performance. Hospitals are ranked by waiting times, schools by examination results, academics by citation counts.\n\nYet the relentless pursuit of metrics carries a hidden cost, one that the economist Charles Goodhart identified decades ago. When a measure becomes a target, he observed, it ceases to be a good measure. Surgeons judged on mortality rates may quietly decline to operate on high-risk patients; teachers evaluated on test scores may "teach to the test" at the expense of genuine understanding; police forces rewarded for falling crime figures may be tempted to reclassify offences. In each case, the number improves while the underlying reality it was meant to capture stays the same, or even deteriorates.\n\nNone of this is to suggest that measurement is inherently pernicious. Data can expose inefficiencies, reveal inequalities and hold the powerful to account. The problem arises when numbers are mistaken for the things they represent, when the map is confused with the territory. Many of the qualities we value most, such as trust, curiosity and professional judgement, are precisely those that resist quantification.\n\nThe challenge, then, is not to abandon metrics but to use them with humility: as instruments for inquiry rather than instruments of control. That requires something no spreadsheet can supply, namely the willingness to accept that not everything that counts can be counted.`, q: [
    ["What does 'an article of faith' imply in the first paragraph?", ["A religious duty", "A belief accepted without question", "A legal obligation", "A scientific fact"], 1],
    ["What is Goodhart's observation?", ["Data is always reliable.", "A measure that becomes a target stops being a good measure.", "Targets improve performance.", "Metrics should be secret."], 1],
    ["What do the examples of surgeons, teachers and police illustrate?", ["Professional incompetence", "Numbers improving while reality doesn't", "The value of rankings", "Corruption in public services"], 1],
    ["What does 'the map is confused with the territory' mean here?", ["People get lost.", "Numbers are mistaken for the reality they represent.", "Maps are inaccurate.", "Institutions grow too large."], 1],
    ["What is the writer's conclusion?", ["Abandon metrics entirely.", "Use metrics humbly, as tools for inquiry.", "Measure everything more precisely.", "Only use qualitative data."], 1]
  ], gloss: [["awash with", "inundado de"], ["worth its salt", "que se precie"], ["relentless", "implacable"], ["pernicious", "pernicioso"], ["hold to account", "pedir cuentas"], ["inquiry", "indagación"]] },
  { title: "In praise of slowness in language learning", text: `Language learning apps promise fluency in weeks, and social media is replete with polyglots who claim to have mastered Mandarin in a summer. It is hardly surprising, then, that so many learners feel disheartened when, after years of study, they still stumble over phrasal verbs or fail to catch a joke at a dinner party.\n\nThe disconnect stems, in part, from a misunderstanding of what advanced proficiency entails. Reaching an intermediate level is largely a matter of acquiring grammar and core vocabulary, which can indeed be achieved relatively quickly with sustained effort. Beyond that point, however, progress becomes less visible. The gap between a competent speaker and a truly proficient one lies in thousands of collocations, idioms, cultural references and subtle shifts of register, knowledge that is absorbed gradually through extensive exposure rather than memorised in lists.\n\nThis is why the so-called intermediate plateau is so common, and so dispiriting. Learners continue to put in the hours yet feel they are standing still. In reality, they are consolidating: their comprehension is deepening, their recall becoming faster, their intuition for what sounds natural growing sharper. These changes are real, but they rarely announce themselves.\n\nThe remedy, if there is one, is to shift from studying the language to living in it: reading novels rather than graded texts, listening to podcasts at native speed, writing for real audiences. Above all, it means accepting that mastery is less a destination than a direction, a process measured not in weeks but in years.`, q: [
    ["Why do many learners feel disheartened?", ["Apps are too expensive.", "They compare themselves with unrealistic promises.", "Grammar is impossible.", "They have no time."], 1],
    ["What distinguishes a proficient speaker from a competent one?", ["Basic grammar", "Thousands of collocations, idioms and subtleties", "A better accent only", "Speed of speech"], 1],
    ["What is really happening during the 'plateau'?", ["Nothing; learners stop improving.", "Learners are consolidating knowledge in less visible ways.", "Learners forget vocabulary.", "Learners should quit."], 1],
    ["What remedy does the writer propose?", ["More grammar drills", "Living in the language through authentic materials", "Using more apps", "Studying less"], 1],
    ["What does 'mastery is less a destination than a direction' mean?", ["Mastery is impossible.", "Mastery is an ongoing process, not an endpoint.", "Travel helps language learning.", "Directions are hard to learn."], 1]
  ], gloss: [["replete with", "repleto de"], ["disheartened", "desanimado"], ["stumble over", "trastabillar con"], ["entails", "implica"], ["dispiriting", "desalentador"], ["consolidating", "consolidando"]] }
];

  { title: "Entrevista radial: el futuro de las ciudades", lines: [["A", "Professor, you've argued that the car-centric city is, in your words, a twentieth-century anomaly. Isn't that rather provocative?"], ["B", "Deliberately so. For most of human history, cities were built at walking pace. It's only in the last hundred years or so that we've reshaped them around vehicles, and frankly, the results have been mixed at best."], ["A", "But surely cars brought enormous freedom?"], ["B", "They did, and I wouldn't dream of denying that. My point is that we've allowed that freedom to come at the expense of everyone who doesn't drive: children, the elderly, people who can't afford a car."], ["A", "So what would you have city planners do?"], ["B", "Nothing radical, really. Reclaim some street space for pedestrians and cyclists, invest in reliable public transport, and design neighbourhoods where daily needs are within a fifteen-minute walk. Paris and Bogotá have already shown it can be done."]], q: [

    ["Frankly, I've seen dozens of apps like yours. Why should I believe yours is any different?", "Responde con seguridad: lo que te distingue es que ya tienes clientes que pagan y un crecimiento sostenido.", ["What sets us apart is that we already have paying customers and sustained growth.", "The difference is that we're not just an idea: we have paying clients and consistent growth.", "Unlike most, we already have a paying customer base and steady growth month on month."]],

WRITING.C2 = [
  { title: "Ensayo crítico", task: "Ensayo: ¿el progreso tecnológico nos hace más libres? Desarrolla un argumento matizado, con ejemplos y contraargumentos.", words: "300–350", phrases: ["It has become something of a truism that...", "This view, however, rests on the premise that...", "To dismiss... would be equally misguided.", "Herein lies the paradox:...", "Ultimately, the question is not whether... but..."], check: ["Tesis matizada, no binaria", "Argumentación con ejemplos concretos y precisos", "Variedad de estructuras: inversión, fronting, escindidas, nominalización", "Vocabulario C2 preciso (sin repetir 'important', 'big', 'good')", "Cohesión impecable y conclusión que aporta una idea nueva"], model: "It has become something of a truism that technological progress has liberated humanity. We can communicate instantly across continents, access the sum of human knowledge from our pockets and work from almost anywhere. Yet this narrative of emancipation, compelling as it is, obscures a more ambivalent reality.\n\nThere is no denying that technology has expanded the range of choices available to us. Remote work has freed millions from the tyranny of the daily commute; online education has opened doors to those who could never have afforded a university; social platforms have given a voice to communities long ignored by traditional media. To dismiss these gains would be not only ungrateful but misguided.\n\nThis view, however, rests on the premise that more options necessarily translate into greater freedom. In practice, the very devices that connect us also monitor us, harvesting data to predict and shape our behaviour. The algorithms that curate our news feeds subtly narrow the range of opinions we encounter, while the expectation of constant availability has blurred the boundary between work and private life. Herein lies the paradox: the tools that promise autonomy may, if left unchecked, erode it.\n\nWhat matters, then, is not technology itself but the conditions under which it is designed and used. Where users understand and control how their data is employed, and where regulation ensures transparency, technology can genuinely enhance freedom. Where it is driven solely by the imperative to capture attention, it risks becoming a gilded cage.\n\nUltimately, the question is not whether technological progress makes us freer, but whether we are prepared to shape it so that it does." },
  { title: "Discurso persuasivo", task: "Escribe un discurso para una conferencia internacional defendiendo una reforma educativa que consideres necesaria.", words: "280–320", phrases: ["Ladies and gentlemen,", "Imagine, for a moment,...", "Let me be clear:...", "It is not enough to...; we must...", "The question before us is not whether we can afford to..., but whether we can afford not to."], check: ["Apertura que capta la atención", "Uso de recursos retóricos (tríadas, preguntas, repetición)", "Argumentos sólidos con datos o ejemplos", "Llamado a la acción claro al final", "Registro formal pero cercano a la audiencia"], model: "Ladies and gentlemen,\n\nImagine, for a moment, a child who can recite the dates of every major battle in history but cannot tell a reliable news source from a fabricated one. Imagine a graduate who has memorised hundreds of formulas yet has never been asked to solve a problem that matters to her community. This, I would argue, is the paradox at the heart of many education systems today.\n\nLet me be clear: knowledge matters. But in a world where information is abundant and instantly available, what distinguishes an educated person is no longer how much they know, but what they can do with what they know. Can they evaluate evidence? Can they collaborate with people who think differently? Can they adapt when the jobs of today disappear tomorrow?\n\nThe reform I am proposing is neither radical nor untested. It rests on three pillars: teaching critical thinking explicitly, from primary school onwards; replacing a significant proportion of standardised exams with project-based assessment; and investing in the training of teachers, who remain, without doubt, the single most important factor in any classroom.\n\nCountries that have embraced similar approaches have seen not only higher levels of student engagement but also stronger results in international assessments. The evidence, in short, is on our side.\n\nIt is not enough to update our textbooks; we must rethink what we expect education to achieve. The question before us is not whether we can afford to reform our schools, but whether we can afford not to.\n\nThank you." }
];
