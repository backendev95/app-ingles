    drills: [["mc", "I'm looking forward to ___ you next week.", ["see", "seeing", "saw"], 1, "Look forward to + -ing."], ["mc", "I'd rather walk ___ take the bus.", ["than", "that", "to"], 0, "I'd rather X than Y."], ["mc", "I feel ___ going for a walk.", ["like", "as", "to"], 0, "Feel like + -ing."], ["sub", "I want to buy a new laptop.", "I'm thinking of...", ["I'm thinking of buying a new laptop."], "Thinking of + -ing."], ["blocks", "Prefiero quedarme en casa que salir.", ["I'd rather", "stay at home", "than", "go out"]], ["mc", "Coffee or tea? — I don't ___.", ["mind", "matter", "care of"], 0, "I don't mind = me da igual."]] },
  { id: "ch-explain", level: "B1", icon: "🧠", title: "Explicar y aclarar", intro: "Cuando no encuentras la palabra exacta o quieres aclarar algo, estos chunks te dan tiempo y te ayudan a reformular.",
    items: [["What I mean is...", "Lo que quiero decir es...", "What I mean is that we need more people."], ["In other words,...", "En otras palabras,...", "In other words, it's not ready."], ["Let me put it another way.", "Déjame decirlo de otra forma.", "Let me put it another way: we're late."], ["The thing is,...", "La cosa es que...", "The thing is, I don't have time."], ["It's a kind of...", "Es una especie de...", "It's a kind of tool for designers."], ["What I'm trying to say is...", "Lo que intento decir es...", "What I'm trying to say is that it's risky."], ["Does that make sense?", "¿Tiene sentido?", "We'll do it in two steps. Does that make sense?"], ["To put it simply,...", "Para decirlo simple,...", "To put it simply, it's too expensive."]],
    drills: [["mc", "The ___ is, I don't really like my job.", ["thing", "point of", "fact of"], 0, "The thing is,..."], ["mc", "Let me put it ___ way.", ["another", "other", "different"], 0, "Let me put it another way."], ["mc", "We'll split the work. Does that make ___?", ["sense", "meaning", "logic"], 0, "Does that make sense?"], ["sub", "I mean that we need more time.", "What I mean is...", ["What I mean is that we need more time.", "What I mean is we need more time."], ""], ["blocks", "En otras palabras, todavía no está listo.", ["In other words,", "it isn't", "ready yet"]], ["mc", "'To put it simply' significa:", ["Para decirlo simple", "Ponerlo fácil", "Simplemente poner"], 0, ""]] },
  { id: "ch-fillers", level: "B1", icon: "⏳", title: "Ganar tiempo al hablar", intro: "Los nativos también se quedan en blanco: usan muletillas para pensar sin quedarse callados. Usarlas te da fluidez inmediata.",
    items: [["Let me think...", "Déjame pensar...", "Let me think... maybe Tuesday?"], ["That's a good question.", "Buena pregunta.", "That's a good question. I'm not sure."], ["How can I put it?", "¿Cómo lo digo?", "How can I put it? It's complicated."], ["Well, you know,...", "Bueno, ya sabes,...", "Well, you know, it depends."], ["I mean,...", "O sea,...", "I mean, it's not bad, but it's not great."], ["Kind of / sort of", "Más o menos / algo así", "It's kind of hard to explain."], ["Actually,...", "En realidad,...", "Actually, I've never been there."], ["Anyway,...", "En fin / De todos modos,...", "Anyway, let's get back to work."]],
    drills: [["mc", "That's a good ___. Let me think about it.", ["question", "ask", "asking"], 0, ""], ["mc", "'Actually' significa:", ["Actualmente", "En realidad", "Activamente"], 1, "Falso amigo."], ["mc", "It's ___ of difficult to explain.", ["kind", "type", "class"], 0, "Kind of = más o menos."], ["mc", "___, let's move on to the next topic.", ["Anyway", "Anyways of", "In any way"], 0, "Anyway = en fin."], ["blocks", "¿Cómo lo digo? Es complicado.", ["How can", "I put it?", "It's complicated"]], ["sub", "I don't know.", "gana tiempo con Let me think...", ["Let me think... I don't know.", "Let me think. I don't know."], "Cualquier respuesta con Let me think vale."]] },
  { id: "ch-connect", level: "B2", icon: "🔗", title: "Conectar ideas al hablar", intro: "Estos chunks hacen que tus argumentos suenen organizados y avanzados, sin parecer un texto escrito.",
    items: [["On top of that,...", "Además de eso,...", "It's expensive. On top of that, it's slow."], ["Having said that,...", "Dicho esto,...", "It's risky. Having said that, I think we should try."], ["The point is,...", "El punto es que...", "The point is, we can't wait any longer."], ["Not to mention...", "Por no mencionar...", "It's cheap, not to mention very fast."], ["When it comes to...", "Cuando se trata de...", "When it comes to food, I'm very picky."], ["At the end of the day,...", "Al fin y al cabo,...", "At the end of the day, it's your decision."], ["As a matter of fact,...", "De hecho,...", "As a matter of fact, I was there."], ["That's why...", "Por eso...", "I was tired. That's why I left early."]],
    drills: [["mc", "When it ___ to sports, I prefer football.", ["comes", "goes", "turns"], 0, "When it comes to..."], ["mc", "It's a great job, not to ___ the salary.", ["mention", "say", "talk"], 0, "Not to mention..."], ["mc", "At the end of the ___, family is what matters.", ["day", "time", "life"], 0, ""], ["sub", "It's expensive. Also, it's very slow.", "On top of that", ["It's expensive. On top of that, it's very slow."], ""], ["blocks", "Dicho esto, creo que deberíamos intentarlo.", ["Having said that,", "I think", "we should", "give it a try"]], ["mc", "The traffic was terrible. ___ I was late.", ["That's why", "That's because", "So that"], 0, "That's why = por eso."]] },
  { id: "ch-meetings", level: "B2", icon: "💼", title: "Reuniones y trabajo", intro: "Las reuniones en inglés siguen guiones muy repetidos. Aprender estos bloques te permite participar con seguridad desde el primer día.",
    items: [["Let's get started.", "Empecemos.", "OK everyone, let's get started."], ["Moving on to...", "Pasando a...", "Moving on to the next point, the budget."], ["Just to recap,...", "Para resumir,...", "Just to recap, we agreed on three things."], ["Can I jump in here?", "¿Puedo intervenir?", "Sorry, can I jump in here?"], ["Let's circle back to that.", "Retomemos eso luego.", "Good question, let's circle back to that."], ["I'll keep you posted.", "Te mantengo al tanto.", "I'll keep you posted on the progress."], ["Does anyone have any questions?", "¿Alguien tiene preguntas?", "Does anyone have any questions before we finish?"], ["Let's wrap it up.", "Cerremos aquí.", "We're out of time, let's wrap it up."]],
    drills: [["mc", "Sorry, can I ___ in here?", ["jump", "go", "enter"], 0, "Jump in = intervenir."], ["mc", "Just to ___, the deadline is Friday.", ["recap", "repeat", "return"], 0, ""], ["mc", "I'll keep you ___.", ["posted", "posting", "post"], 0, "Keep someone posted."], ["sub", "We will talk about that later.", "Let's circle back...", ["Let's circle back to that later.", "Let's circle back to that."], ""], ["blocks", "Pasando al siguiente punto, el presupuesto.", ["Moving on to", "the next point,", "the budget"]], ["mc", "We're out of time, let's ___ it up.", ["wrap", "close", "finish"], 0, "Wrap it up."]] },
  { id: "ch-experience", level: "B1", icon: "📖", title: "Contar experiencias", intro: "Para contar historias, estos bloques ordenan el relato y le dan vida.",
    items: [["I'll never forget the time...", "Nunca olvidaré la vez...", "I'll never forget the time I got lost in London."], ["Back then,...", "En aquel entonces,...", "Back then, I didn't speak English."], ["The first time I...", "La primera vez que...", "The first time I flew, I was terrified."], ["It turned out that...", "Resultó que...", "It turned out that he was the boss."], ["All of a sudden,...", "De repente,...", "All of a sudden, the lights went out."], ["In the end,...", "Al final,...", "In the end, everything was fine."], ["I've never... before.", "Nunca había... antes.", "I've never seen snow before."], ["To cut a long story short,...", "Para no hacer el cuento largo,...", "To cut a long story short, we missed the flight."]],
    drills: [["mc", "All of a ___, it started to rain.", ["sudden", "suddenly", "surprise"], 0, ""], ["mc", "It ___ out that the restaurant was closed.", ["turned", "came", "went"], 0, "It turned out that..."], ["mc", "To ___ a long story short, I got the job.", ["cut", "make", "do"], 0, ""], ["sub", "Finally, we arrived at the hotel.", "In the end,...", ["In the end, we arrived at the hotel."], ""], ["blocks", "Nunca olvidaré la vez que conocí a mi esposa.", ["I'll never forget", "the time", "I met my wife"]], ["mc", "___ then, I lived in Cali.", ["Back", "Before", "At"], 0, "Back then = en aquel entonces."]] },
  { id: "ch-collocations", level: "B1", icon: "🧲", title: "Colocaciones: make, do, take, have", intro: "Muchas combinaciones verbo + sustantivo no se traducen palabra por palabra: hay que aprenderlas como bloque.",
    items: [["make a decision", "tomar una decisión", "We need to make a decision today."], ["make a mistake", "cometer un error", "Everyone makes mistakes."], ["do homework / do the dishes", "hacer la tarea / lavar los platos", "I'll do the dishes after dinner."], ["do business", "hacer negocios", "We do business with Mexico."], ["take a break", "tomar un descanso", "Let's take a five-minute break."], ["take a picture", "tomar una foto", "Can you take a picture of us?"], ["have a look", "echar un vistazo", "Can you have a look at my code?"], ["pay attention", "prestar atención", "Please pay attention to the details."]],
    drills: [["mc", "I ___ a mistake in the report.", ["made", "did", "took"], 0, "Make a mistake."], ["mc", "Let's ___ a break.", ["take", "make", "do"], 0, ""], ["mc", "Can you ___ a look at this?", ["have", "make", "do"], 0, "Have/take a look."], ["mc", "I need to ___ my homework.", ["do", "make", "take"], 0, "Do homework."], ["mc", "You have to ___ attention.", ["pay", "put", "make"], 0, "Pay attention."], ["sub", "We need to decide now.", "make a decision", ["We need to make a decision now."], ""], ["blocks", "¿Puedes tomarnos una foto?", ["Can you", "take a picture", "of us?"]]] }
];

// ===== CONNECTED SPEECH: curso =====
// examples: [escrito, cómo suena, nota]
// practice: frases para dictado a velocidad natural
const CS_UNITS = [
  { id: "cs-intro", title: "Qué es el connected speech", explain: `<p>Cuando los nativos hablan a velocidad normal no pronuncian cada palabra por separado: <b>unen</b> palabras, <b>reducen</b> las que no son importantes y a veces <b>cambian o eliminan</b> sonidos. Por eso puedes entender un texto escrito y no entender la misma frase hablada.</p><p>No necesitas hablar así para que te entiendan, pero sí <b>reconocerlo</b> para entender a los nativos. Y si lo usas con moderación, sonarás mucho más natural.</p><p>En toda la app verás el recuadro <b>🔗 Así suena</b> debajo de las frases. Leyenda: <span class="cs-link">‿</span> palabras unidas · <span class="cs-weak">to</span> forma débil · <span class="cs-red">gonna</span> reducción · <span class="cs-elide">t</span> sonido que casi desaparece · <span class="cs-flap">t</span> T que suena como una «d» suave.</p>`,
    examples: [["What do you want to do?", "Whaddya wanna do?", "Reducción y asimilación"], ["I'm going to have a look at it.", "I'm gonna have a look‿at‿it.", "Reducción y unión"], ["Did you eat yet?", "Didja eat yet?", "Asimilación d + y"], ["Let me get it for you.", "Lemme ged‿it fər you.", "Reducción, T americana y forma débil"]],
    practice: ["What do you want to do tonight?", "I'm going to call you later.", "Did you finish it?", "Let me know if you need anything."] },
  { id: "cs-linking", title: "Unir consonante + vocal (linking)", explain: `<p>Cuando una palabra termina en <b>sonido de consonante</b> y la siguiente empieza con <b>vocal</b>, la consonante se pasa a la siguiente palabra: <i>turn it off</i> suena «tur-ni-toff»; <i>pick it up</i> suena «pi-ki-tup».</p><p>Ojo: lo que cuenta es el sonido, no la letra. <i>make it</i> también se une (la e de make no suena): «may-kit».</p>`,
    examples: [["Turn it off.", "Tur‿ni‿toff.", ""], ["Pick it up.", "Pi‿ki‿tup.", ""], ["Look at it.", "Loo‿ka‿tit.", ""], ["Check it out.", "Che‿ki‿tout.", ""], ["Can I have an apple?", "Ca‿nI have a‿napple?", ""], ["It's an old idea.", "It's a‿nol‿didea.", ""]],
    practice: ["Turn it off and put it away.", "Check it out on our website.", "Can I ask a question?", "Hold on a minute.", "Come in and sit down."] },
  { id: "cs-vowels", title: "Unir vocal + vocal (sonidos y / w)", explain: `<p>Entre dos vocales aparece un sonido de enlace muy suave:</p><ul><li>Después de <b>i, ee, ay, y</b> se mete una <b>y</b>: <i>I am</i> → «I‿(y)am», <i>the end</i> → «the‿(y)end», <i>say it</i> → «say‿(y)it».</li><li>Después de <b>o, oo, u, ow</b> se mete una <b>w</b>: <i>go on</i> → «go‿(w)on», <i>do it</i> → «do‿(w)it», <i>how are you</i> → «how‿(w)are you».</li></ul>`,
    examples: [["I am ready.", "I‿(y)am ready.", "sonido y"], ["See you at the end.", "See you‿(w)at the‿(y)end.", "w y y"], ["Go on!", "Go‿(w)on!", "sonido w"], ["Do it again.", "Do‿(w)i‿tagain.", "w + linking"], ["How are you?", "How‿(w)are you?", "sonido w"], ["Say it again.", "Say‿(y)i‿tagain.", "y + linking"]],
    practice: ["I am so happy to see you.", "Go on, try it again.", "How about the other one?", "Do it as soon as you can."] },
  { id: "cs-weak", title: "Formas débiles: to, for, of, and, can…", explain: `<p>Las palabras gramaticales casi siempre se dicen <b>débiles</b>, con la vocal neutra /ə/ (schwa):</p><ul><li><b>to</b> → tə · <b>for</b> → fər · <b>of</b> → əv · <b>and</b> → ən · <b>or</b> → ər</li><li><b>can</b> → kən · <b>was</b> → wəz · <b>were</b> → wər · <b>are</b> → ər · <b>a</b> → ə · <b>the</b> → thə</li><li><b>him</b> → im · <b>her</b> → ər · <b>them</b> → əm (la h y la th a veces desaparecen)</li></ul><p>Se dicen fuertes solo al final de la frase o si quieres enfatizarlas: <i>Yes, I <b>can</b>!</i> Ojo: <b>can't</b> nunca se reduce; por eso se distingue de <i>can</i> por la vocal: «kən» vs «kænt».</p>`,
    examples: [["I want to go to the bank.", "I wanna go tə thə bank.", "to → tə"], ["A cup of tea for me, please.", "Ə cup əv tea fər me, please.", "of → əv, for → fər"], ["Fish and chips.", "Fish ən chips.", "and → ən"], ["I can swim, but I can't dive.", "I kən swim, bət I can't dive.", "can débil vs can't fuerte"], ["Tell him I was at work.", "Tell‿im I wəz ət work.", "him → im"], ["Where are they from?", "Where ər they from?", "from al final: fuerte"]],
    practice: ["I'd like a cup of coffee and a sandwich.", "She was waiting for her friends.", "I can come at five or six.", "Tell them to call me back."] },
  { id: "cs-reductions", title: "Reducciones: gonna, wanna, gotta…", explain: `<p>En el habla informal ciertas combinaciones se funden en una sola palabra. Las verás escritas en chats y canciones, pero en textos formales se escriben completas:</p><ul><li><b>going to</b> → gonna · <b>want to</b> → wanna · <b>got to</b> → gotta · <b>have to</b> → hafta</li><li><b>let me</b> → lemme · <b>give me</b> → gimme · <b>kind of</b> → kinda · <b>sort of</b> → sorta · <b>out of</b> → outta · <b>a lot of</b> → a lotta</li><li><b>don't know</b> → dunno · <b>what do you</b> → whaddya · <b>what are you</b> → whatcha</li></ul><p>Importante: <i>going to</i> solo se reduce cuando es futuro (<i>I'm gonna eat</i>), no cuando vas a un lugar (<i>I'm going to the park</i>).</p>`,
    examples: [["I'm going to tell you something.", "I'm gonna tell you something.", ""], ["Do you want to come?", "D'you wanna come?", ""], ["I've got to go.", "I've gotta go.", ""], ["Let me see.", "Lemme see.", ""], ["Give me a second.", "Gimme ə second.", ""], ["It's kind of weird.", "It's kinda weird.", ""], ["I don't know.", "I dunno.", ""], ["What are you doing?", "Whatcha doing?", ""]],
    practice: ["I'm going to need some help with this.", "Do you want to grab a coffee?", "I have to finish this today.", "Let me think about it.", "It's kind of hard to explain.", "What are you going to do?"] },
  { id: "cs-assimilation", title: "Asimilación: did you → «didja»", explain: `<p>Cuando una palabra termina en <b>t</b> o <b>d</b> y la siguiente es <b>you / your</b>, los sonidos se mezclan:</p><ul><li><b>t + you</b> → «cha»: <i>meet you</i> → «meecha», <i>don't you</i> → «doncha», <i>what you</i> → «whatcha», <i>got you</i> → «gotcha».</li><li><b>d + you</b> → «ja»: <i>did you</i> → «didja», <i>would you</i> → «wouldja», <i>could you</i> → «couldja», <i>and you</i> → «anja».</li></ul><p>También: <i>this year</i> → «thishyear», <i>miss you</i> → «mishyou».</p>`,
    examples: [["Nice to meet you.", "Nice tə meetcha.", "t + you"], ["Did you see that?", "Didja see that?", "d + you"], ["Would you like some tea?", "Wouldja like some tea?", "d + you"], ["Don't you think so?", "Doncha think so?", "t + you"], ["Could you help me?", "Couldja help me?", "d + you"], ["I'll let you know.", "I'll letcha know.", "t + you"]],
    practice: ["Did you get my message?", "Would you mind closing the door?", "Nice to meet you, I'm Laura.", "What did you say?", "Could you send it to me?"] },
  { id: "cs-elision", title: "Elisión: sonidos que desaparecen", explain: `<p>Una <b>t</b> o <b>d</b> entre dos consonantes casi no se pronuncia: <i>next week</i> → «nex week», <i>last night</i> → «las night», <i>sandwich</i> → «sanwich», <i>don't know</i> → «don know».</p><p>Esto explica por qué a veces no oyes el pasado: <i>I walked to work</i> suena casi «I walk to work». El contexto te ayuda a entender.</p>`,
    examples: [["Next week.", "Nex week.", ""], ["Last night.", "Las night.", ""], ["I don't know.", "I don know.", ""], ["She must be tired.", "She mus be tired.", ""], ["I asked them.", "I ask them.", "La -ed casi desaparece"], ["The best part.", "The bes part.", ""]],
    practice: ["See you next Monday.", "I couldn't sleep last night.", "You must be joking.", "We stopped by the old market.", "It's the best day of my life."] },
  { id: "cs-flap", title: "La T americana (flap T)", explain: `<p>En inglés de Estados Unidos, una <b>t</b> entre vocales (y sin acento después) suena como una <b>d muy rápida</b>, casi como la «r» de «pero»: <i>water</i> → «wader», <i>better</i> → «bedder», <i>city</i> → «cidy», <i>a lot of</i> → «a lodda».</p><p>También pasa entre palabras: <i>get it</i> → «gedit», <i>what about</i> → «whadabout», <i>put it on</i> → «pudidon».</p><p>En inglés británico la t suele mantenerse clara. Ambas formas son correctas.</p>`,
    examples: [["A glass of water.", "Ə glass əv wader.", ""], ["It's getting better.", "It's gedding bedder.", ""], ["What about you?", "Whadabout you?", ""], ["Get it out of here.", "Gedi doudda here.", ""], ["I bought a lot of things.", "I bough də lodda things.", ""], ["It's a beautiful city.", "It's ə beaudiful cidy.", ""]],
    practice: ["Put it on the table.", "It's a little bit better.", "What about a glass of water?", "Get out of the city for a while.", "I forgot it at home."] },
  { id: "cs-rhythm", title: "Ritmo: palabras fuertes y débiles", explain: `<p>El inglés tiene un ritmo marcado por el acento: las <b>palabras de contenido</b> (sustantivos, verbos principales, adjetivos, adverbios, negativos) se dicen fuertes y claras; las <b>palabras gramaticales</b> (artículos, preposiciones, auxiliares, pronombres) se dicen rápidas y débiles.</p><p>Por eso <i>CATS eat FISH</i> y <i>the CATS have been EATing the FISH</i> duran casi lo mismo: se "comprimen" las palabras débiles. Practica marcando un golpe en cada palabra fuerte.</p>`,
    examples: [["I WANT to GO to the BEACH.", "I want tə go tə thə beach.", "3 golpes"], ["She's BEEN WORKing at the BANK for YEARS.", "She's been working ət thə bank fər years.", "4 golpes"], ["WHAT do you THINK about it?", "Whaddya think əbou‿tit?", "2 golpes"], ["I DIDN'T SAY that.", "I didn't say that.", "Los negativos van fuertes"]],
    practice: ["I want to go to the beach this weekend.", "She's been working at the bank for years.", "What do you think about the new plan?", "We should have called them earlier."] }
];

const DEV = {};

DEV.lessons = [
  { id: "dev-standup", icon: "☀️", title: "Daily stand-up", explain: `<p>En la daily cada persona responde tres cosas: qué hizo, qué hará y si tiene bloqueos. Se usa <b>pasado simple</b> o <b>presente perfecto</b> para lo hecho, <b>going to / will</b> para lo siguiente y frases fijas para los bloqueos.</p><p>Sé breve: 30–60 segundos. Los detalles se discuten después (<i>Let's take it offline</i>).</p>`,
    phrases: [["Yesterday I worked on the login page.", "Ayer trabajé en la página de inicio de sesión."], ["I finished the API integration.", "Terminé la integración con la API."], ["Today I'm going to write the unit tests.", "Hoy voy a escribir las pruebas unitarias."], ["I'm blocked by the database migration.", "Estoy bloqueado por la migración de la base de datos."], ["I'm waiting on feedback from the design team.", "Estoy esperando retroalimentación del equipo de diseño."], ["It's taking longer than expected because of some edge cases.", "Está tomando más de lo esperado por algunos casos borde."], ["I should have it ready by tomorrow.", "Debería tenerlo listo para mañana."], ["No blockers on my side.", "Sin bloqueos de mi parte."], ["Can we take this offline?", "¿Lo hablamos aparte después?"], ["I'll sync with Ana after the meeting.", "Me pongo de acuerdo con Ana después de la reunión."]],
    ex: [
      ["mc", "Yesterday I ___ the bug in the payment module.", ["fix", "fixed", "have fix"], 1, "Ayer = pasado simple."],
      ["mc", "I'm blocked ___ the pending code review.", ["by", "of", "for"], 0, "Blocked by = bloqueado por."],
      ["fill", "I'm waiting ___ the QA team to test it.", ["for", "on"], "Wait for / wait on."],
      ["mc", "La frase más natural para decir que no tienes bloqueos:", ["I don't have blocks.", "No blockers on my side.", "There isn't blocking."], 1, "Expresión fija de las dailies."],
      ["tr", "Hoy voy a revisar el pull request de Juan.", ["Today I'm going to review Juan's pull request.", "Today I am going to review Juan's pull request.", "Today I'll review Juan's pull request.", "Today I will review Juan's pull request.", "Today I'm going to review Juan's PR.", "Today I'll review Juan's PR."], "Going to / will + verbo."],

  { q: "Why do you want to work here?", tip: "Menciona algo concreto de la empresa (producto, tecnología, cultura) y conéctalo con tus metas.", model: "I've been following your product for a while, and I really like how you focus on developer experience. Your stack is very close to what I use every day, and I'm especially interested in the work you're doing with real-time data. I think I could contribute from day one and also learn a lot from your team." },
  { q: "Tell me about a challenging bug you solved.", tip: "Usa el método STAR: Situación, Tarea, Acción, Resultado. Habla en pasado y en primera persona.", model: "Last year, our checkout service started failing randomly in production. My task was to find the root cause quickly because we were losing sales. I added more detailed logging, reproduced the issue with a load test, and narrowed it down to a race condition in our payment queue. I implemented a lock and added tests for that case. As a result, the errors dropped to zero and we haven't had the problem since." },
  { q: "Tell me about a time you disagreed with a teammate.", tip: "Muestra que escuchas, argumentas con datos y priorizas al equipo. Termina con un resultado positivo.", model: "In one project, a teammate wanted to rewrite a module from scratch, while I thought we should refactor it gradually. Instead of arguing, we listed the risks and estimated both options together. We agreed on a gradual refactor with clear milestones. In the end, we delivered on time, and he later told me he appreciated how we handled it." },
  { q: "What is your greatest weakness?", tip: "Elige una debilidad real pero no crítica, y explica qué estás haciendo para mejorarla.", model: "I used to have trouble delegating tasks because I wanted everything to be perfect. As I started leading small teams, I realised this was slowing us down. Now I set clear expectations, review work through pull requests, and trust my teammates more. It's still something I'm working on, but I've improved a lot." },
  { q: "How do you handle tight deadlines?", tip: "Habla de priorizar, comunicar temprano y negociar el alcance.", model: "First, I break the work down and identify what's essential for the deadline. If I see a risk, I communicate it early rather than at the last minute. Sometimes that means proposing to ship a smaller first version and adding the rest later. I've found that being transparent builds trust with stakeholders." },
  { q: "Describe a project you're proud of.", tip: "Elige un proyecto con impacto medible. Explica tu rol específico, no solo lo que hizo el equipo.", model: "I'm very proud of an internal tool I built to automate our release notes. Before, it took the team about four hours every sprint. I wrote a script that reads merged pull requests and generates a draft automatically. It now takes ten minutes, and other teams in the company have adopted it too." },
  { q: "How do you keep your skills up to date?", tip: "Menciona hábitos concretos: cursos, documentación, proyectos personales, comunidades.", model: "I read the official documentation and changelogs of the tools I use, and I take one online course every few months. I also build small side projects to try new technologies, like a recent one with serverless functions. And I'm learning English intensively, because most of the best resources are in English." },
  { q: "Explain a technical concept to a non-technical person.", tip: "Usa una analogía sencilla y evita jerga. Aquí, por ejemplo, explicar una API.", model: "An API is like a waiter in a restaurant. You don't go into the kitchen yourself; you tell the waiter what you want, the waiter takes your order to the kitchen, and then brings your food back. In the same way, an application sends a request to an API, and the API returns the information it needs." },
  { q: "What's the difference between SQL and NoSQL databases?", tip: "Responde con estructura: definición, diferencia principal, cuándo usar cada una.", model: "SQL databases store data in tables with a fixed schema and are great when you need strong consistency and complex relationships, like in financial systems. NoSQL databases are more flexible: they can store documents, key-value pairs or graphs, and they usually scale horizontally more easily. I'd choose one or the other depending on the data model and the consistency requirements." },
  { q: "How would you design a URL shortener?", tip: "En diseño de sistemas, piensa en voz alta: aclara requisitos, propone una solución simple y luego habla de escala y trade-offs.", model: "First, I'd clarify the requirements: how many URLs per day, whether links expire, and if we need analytics. Then I'd start simple: an API that generates a short unique code, stores the mapping in a database, and redirects users. To scale, I'd add a cache for popular links and use a key-value store. One trade-off is between short codes and the risk of collisions." },
  { q: "Where do you see yourself in five years?", tip: "Muestra ambición alineada con el puesto: crecer técnicamente o hacia liderazgo.", model: "In five years, I'd like to be a senior or staff engineer, making architecture decisions and mentoring other developers. I enjoy both the technical side and helping people grow, so I see myself in a role that combines the two." },
  { q: "What are your salary expectations?", tip: "Investiga el rango antes. Da un rango, no un número exacto, y muestra flexibilidad.", model: "Based on my experience and the market for remote roles like this one, I'm looking for something in the range of four to five thousand dollars a month. That said, I'm open to discussing it, depending on the full package and the growth opportunities." },
  { q: "Do you have any questions for us?", tip: "Siempre di que sí. Pregunta por el equipo, el proceso de trabajo o los retos técnicos.", model: "Yes, thank you. What does a typical day look like for someone in this role? And what are the biggest technical challenges the team is facing right now?" },
  { q: "How do you approach code reviews?", tip: "Habla de respeto, objetividad y aprendizaje mutuo.", model: "I see code reviews as a learning opportunity for both sides. When I review, I focus on correctness, readability and tests, and I try to phrase comments as suggestions or questions. When my code is reviewed, I don't take it personally; I ask for clarification if I don't agree and I'm happy to change my mind." }
];

  { title: "Job description: Senior Backend Engineer (Remote)", text: `We're looking for a Senior Backend Engineer to join our platform team. You'll design, build and maintain the APIs that power our mobile and web applications, used by more than two million people across Latin America.\n\nWhat you'll do: build scalable services in Node.js and Go; collaborate closely with product managers and designers to turn requirements into technical solutions; review code and mentor mid-level engineers; take part in an on-call rotation once every six weeks.\n\nWhat we're looking for: five or more years of experience in backend development; strong knowledge of SQL databases and caching strategies; experience with cloud platforms, ideally AWS; excellent written and spoken English, as you'll work with teams in the United States and Europe.\n\nNice to have: experience with event-driven architectures; contributions to open-source projects.\n\nWhat we offer: a fully remote position, a competitive salary in US dollars, a yearly learning budget and flexible working hours.`, q: [

  { title: "Postmortem: checkout outage", text: `Summary: On March 14, the checkout service was unavailable for 42 minutes. During this time, about 3,200 customers were unable to complete their purchases.\n\nTimeline: At 14:05, a new version of the payment service was deployed. At 14:12, monitoring alerts showed a sharp increase in error rates. The on-call engineer started investigating at 14:15. At 14:40, the team decided to roll back the deployment, and the service fully recovered at 14:47.\n\nRoot cause: The new version introduced a connection leak. Database connections were opened but never closed, so the connection pool was exhausted after a few minutes of normal traffic.\n\nWhat went well: Alerts were triggered quickly, and the rollback process worked as expected.\n\nWhat went wrong: The issue was not detected in staging because staging traffic is much lower than production traffic. It also took 25 minutes to decide to roll back.\n\nAction items: add load tests to the deployment pipeline; create a rule to roll back automatically if error rates exceed 5%; add a check for unclosed connections in code reviews.`, q: [

  { title: "README: quick-cache library", text: `quick-cache is a lightweight in-memory cache for Node.js applications. It helps you reduce latency and database load by storing the results of expensive operations.\n\nInstallation: run npm install quick-cache. Node.js 18 or later is required.\n\nUsage: create a cache with a default time-to-live, or TTL, in seconds. Call the get method with a key; if the value is not cached, provide a function that loads it. The result will be stored and returned on the next call until it expires.\n\nConfiguration: you can set a maximum number of entries. When the limit is reached, the least recently used items are removed first. Setting the TTL to zero disables expiration, which is not recommended for data that changes often.\n\nContributing: pull requests are welcome. Please open an issue first to discuss what you would like to change, and make sure to update the tests as appropriate. This project is licensed under the MIT License.`, q: [

  { title: "Blog: How to write better pull requests", text: `A good pull request makes life easier for everyone on the team. Reviewers understand your changes faster, bugs are caught earlier, and the project history becomes a useful source of documentation.\n\nKeep it small. Large pull requests are hard to review, so they often receive superficial feedback. If a change touches many files, consider splitting it into several smaller pull requests that can be reviewed independently.\n\nWrite a clear description. Explain what the change does, why it is needed and how it was tested. Screenshots are extremely helpful for user interface changes. If there are parts you are unsure about, say so: it shows honesty and directs the reviewer's attention to where it matters most.\n\nRespond to feedback professionally. Comments on your code are not comments on you. Thank reviewers for their time, ask questions when something isn't clear, and don't be afraid to explain your reasoning if you disagree. The goal is not to win the discussion but to ship better software together.`, q: [

// ===== PRONUNCIACIÓN PARA HISPANOHABLANTES =====
// type: "pairs"  → pares mínimos: escuchas una palabra y eliges cuál fue
//       "class"  → clasificar (ej. sonido de -ed): items [palabra, índiceCorrecto], options = categorías
//       "stress" → sílaba acentuada: items [palabra, ["syl","la","bles"], índice]

const PRON = [
  { id: "p-ii", title: "ship / sheep: la i corta y la i larga", type: "pairs", explain: `<p>El español tiene una sola <b>i</b>. El inglés tiene dos: la <b>/ɪ/ corta y relajada</b> (<i>ship, sit, live</i>), entre la i y la e del español, y la <b>/iː/ larga y tensa</b> (<i>sheep, seat, leave</i>), como una i española alargada y sonriendo.</p><p>Confundirlas cambia el significado, y a veces mucho: <i>beach / bitch, sheet / shit</i>.</p>`, pairs: [["ship", "sheep"], ["sit", "seat"], ["live", "leave"], ["fill", "feel"], ["hit", "heat"], ["bin", "bean"], ["slip", "sleep"], ["chip", "cheap"], ["fit", "feet"], ["still", "steal"], ["rich", "reach"], ["it", "eat"]] },
  { id: "p-ae", title: "cat / cut / cart: tres vocales que en español son «a»", type: "pairs", explain: `<p><b>/æ/</b> (<i>cat, bad, man</i>): abre mucho la boca, entre a y e. <b>/ʌ/</b> (<i>cut, bus, love</i>): una a corta, relajada, casi sin abrir. <b>/ɑː/</b> (<i>cart, father, car</i>): a larga y profunda.</p><p>Truco: sonríe un poco para la /æ/; relaja la cara para la /ʌ/.</p>`, pairs: [["cat", "cut"], ["bad", "bud"], ["hat", "hut"], ["cap", "cup"], ["ran", "run"], ["match", "much"], ["bag", "bug"], ["hut", "heart"], ["cut", "cart"], ["fan", "fun"], ["lack", "luck"], ["track", "truck"]] },
  { id: "p-bv", title: "b / v: very no es berry", type: "pairs", explain: `<p>En español, b y v suenan igual. En inglés son distintas: <b>/b/</b> junta los dos labios; <b>/v/</b> apoya los <b>dientes de arriba sobre el labio de abajo</b> y vibra (como una f con voz).</p><p>Practica exagerando: <i>very, vest, vote, never, have</i>.</p>`, pairs: [["berry", "very"], ["ban", "van"], ["best", "vest"], ["boat", "vote"], ["bet", "vet"], ["base", "vase"], ["curb", "curve"], ["bowl", "vole"], ["bent", "vent"], ["marble", "marvel"]] },
  { id: "p-th", title: "th: think, this (y no tink, dis)", type: "pairs", explain: `<p>La <b>/θ/</b> (<i>think, three, mouth</i>) es como la z del español de España: lengua entre los dientes, sin voz. La <b>/ð/</b> (<i>this, they, mother</i>) es igual pero con voz, vibrando.</p><p>Errores típicos: decir <i>tink</i>, <i>sink</i> o <i>dis</i>. Saca un poquito la punta de la lengua.</p>`, pairs: [["thin", "tin"], ["three", "tree"], ["think", "sink"], ["thank", "tank"], ["they", "day"], ["then", "den"], ["mouth", "mouse"], ["path", "pass"], ["thought", "taught"], ["faith", "face"], ["those", "doze"], ["breathe", "breed"]] },
  { id: "p-h", title: "h aspirada: hat no es at", type: "pairs", explain: `<p>La <b>h</b> inglesa suena: es un soplo suave de aire, como cuando empañas un vidrio. No es la j española (no raspa la garganta) y no es muda.</p><p>Excepciones con h muda: <i>hour, honest, honour, heir</i>.</p>`, pairs: [["hat", "at"], ["hair", "air"], ["heat", "eat"], ["hold", "old"], ["hand", "and"], ["hit", "it"], ["heart", "art"], ["hear", "ear"], ["high", "eye"], ["hate", "eight"]] },
  { id: "p-shch", title: "sh / ch: share no es chair", type: "pairs", explain: `<p><b>/ʃ/</b> (<i>she, shop, wash</i>) es un sonido continuo, como pedir silencio: «shhh». <b>/tʃ/</b> (<i>chair, watch</i>) es la ch del español: empieza con un pequeño golpe.</p>`, pairs: [["share", "chair"], ["ship", "chip"], ["wash", "watch"], ["sheep", "cheap"], ["shoes", "choose"], ["cash", "catch"], ["sheet", "cheat"], ["shop", "chop"], ["wish", "witch"], ["dish", "ditch"]] },
  { id: "p-jy", title: "y / j: yes no es Jess", type: "pairs", explain: `<p>La <b>y</b> inglesa (<i>yes, you, year</i>) es suave, como la i en <i>«ieso»</i>. La <b>j</b> inglesa (<i>job, juice, Jess</i>) es como la «ll» argentina fuerte o la «dy»: <i>«dyob»</i>.</p><p>Muchos hispanohablantes dicen <i>«jes»</i> en vez de <i>yes</i>, o <i>«yob»</i> en vez de <i>job</i>.</p>`, pairs: [["yes", "Jess"], ["yolk", "joke"], ["yam", "jam"], ["yell", "jell"], ["yet", "jet"], ["Yale", "jail"], ["year", "jeer"], ["use", "juice"]] },
  { id: "p-final", title: "Consonantes finales: no te las comas", type: "pairs", explain: `<p>En español casi ninguna palabra termina en <i>b, d, g, p, t, k, v, z</i>. En inglés sí, y cambian el significado. Pronuncia el final con claridad.</p><p>Además, una vocal antes de consonante sonora (b, d, g, v, z) se alarga: <i>bed</i> suena más largo que <i>bet</i>.</p>`, pairs: [["bed", "bet"], ["cab", "cap"], ["eyes", "ice"], ["leave", "leaf"], ["prize", "price"], ["bag", "back"], ["card", "cart"], ["rise", "rice"], ["dog", "dock"], ["half", "have"], ["plays", "place"], ["send", "sent"]] },
  { id: "p-ed", title: "Terminación -ed: /t/, /d/ o /ɪd/", type: "class", options: ["/t/ como «workt»", "/d/ como «playd»", "/ɪd/ sílaba extra «wanted»"], explain: `<p>La -ed del pasado <b>casi nunca</b> es una sílaba extra. Regla:</p><ul><li>Después de <b>t</b> o <b>d</b> → <b>/ɪd/</b>, sílaba extra: <i>wanted, needed, decided</i>.</li><li>Después de sonido sordo (p, k, f, s, sh, ch, th) → <b>/t/</b>: <i>worked, stopped, washed, laughed</i>.</li><li>Después de sonido sonoro y vocales → <b>/d/</b>: <i>played, lived, called, cleaned</i>.</li></ul><p>Decir <i>«work-ed»</i> con dos sílabas es uno de los errores más comunes.</p>`, items: [["worked", 0], ["played", 1], ["wanted", 2], ["stopped", 0], ["lived", 1], ["needed", 2], ["washed", 0], ["called", 1], ["decided", 2], ["laughed", 0], ["cleaned", 1], ["started", 2], ["watched", 0], ["opened", 1], ["visited", 2], ["helped", 0], ["arrived", 1], ["ended", 2], ["kissed", 0], ["changed", 1]] },
  { id: "p-s", title: "Terminación -s / -es: /s/, /z/ o /ɪz/", type: "class", options: ["/s/ como «cats»", "/z/ como «dogs»", "/ɪz/ sílaba extra «buses»"], explain: `<p>Plurales, tercera persona (<i>he works</i>) y posesivos siguen la misma regla:</p><ul><li>Después de s, z, sh, ch, j, x → <b>/ɪz/</b>, sílaba extra: <i>buses, watches, pages, boxes</i>.</li><li>Después de sonido sordo (p, t, k, f, th) → <b>/s/</b>: <i>cats, books, stops</i>.</li><li>Después de sonido sonoro y vocales → <b>/z/</b>: <i>dogs, plays, lives, goes</i>.</li></ul>`, items: [["cats", 0], ["dogs", 1], ["buses", 2], ["books", 0], ["plays", 1], ["watches", 2], ["stops", 0], ["lives", 1], ["pages", 2], ["works", 0], ["goes", 1], ["boxes", 2], ["laughs", 0], ["friends", 1], ["washes", 2], ["months", 0], ["calls", 1], ["changes", 2]] },
  { id: "p-stress", title: "Acento de las palabras", type: "stress", explain: `<p>En inglés la sílaba acentuada se dice más fuerte, más larga y más aguda; las demás se «comen» (se reducen a una vocal neutra). Poner el acento en la sílaba equivocada hace que no te entiendan aunque los sonidos estén bien.</p><p>Patrones útiles: palabras en <b>-tion, -sion, -ic, -ity</b> llevan el acento justo antes del sufijo (<i>informAtion, ecOnomic, possiBIlity</i>). Muchos sustantivos de 2 sílabas lo llevan en la primera (<i>PREsent</i>) y los verbos en la segunda (<i>to preSENT</i>).</p>`, items: [["photograph", ["pho", "to", "graph"], 0], ["photography", ["pho", "to", "gra", "phy"], 1], ["photographic", ["pho", "to", "gra", "phic"], 2], ["comfortable", ["com", "for", "ta", "ble"], 0], ["vegetable", ["ve", "ge", "ta", "ble"], 0], ["important", ["im", "por", "tant"], 1], ["develop", ["de", "ve", "lop"], 1], ["economy", ["e", "co", "no", "my"], 1], ["economic", ["e", "co", "no", "mic"], 2], ["hotel", ["ho", "tel"], 1], ["interesting", ["in", "te", "res", "ting"], 0], ["determine", ["de", "ter", "mine"], 1], ["opportunity", ["op", "por", "tu", "ni", "ty"], 2], ["record (sustantivo)", ["re", "cord"], 0], ["record (verbo)", ["re", "cord"], 1], ["technology", ["tech", "no", "lo", "gy"], 1], ["Japanese", ["Ja", "pa", "nese"], 2], ["chocolate", ["cho", "co", "late"], 0]] },
  { id: "p-s-cluster", title: "s + consonante: speak, no «espeak»", type: "shadow", explain: `<p>En español ninguna palabra empieza por <b>s + consonante</b>, así que tendemos a agregar una «e»: <i>«espeak», «estudent», «Espain»</i>. En inglés la s va directo: alarga la s como una serpiente y luego la consonante: <i>sssspeak</i>.</p>`, lines: ["Speak slowly, please.", "I study at a small school in Spain.", "The students stopped at the station.", "She speaks Spanish and Swedish.", "Start the story from the beginning.", "Stay strong and stop stressing."] },
  { id: "p-schwa", title: "La vocal neutra (schwa) y las formas débiles", type: "shadow", explain: `<p>El sonido más común del inglés es la <b>schwa /ə/</b>: una «e» muy corta y relajada que aparece en sílabas sin acento: <i>about, banana, teacher, problem</i>.</p><p>Las palabras gramaticales (<i>to, for, of, can, was, and, a, the</i>) casi siempre se dicen débiles: <i>I want <b>tə</b> go</i>, <i>a cup <b>əv</b> tea</i>, <i>I <b>kən</b> swim</i>. Si las pronuncias fuertes sonarás robótico y te costará entender a los nativos.</p>`, lines: ["I want to go to the cinema.", "Can you give me a cup of tea?", "I was at the doctor's for an hour.", "Fish and chips for two, please.", "What are you going to do?", "She can swim, but she can't dive."] },
  { id: "p-linking", title: "Unir palabras (linking) y ritmo", type: "shadow", explain: `<p>Los nativos unen las palabras: una consonante final se une con la vocal siguiente (<i>turn_off → «tur-noff», pick_it_up → «pi-ki-tup»</i>). También acentúan solo las palabras importantes y aceleran las demás: es un idioma de <b>ritmo marcado por el acento</b>, no sílaba por sílaba como el español.</p><p>Escucha el modelo y fíjate en el ritmo más que en cada sonido.</p>`, lines: ["Turn it off and put it away.", "Pick it up and give it back.", "What do you want to eat?", "I'll call you as soon as I get home.", "Not at all, it's an old idea.", "Could you hold on a minute?"] }
];

// ===== HISTORIAS GRADUADAS: "Code & Coffee" =====
// Serie con personajes recurrentes. El nivel sube episodio a episodio.
// Personajes: Sofía (desarrolladora de Medellín), Daniel (su compañero de piso, chef),

  title: "Code & Coffee",
  intro: "Sofía es una desarrolladora de Medellín que consigue su primer trabajo remoto con una empresa de Londres. Episodio a episodio la acompañas en su vida, su trabajo y su inglés. El vocabulario y la gramática suben de nivel contigo, y los personajes se repiten, así que cada episodio se entiende mejor que el anterior.",
  cast: [["Sofía", "Desarrolladora de Medellín, 27 años"], ["Daniel", "Su compañero de piso, chef"], ["Mark", "Su jefe, en Londres"], ["Priya", "Diseñadora del equipo, en Toronto"], ["Tom", "Desarrollador junior, en Manchester"]]

  { id: "st01", level: "A2", ep: 1, title: "The email",
    text: `Sofía is twenty-seven years old. She lives in Medellín with her friend Daniel. Daniel is a chef, and he cooks amazing food. Sofía is a software developer, but she works for a small local company and she wants something new.

One Monday morning, she opens her laptop and sees an email from a company in London. The subject says: "Job offer". Sofía reads the email three times. She can't believe it. The company wants her to join their team as a remote developer.

"Daniel! Come here!" she shouts. Daniel runs from the kitchen with a spoon in his hand. "What happened? Are you OK?"

"I got the job! The job in London!"

"That's fantastic! But wait... do you have to move to London?"

"No, it's remote. I can work from here. But there's one problem," Sofía says. "All the meetings are in English. My English is... OK, but not great."

Daniel smiles. "Then you need to practise every day. You can start tonight. I'm making arepas, and you can tell me about the job. In English!"`,
    q: [["Where does Sofía live?", ["In London", "In Medellín", "In Bogotá"], 1], ["What is Daniel's job?", ["He's a developer", "He's a teacher", "He's a chef"], 2], ["Does Sofía have to move to London?", ["Yes, next month", "No, the job is remote", "She doesn't know"], 1], ["What is Sofía worried about?", ["Her English", "The salary", "Her laptop"], 0]],
    gloss: [["job offer", "oferta de trabajo"], ["she can't believe it", "no lo puede creer"], ["to join a team", "unirse a un equipo"], ["to shout", "gritar"], ["to move", "mudarse"], ["to practise", "practicar"]] },
  { id: "st02", level: "A2", ep: 2, title: "The first meeting",
    text: `It's Sofía's first day. The meeting starts at 9 a.m. in London, so it's 3 a.m. in Medellín... No, wait. Sofía checks again. London is five hours ahead, so the meeting is at 4 a.m. her time? No! The meeting is at 3 p.m. in London, so it's 9 a.m. in Medellín. Perfect.

She makes a big cup of coffee and turns on her camera. There are four people in the call. A man with grey hair says, "Hi everyone, I'm Mark. I'm the team lead. Welcome, Sofía!"

"Thank you. Nice to meet you," Sofía says. Her voice is a little nervous.

"This is Priya, our designer. She lives in Toronto. And this is Tom. He's a junior developer, like you were a few years ago."

Tom waves. "Hi Sofía! Don't worry, everybody is friendly here."

Mark speaks very fast. Sofía doesn't understand everything, but she writes the important words in a notebook: "sprint", "backlog", "deploy on Thursday". After the meeting, she sends a message to Tom: "Sorry, can you explain what a sprint is here? I want to be sure."

Tom answers in two minutes. "Sure! No problem. Asking questions is a good thing."`,
    q: [["What time is the meeting in Medellín?", ["3 a.m.", "9 a.m.", "3 p.m."], 1], ["Who is Mark?", ["The designer", "The team lead", "A junior developer"], 1], ["Where does Priya live?", ["In Toronto", "In London", "In Manchester"], 0], ["What does Sofía do when she doesn't understand?", ["She says nothing", "She writes words and asks Tom", "She leaves the meeting"], 1]],
    gloss: [["ahead", "adelante (hora)"], ["to turn on", "encender"], ["team lead", "líder del equipo"], ["to wave", "saludar con la mano"], ["nervous", "nerviosa"], ["to be sure", "estar seguro"]] },
  { id: "st03", level: "A2", ep: 3, title: "Daniel's restaurant",
    text: `On Saturday, Sofía doesn't work. She goes with Daniel to the market early in the morning. Daniel wants to open a small restaurant, and he needs fresh fruit and vegetables for a new menu.

"Why do you want a restaurant?" Sofía asks. "You have a good job at the hotel."

"Yes, but I always cook what my boss wants. I want to cook my own food. Colombian food with a modern style."

At the market, a tourist from Canada asks Daniel about a strange fruit. "Excuse me, what is this?"

Daniel looks at Sofía. He doesn't speak much English. Sofía helps him. "It's called lulo. It's a little sour, but it's great for juice."

The tourist buys five lulos and says thank you. Daniel is surprised. "Your English is good, Sofía!"

"It's getting better. I practise every day now. Hey... maybe your restaurant needs a menu in English, too. Lots of tourists come to Medellín."

Daniel thinks about it. "OK. You help me with the English menu, and I cook dinner for you every Friday. Deal?"

"Deal!"`,
    q: [["Why does Daniel want a restaurant?", ["He doesn't like his boss", "He wants to cook his own food", "He wants more money"], 1], ["What is lulo like, according to Sofía?", ["Sweet", "Sour", "Salty"], 1], ["Who helps the tourist?", ["Daniel", "Sofía", "Another tourist"], 1], ["What is the deal between Sofía and Daniel?", ["English menu for dinners", "Money for coffee", "Help with the laptop"], 0]],
    gloss: [["fresh", "fresco"], ["sour", "ácido / agrio"], ["juice", "jugo"], ["to get better", "mejorar"], ["deal", "trato"], ["menu", "carta / menú"]] },
  { id: "st04", level: "B1", ep: 4, title: "A bug on Friday",
    text: `It was Friday afternoon, and Sofía was looking forward to a quiet weekend. She had finished her tasks, and Daniel was already cooking dinner. Then her phone buzzed. It was a message from Mark: "Urgent. Customers can't log in. Can you have a look?"

Sofía's heart started beating faster. The login page was part of the code she had changed that week. She opened the logs and saw hundreds of errors. While she was reading them, Tom joined the call.

"I think it's my fault," Tom said quietly. "I deployed a small change an hour ago. I didn't run all the tests."

Sofía didn't get angry. She remembered her first job, when she had deleted a whole database by mistake. "Don't worry. Let's find the problem together. Can you share your screen?"

After forty minutes, they found it. A configuration file had the wrong value. Tom fixed it, and Sofía checked everything twice. The customers could log in again.

Later, Mark wrote in the team chat: "Great job, both of you. Next week let's talk about how to stop this happening again. No blame, just better processes."

Sofía closed her laptop and went to the kitchen. "Sorry I'm late. The food smells amazing."

"It was hot an hour ago," Daniel laughed. "But it's still good."`,
    q: [["What was the problem?", ["The website was slow", "Customers couldn't log in", "The database was deleted"], 1], ["Why did Tom think it was his fault?", ["He deployed without running all the tests", "He deleted the logs", "He didn't come to work"], 0], ["How did Sofía react?", ["She got angry", "She stayed calm and helped", "She called Mark"], 1], ["What did Mark want to do next week?", ["Fire Tom", "Talk about better processes", "Change the login page"], 1]],
    gloss: [["to look forward to", "esperar con ganas"], ["to buzz", "vibrar (el celular)"], ["fault", "culpa"], ["by mistake", "por error"], ["to share your screen", "compartir pantalla"], ["no blame", "sin culpar a nadie"]] },
  { id: "st05", level: "B1", ep: 5, title: "Priya's idea",
    text: `Priya, the designer from Toronto, sent Sofía a private message one morning. "Do you have ten minutes? I've got an idea, but I'm not sure if it's crazy."

They started a video call. Priya explained that many users had complained about the app's checkout process. "It has six steps," she said. "If you ask me, it should have three. People get tired and leave before they pay."

Sofía agreed, but she could see a problem. "I see what you mean, but changing it will take a lot of time. Mark wants us to focus on the new features."

"That's exactly why I need your help," Priya said. "If we show him numbers, he'll listen. Can you find out how many people leave at each step?"

Sofía spent the afternoon working with the data. The result surprised both of them: almost forty percent of users left at step four, where they had to create an account.

The next day they presented the numbers to Mark. He was quiet for a moment. Then he said, "OK. I wasn't expecting that. Let's try a guest checkout without an account. Priya, can you design it? Sofía, can you build it in the next sprint?"

After the meeting, Priya sent a message with three coffee emojis. Sofía answered: "Your crazy idea wasn't so crazy after all."`,
    q: [["What was Priya's idea about?", ["A new logo", "Making the checkout shorter", "Hiring more designers"], 1], ["Why did Sofía think it could be difficult?", ["Mark wanted to focus on new features", "Priya was in another country", "She didn't like the idea"], 0], ["Where did many users leave the process?", ["At the first step", "At the account creation step", "After paying"], 1], ["What did Mark decide?", ["To wait until next year", "To try a guest checkout", "To remove the checkout"], 1]],
    gloss: [["to complain", "quejarse"], ["checkout", "proceso de pago"], ["to find out", "averiguar"], ["to leave (an app)", "abandonar"], ["guest checkout", "compra como invitado"], ["after all", "después de todo"]] },
  { id: "st06", level: "B1", ep: 6, title: "The phone call",
    text: `Daniel had finally found a place for his restaurant, a small house with a garden near Parque Lleras. The owner lived in Miami and only spoke English, so Daniel asked Sofía to help him with the phone call.

"I'm so nervous," he said. "What if he asks me something I don't understand?"

"Then I'll translate. But try to say the first part yourself. We practised it."

The owner, Mr. Harris, answered after three rings. Daniel took a deep breath. "Good morning, Mr. Harris. My name is Daniel Restrepo. I'm calling about the house on Calle 10. I'd like to rent it for a restaurant."

Sofía gave him a thumbs up. Mr. Harris asked several questions: how long Daniel wanted to rent it for, whether he would make changes to the kitchen, and when he could start. Sofía helped with the difficult parts, but Daniel understood more than he expected.

Then Mr. Harris said something that made them both stop. "The rent is two thousand dollars a month, and I need six months in advance."

Daniel looked at Sofía. It was much more than he had. Sofía whispered, "Ask him if it's negotiable."

"Is the price... negotiable?" Daniel asked.

There was a long silence. "Well," Mr. Harris said, "if you can sign a contract for two years, I could accept three months in advance."

When they hung up, Daniel was smiling. "I can't believe I negotiated in English!"`,
    q: [["Why did Daniel need help?", ["The owner only spoke English", "He couldn't find the house", "His phone didn't work"], 0], ["What surprised them during the call?", ["The size of the garden", "The price and the advance payment", "The owner's accent"], 1], ["What did Sofía suggest?", ["To hang up", "To ask if the price was negotiable", "To look for another house"], 1], ["What did the owner finally offer?", ["A lower monthly rent", "Three months in advance with a two-year contract", "The house for free"], 1]],
    gloss: [["owner", "dueño"], ["to rent", "arrendar"], ["to take a deep breath", "respirar hondo"], ["thumbs up", "pulgar arriba"], ["in advance", "por adelantado"], ["to hang up", "colgar"]] },
  { id: "st07", level: "B2", ep: 7, title: "The promotion",
    text: `Six months after joining the company, Sofía received an unexpected invitation to a one-to-one meeting with Mark. She spent the morning wondering whether she had done something wrong.

"I'll get straight to the point," Mark said. "We're setting up a new team to rebuild the payments system, and I'd like you to lead it."

Sofía was speechless. Leading a team meant running meetings, giving feedback and, above all, speaking English all day long, often under pressure. "I'm flattered," she managed to say. "Having said that, I'm not sure I'm ready. My English still lets me down sometimes, especially when people speak fast."

Mark nodded. "I appreciate your honesty. But when it comes to communication, what matters most is being clear, not sounding like a native speaker. You ask good questions, you explain things simply and you never pretend to understand when you don't. Those are rare skills."

Sofía asked for a couple of days to think it over. That evening she talked to Daniel, who was exhausted after a long day at the restaurant, which had opened the month before.

"Do you remember the phone call with Mr. Harris?" he said. "I was terrified, and you told me to say the first part myself. Maybe you should take your own advice."

The following Monday, Sofía accepted the offer, on one condition: that the company paid for a public speaking course. Mark agreed immediately.`,
    q: [["What was the meeting about?", ["A problem with Sofía's work", "An offer to lead a new team", "A salary reduction"], 1], ["Why did Sofía hesitate?", ["She didn't like the payments system", "She worried about her English under pressure", "She wanted to leave the company"], 1], ["According to Mark, what matters most in communication?", ["Sounding like a native speaker", "Being clear", "Speaking fast"], 1], ["What condition did Sofía set?", ["A higher salary", "Working only four days", "A public speaking course"], 2]],
    gloss: [["to get straight to the point", "ir directo al grano"], ["speechless", "sin palabras"], ["to be flattered", "sentirse halagado"], ["to let someone down", "fallarle a alguien"], ["to pretend", "fingir"], ["to think it over", "pensarlo bien"]] },
  { id: "st08", level: "B2", ep: 8, title: "Tom's mistake",
    text: `Leading a team turned out to be harder than Sofía had anticipated, and not because of the technical challenges. Tom, who had joined her team, had been missing deadlines for weeks. His code was good when it arrived, but it rarely arrived on time, and the rest of the team had started to notice.

Sofía kept putting off the conversation. She liked Tom; he had been the first person to make her feel welcome. But at the end of the day, it was her responsibility.

She prepared carefully, using a structure from her public speaking course: describe the situation, explain the impact, and ask questions before drawing conclusions.

"Tom, can I share something I've noticed? The last three tasks were delivered between four and six days late. That's had an impact on Priya, who couldn't start her designs, and on our release date. I'm not here to blame you. I'd really like to understand what's going on."

There was a long pause. Then Tom admitted that his mother had been ill and that he had been travelling to Leeds every weekend to look after her. He hadn't said anything because he was afraid it would sound like an excuse.

"It doesn't sound like an excuse at all," Sofía said. "It sounds like something we should have known about. Let's look at your workload and see what we can move. And please, next time, tell me earlier. I'd much rather adjust a plan than lose a teammate."

Tom looked relieved. A month later, he was meeting every deadline, and he had become the team's most reliable reviewer.`,
    q: [["What was the problem with Tom's work?", ["His code had many bugs", "He was missing deadlines", "He was rude to Priya"], 1], ["Why did Sofía delay the conversation?", ["She liked Tom and found it difficult", "She was on holiday", "Mark told her to wait"], 0], ["What structure did she use?", ["Situation, impact, questions", "Criticism, warning, deadline", "Praise, criticism, praise"], 0], ["Why hadn't Tom explained his situation?", ["He thought it would sound like an excuse", "He didn't trust Sofía", "He didn't know about the deadlines"], 0]],
    gloss: [["to anticipate", "prever"], ["deadline", "fecha límite"], ["to put off", "aplazar"], ["to draw conclusions", "sacar conclusiones"], ["workload", "carga de trabajo"], ["relieved", "aliviado"]] },
  { id: "st09", level: "B2", ep: 9, title: "A night at the restaurant",
    text: `Daniel's restaurant had been open for almost a year when a food critic from an international travel magazine booked a table without warning. Daniel only found out because the critic's assistant called to confirm the reservation and accidentally mentioned the magazine's name.

Panic spread through the kitchen. Daniel asked Sofía to come and help at the front of the restaurant, since she was the only person he trusted who could chat comfortably in English.

The critic turned out to be a soft-spoken woman called Helen, who asked detailed questions about every dish. Sofía explained that the menu was inspired by Daniel's grandmother's recipes, reinterpreted with modern techniques. When Helen asked why the dessert combined lulo with dark chocolate, Sofía realised she didn't know the answer, so she did what she had learned at work: instead of making something up, she said, "That's a great question. Let me ask the chef."

Daniel came out of the kitchen, wiping his hands on his apron, and answered in slow but confident English. "The lulo is sour, the chocolate is bitter. Together, they are like Medellín: a little intense, but you want more."

Helen laughed and wrote something in her notebook.

Two months later the article was published. The headline read: "A taste of Medellín, one honest answer at a time." Daniel framed it and hung it next to the kitchen door.`,
    q: [["How did Daniel find out about the critic?", ["She announced it on social media", "Her assistant mentioned the magazine by accident", "Sofía recognised her"], 1], ["Why did Daniel ask Sofía to help?", ["She could speak English comfortably", "She was a professional waitress", "She knew the critic"], 0], ["What did Sofía do when she didn't know an answer?", ["She invented one", "She said she would ask the chef", "She changed the subject"], 1], ["What did Daniel compare the dessert to?", ["His grandmother", "The city of Medellín", "The critic's personality"], 1]],
    gloss: [["without warning", "sin previo aviso"], ["to spread", "extenderse"], ["soft-spoken", "de voz suave"], ["to make something up", "inventarse algo"], ["apron", "delantal"], ["to frame", "enmarcar"]] },
  { id: "st10", level: "C1", ep: 10, title: "The conference talk",
    text: `When the organisers of a developer conference in Lisbon invited Sofía to give a talk on how her team had rebuilt the payments system, her first instinct was to decline. Speaking to a room of three hundred engineers, many of them native speakers, struck her as an entirely different proposition from running a stand-up meeting.

What changed her mind was a remark Priya made over a video call. "You keep assuming the audience wants a flawless accent. What they actually want is someone who's been through the mess and can tell them what went wrong. Nobody else can tell that story."

Sofía spent weeks preparing. Rather than memorising a script, she rehearsed the key transitions until she could deliver them in her sleep, and she deliberately left room for improvisation. She also recorded herself and noticed she tended to rush whenever she felt insecure, so she wrote a single word at the top of each slide note: "Breathe."

On the day, ten minutes into the talk, the projector died. For a few seconds the room was silent. Sofía felt the familiar panic rising, then heard herself say, "Well, I did promise you a talk about systems failing in production." The audience burst out laughing, and by the time a technician had fixed the projector, she had already explained the architecture by drawing it on a whiteboard.

Afterwards, a senior engineer from a major bank approached her. "I've been to dozens of these conferences," he said, "and that was the first time I actually understood how a payments migration works." On the flight back, Sofía caught herself thinking, for the first time, not in Spanish or in English, but simply in ideas.`,
    q: [["Why did Sofía initially want to decline?", ["She had no time to prepare", "Speaking to a large expert audience intimidated her", "She disagreed with the organisers"], 1], ["What was Priya's main argument?", ["Sofía's accent was already perfect", "The audience values real experience over a perfect accent", "Talks should be memorised word for word"], 1], ["What did Sofía notice when she recorded herself?", ["She spoke too quietly", "She rushed when she felt insecure", "She used too many slides"], 1], ["How did she handle the projector failing?", ["She ended the talk early", "She made a joke and used a whiteboard", "She waited silently for the technician"], 1]],
    gloss: [["to decline", "rechazar (una invitación)"], ["to strike someone as", "parecerle a alguien"], ["flawless", "impecable"], ["to rehearse", "ensayar"], ["to burst out laughing", "echarse a reír"], ["to catch yourself + -ing", "sorprenderse a uno mismo haciendo algo"]] },
  { id: "st11", level: "C1", ep: 11, title: "Two offers",
    text: `The conference talk had consequences Sofía hadn't foreseen. Within a fortnight she had received two job offers. The first came from the bank whose engineer had approached her in Lisbon: a senior architect role in London, with a salary nearly double her current one and a relocation package thrown in. The second, less glamorous but intriguing, came from a small start-up in Medellín that was building software for local farmers to sell directly to restaurants.

On paper, the decision was straightforward. In practice, it was anything but. Moving to London would mean leaving Daniel, whose restaurant was finally thriving, and starting from scratch in a city where she knew no one. On the other hand, it was the kind of opportunity that had seemed unthinkable two years earlier, when she had read that first email three times in disbelief.

She drew up a list of pros and cons, which, predictably, solved nothing. So she turned to the people whose judgement she trusted most. Mark, to her surprise, urged her to consider the start-up seriously. "Big companies will always be there," he said. "Chances to build something from the ground up, with people you care about, are far rarer." Priya took the opposite view: "You've earned the right to be ambitious. Don't talk yourself out of it."

Daniel, characteristically, said very little and cooked her favourite meal. Only at the end of the evening did he add: "Whatever you choose, make sure it's because you want it, not because you're afraid of the alternative."

Sofía went to bed that night realising that, for the first time, the language she would work in was no longer the deciding factor. The decision had become, quite simply, a question of who she wanted to be.`,
    q: [["What did the start-up do?", ["It built banking software", "It connected local farmers with restaurants", "It organised conferences"], 1], ["What was Mark's advice?", ["To accept the bank's offer", "To seriously consider the start-up", "To stay in her current job"], 1], ["What was Priya's view?", ["Sofía should be ambitious", "Sofía should stay in Medellín", "Sofía should start her own company"], 0], ["What did Daniel emphasise?", ["The salary", "Choosing out of desire rather than fear", "The restaurant's needs"], 1]],
    gloss: [["to foresee", "prever"], ["a fortnight", "dos semanas"], ["relocation package", "paquete de reubicación"], ["to thrive", "prosperar"], ["from scratch", "desde cero"], ["to talk yourself out of something", "convencerse de no hacer algo"]] },
  { id: "st12", level: "C1", ep: 12, title: "Full circle",
    text: `A year later, on a Monday morning not unlike the one on which she had first opened that email from London, Sofía was sitting in a cramped office above a bakery in Envigado, interviewing candidates for the start-up she had chosen to join as its chief technology officer.

The last candidate of the day was a twenty-three-year-old developer called Valentina, whose technical test had been outstanding. Midway through the interview, Sofía switched to English, as the company now worked with clients in Canada and the United States. Valentina's confidence visibly evaporated. She stumbled over her words, apologised twice, and finally admitted, in Spanish, that her English was "more or less A2".

Sofía put down her pen. "Can I tell you something? Four years ago, I was exactly where you are now. I used to write down every word I didn't understand in meetings and look them up at night. I recorded myself, I made a fool of myself on phone calls, and I once told a whole meeting I was 'constipated' when I meant I had a cold."

Valentina laughed in spite of herself.

"Your English will improve if you use it every single day, even when it's uncomfortable. Especially when it's uncomfortable. The code you wrote, on the other hand, is something I can't teach. We'd like to offer you the job."

That evening, Sofía walked to Daniel's restaurant, where Mark and Priya, visiting Colombia for the first time, were waiting at a table in the garden. Tom had joined them by video, the laptop propped against a bottle of wine. Daniel came out with a dessert that wasn't on the menu: lulo and dark chocolate.

"To Code & Coffee," Priya said, raising her glass.

"And to asking questions," Tom added from the screen.

Sofía raised hers and said nothing for a moment. Then, in an English that was no longer something she performed but simply the way she spoke, she said, "To the first email. And to everyone who made me answer it."`,
    q: [["What was Sofía's role at the start-up?", ["Junior developer", "Chief technology officer", "Designer"], 1], ["Why did Valentina lose confidence?", ["Her technical test went badly", "The interview switched to English", "Sofía criticised her code"], 1], ["What point was Sofía making with her own story?", ["English can't be learned as an adult", "Daily, uncomfortable practice makes you improve", "Technical skills are less important than English"], 1], ["What did Daniel serve that evening?", ["Arepas", "The lulo and chocolate dessert", "A new dish from Canada"], 1]],
    gloss: [["cramped", "estrecho / apretado"], ["outstanding", "sobresaliente"], ["to evaporate", "evaporarse / desaparecer"], ["to stumble over your words", "trabarse al hablar"], ["to make a fool of yourself", "hacer el ridículo"], ["in spite of herself", "sin poder evitarlo"]] }

  });

// ---------- Motor de ejercicios ----------
function exerciseRunner(box, items, o) {
  let i = 0, correct = 0, answered = false; const wrongs = [];
  const typed = (t) => ["fill", "tr", "fix", "sub"].includes(t);
  function show() {
    const ex = items[i];
    if (!ex) return o.onFinish(correct, items.length, wrongs);
    answered = false;
    const t = ex[0]; let body = "";
    if (t === "mc") body = `${ex.pic ? `<div class="qpic">${ex.pic}</div>` : ""}<p class="q">${esc(ex[1])}</p><div class="opts">${ex[2].map((x, k) => `<button class="opt" data-k="${k}"><span class="key">${k + 1}</span>${ex.optHTML ? ex.optHTML[k] + (ex.optHTML[k] ? "" : esc(x)) : esc(x)}</button>`).join("")}</div>`;
    if (t === "fill") body = `<p class="q">${esc(ex[1])}</p><form class="ans row"><input id="ai" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe la palabra que falta"><button class="btn">Comprobar</button></form>`;
    if (t === "tr") body = `<p class="label">Traduce al inglés</p><p class="q">${esc(ex[1])}</p><form class="ans"><textarea id="ai" rows="2" autocapitalize="off" spellcheck="false" placeholder="Write it in English…"></textarea><button class="btn wide">Comprobar</button></form>`;
    if (t === "fix") body = `<p class="label">Esta frase tiene un error. Corrígela.</p><p class="q wrongq">${esc(ex[1])}</p><form class="ans"><textarea id="ai" rows="2" autocapitalize="off" spellcheck="false">${esc(ex[1])}</textarea><button class="btn wide">Comprobar</button></form>`;
    if (t === "sub") body = `<p class="label">Transforma la frase usando: <b>${esc(ex[4])}</b></p><p class="q">${esc(ex[1])}</p><form class="ans"><textarea id="ai" rows="2" autocapitalize="off" spellcheck="false" placeholder="Write the new sentence…"></textarea><button class="btn wide">Comprobar</button></form>`;
    if (t === "blocks") body = `<p class="label">Arma la frase con los bloques</p><p class="q">${esc(ex[1])}</p><div class="built" id="built"></div><div class="bank">${shuffle(ex[2].slice()).map((w) => `<button class="w chunkw">${esc(w)}</button>`).join("")}</div><button class="btn" id="oc">Comprobar</button>`;
    if (t === "ord") body = `<p class="label">Ordena las palabras</p><p class="q">${esc(ex[1])}</p><div class="built" id="built"></div><div class="bank">${shuffle(ex[2].split(" ")).map((w) => `<button class="w">${esc(w)}</button>`).join("")}</div><button class="btn" id="oc">Comprobar</button>`;
    box.innerHTML = `<div class="row between"><div><h1>${esc(o.title)}</h1>${o.subtitle ? `<div class="muted small">${esc(o.subtitle)}</div>` : ""}</div>${o.onExit ? `<button class="btn ghost small" id="exit">Salir</button>` : ""}</div>
      <div class="bar"><i style="width:${(i / items.length) * 100}%"></i></div><div class="muted small">${i + 1} / ${items.length}</div>
      <div class="card excard">${body}<div id="fb"></div></div>`;
    if (o.onExit) $("#exit").onclick = o.onExit;
    if (t === "mc") $$("button.opt", box).forEach((b) => b.onclick = () => choose(+b.dataset.k));
    if (typed(t)) {
      const inp = $("#ai"); inp.focus(); if (t === "fix") inp.setSelectionRange(inp.value.length, inp.value.length);
      inp.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && inp.tagName === "TEXTAREA") { e.preventDefault(); $(".ans", box).requestSubmit(); } };
      $(".ans", box).onsubmit = (e) => {
        e.preventDefault(); if (answered) return; const v = inp.value.trim(); if (!v) return;
        const ok = ex[2].some((a) => norm(a) === norm(v));
        const close = !ok && t !== "fill" && ex[2].some((a) => similarity(a, v) >= 0.85);
        finish(ok, ex[2][0], t === "fill" ? ex[3] : ex[3], v, close);
      };
    }
    if (t === "ord" || t === "blocks") {
      const built = [];
      const draw = () => { $("#built").innerHTML = built.map((b, k) => `<button class="w" data-r="${k}">${esc(b.textContent)}</button>`).join(""); $$("#built [data-r]", box).forEach((x) => x.onclick = () => { if (answered) return; const [rm] = built.splice(+x.dataset.r, 1); rm.classList.remove("used"); draw(); }); };
      $$(".bank .w", box).forEach((b) => b.onclick = () => { if (answered || b.classList.contains("used")) return; b.classList.add("used"); built.push(b); draw(); });
      $("#oc").onclick = () => { if (answered || !built.length) return; const v = built.map((b) => b.textContent).join(" "); const want = t === "blocks" ? ex[2].join(" ") : ex[2]; finish(norm(v) === norm(want), want, "", v); };
    }
  }
  function choose(k) {
    const ex = items[i]; if (answered) return;
    $$("button.opt", box)[k].classList.add(k === ex[3] ? "right" : "wrong"); $$("button.opt", box)[ex[3]].classList.add("right");
    finish(k === ex[3], ex[2][ex[3]], ex[4], ex[2][k]);
  }
  function finish(ok, answer, why, given, close) {
    answered = true; const ex = items[i];
    if (ok) correct++; else wrongs.push({ q: ex[1], answer, given, why, type: ex[0], ex });
    recordEx(ex, ok);
    const full = ex[0] === "fill" ? ex[1].replace(/_{2,}/, answer).replace(/\s*\([^)]*\)/g, "").trim() : ex[0] === "mc" ? (ex[1].includes("___") ? ex[1].replace(/_{2,}/, answer) : answer) : answer;
    $("#fb").innerHTML = `<div class="feedback ${ok ? "good" : "bad"}"><b>${ok ? "¡Correcto!" : close ? "Casi. Respuesta esperada:" : "Respuesta correcta:"}</b> ${ok ? "" : esc(answer)} ${speakBtn(full)}
      ${!ok && !["mc", "ord", "blocks"].includes(ex[0]) && ex[2].length > 1 ? `<div class="small muted">También vale: ${ex[2].slice(1, 4).map(esc).join(" · ")}</div>` : ""}
      ${why ? `<p>${esc(why)}</p>` : ""}${o.strict || ex.noCs || !looksEnglish(full) ? "" : csBox(full)}${!ok && ["tr", "fix", "fill", "sub"].includes(ex[0]) && !o.strict ? `<button class="btn ghost small" id="mine">Mi respuesta también es correcta</button>` : ""}</div>
      <button class="btn wide" id="nx">Continuar ⏎</button>`;
    if ($("#mine")) $("#mine").onclick = () => { correct++; wrongs.pop(); recordEx(ex, true, true); $("#mine").outerHTML = `<span class="small">✓ Contada como correcta</span>`; };
    $("#nx").onclick = next; $("#nx").focus();
  }
  function next() { i++; show(); }
  box.onkeydown = (e) => {
    const ex = items[i]; if (!ex) return;
    if (!answered && ex[0] === "mc" && /^[1-9]$/.test(e.key) && +e.key <= ex[2].length) choose(+e.key - 1);
  };
  show();
}

      ${item.gloss && !o.exam ? `<details class="card"><summary><b>Glosario</b> (${item.gloss.length})</summary><div class="list">${item.gloss.map(([en, es]) => `<div class="li">${picHTML(en, "lst")}<div><b>${esc(en)}</b> — ${esc(es)}${pronHTML(en)}</div>${speakBtn(en)}<button class="btn ghost small" data-add="${esc(en)}|${esc(es)}">+ Tarjeta</button></div>`).join("")}</div></details>` : ""}` : ""}
    <h2>Preguntas</h2>${item.q.map((q, k) => `<div class="card excard"><p class="q">${k + 1}. ${esc(q[0])}</p><div class="opts">${q[1].map((x, j) => `<button class="opt ${ans[k] !== undefined ? (j === q[2] ? "right" : j === ans[k] ? "wrong" : "") : ""}" data-q="${k}" data-j="${j}">${esc(x)}</button>`).join("")}</div></div>`).join("")}
    ${isL && (shownT || all) && !o.exam ? `<details class="card" ${all ? "open" : ""}><summary><b>Transcripción</b></summary>${item.lines.map(([sp, t], i) => `<div class="line" data-line="${i}"><p><b>${esc(sp)}:</b> ${esc(t)} ${speakBtn(t)}</p>${csBox(t, false)}</div>`).join("")}</details>` : ""}
    ${all ? `<div class="card center"><h2>${c} de ${item.q.length} correctas</h2><div class="row center">${!o.exam ? `<button class="btn ghost" id="retell">🗣️ Cuéntalo con tus palabras</button>` : ""}<button class="btn" id="done">${o.exam ? "Continuar" : "Terminar"}</button></div></div>` : ""}`;
    if (o.onExit) $("#exit").onclick = () => { stopSpeech(); o.onExit(); };
    if (isL) {
      const lines = item.lines.map(([sp, t]) => [sp.charCodeAt(0) - 65, t]);
      $("#play").onclick = () => speakLines(lines); $("#slow").onclick = () => speakLines(lines, Math.max(0.6, S.settings.rate - 0.2)); $("#stop").onclick = stopSpeech;
    }
    $$("[data-q]", box).forEach((b) => b.onclick = () => { const k = +b.dataset.q; if (ans[k] !== undefined) return; ans[k] = +b.dataset.j; const y = window.scrollY; draw(); window.scrollTo(0, y); });
    $$("[data-add]", box).forEach((b) => b.onclick = () => { const [en, es] = b.dataset.add.split("|"); addCustomCard(en, es, ""); b.textContent = "✓"; b.disabled = true; });
    if ($("#done")) $("#done").onclick = () => { stopSpeech(); o.onFinish(c, item.q.length); };
    if ($("#retell")) $("#retell").onclick = () => { stopSpeech(); retellPage(box, item, () => { draw(); window.scrollTo(0, 0); }); };
  }
  draw();
}

// ---------- Generadores ----------
function vocabQuestions(levels, n) {
  const pool = ALL_VOCAB.filter((v) => levels.includes(v.level));
  return shuffle(pool).slice(0, n).map((w, k) => {
    const others = shuffle(pool.filter((x) => x.id !== w.id && x.es !== w.es)).slice(0, 3);
    if (k % 2) { const opts = shuffle([w, ...others]); return ["mc", `¿Cómo se dice “${w.es}” en inglés?`, opts.map((x) => x.en), opts.indexOf(w), w.ex]; }
    const opts = shuffle([w, ...others]); return ["mc", `¿Qué significa “${w.en}”?`, opts.map((x) => x.es), opts.indexOf(w), w.ex];
  });
}
function grammarQuestions(lv, n, types) { return shuffle(LESSONS[lv].flatMap((l) => l.ex).filter((e) => !types || types.includes(e[0]))).slice(0, n); }

function grammarReview(m, lessons, title) {

  exerciseRunner(m, ordered, {
    title: title || "Repaso de gramática", subtitle: ls.map((l) => l.title).join(" · "), onExit: () => render(),
    onFinish: (c, n, wrongs) => {
      const wrongSet = new Set(wrongs.map((w) => w.ex));
      if (!lessons) ls.forEach((l) => { const r = S.lessons[l.id]; const its = ordered.filter((e) => EX_LESSON.get(e) === l.id); const ok = its.filter((e) => !wrongSet.has(e)).length; if (ok / its.length >= 0.75) r.stage = Math.min(REVIEW_STEPS.length - 1, (r.stage || 0) + 1); else r.stage = Math.max(0, (r.stage || 0) - 1); r.due = Date.now() + REVIEW_STEPS[r.stage] * DAY; });

}

function roleplay(m, rp) {
