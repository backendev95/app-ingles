const CS_UNITS = [
  { id: "cs-intro", title: "Qué es el connected speech", explain: `<p>Cuando los nativos hablan a velocidad normal no pronuncian cada palabra por separado: <b>unen</b> palabras, <b>reducen</b> las que no son importantes y a veces <b>cambian o eliminan</b> sonidos. Por eso puedes entender un texto escrito y no entender la misma frase hablada.</p><p>No necesitas hablar así para que te entiendan, pero sí <b>reconocerlo</b> para entender a los nativos. Y si lo usas con moderación, sonarás mucho más natural.</p><p>En toda la app verás el recuadro <b>🔗 Así suena</b> debajo de las frases. Leyenda: <span class="cs-link">‿</span> palabras unidas · <span class="cs-weak">to</span> forma débil · <span class="cs-red">gonna</span> reducción · <span class="cs-elide">t</span> sonido que casi desaparece · <span class="cs-flap">t</span> T que suena como una «d» suave.</p>`,
    examples: [["What do you want to do?", "Whaddya wanna do?", "Reducción y asimilación"], ["I'm going to have a look at it.", "I'm gonna have a look‿at‿it.", "Reducción y unión"], ["Did you eat yet?", "Didja eat yet?", "Asimilación d + y"], ["Let me get it for you.", "Lemme ged‿it fər you.", "Reducción, T americana y forma débil"]],
    practice: ["What do you want to do tonight?", "I'm going to call you later.", "Did you finish it?", "Let me know if you need anything."] },
  { id: "cs-linking", title: "Unir consonante + vocal (linking)", explain: `<p>Cuando una palabra termina en <b>sonido de consonante</b> y la siguiente empieza con <b>vocal</b>, la consonante se pasa a la siguiente palabra: <i>turn it off</i> suena «tur-ni-toff»; <i>pick it up</i> suena «pi-ki-tup».</p><p>Ojo: lo que cuenta es el sonido, no la letra. <i>make it</i> también se une (la e de make no suena): «may-kit».</p>`,
    examples: [["Turn it off.", "Tur‿ni‿toff.", ""], ["Pick it up.", "Pi‿ki‿tup.", ""], ["Look at it.", "Loo‿ka‿tit.", ""], ["Check it out.", "Che‿ki‿tout.", ""], ["Can I have an apple?", "Ca‿nI have a‿napple?", ""], ["It's an old idea.", "It's a‿nol‿didea.", ""]],
    practice: ["Turn it off and put it away.", "Check it out on our website.", "Can I ask a question?", "Hold on a minute.", "Come in and sit down."] },
  { id: "cs-vowels", title: "Unir vocal + vocal (sonidos y / w)", explain: `<p>Entre dos vocales aparece un sonido de enlace muy suave:</p><ul><li>Después de <b>i, ee, ay, y</b> se mete una <b>y</b>: <i>I am</i> → «I‿(y)am», <i>the end</i> → «the‿(y)end», <i>say it</i> → «say‿(y)it».</li><li>Después de <b>o, oo, u, ow</b> se mete una <b>w</b>: <i>go on</i> → «go‿(w)on», <i>do it</i> → «do‿(w)it», <i>how are you</i> → «how‿(w)are you».</li></ul>`,
    examples: [["I am ready.", "I‿(y)am ready.", "sonido y"], ["See you at the end.", "See you‿(w)at the‿(y)end.", "w y y"], ["Go on!", "Go‿(w)on!", "sonido w"], ["Do it again.", "Do‿(w)i‿tagain.", "w + linking"], ["How are you?", "How‿(w)are you?", "sonido w"], ["Say it again.", "Say‿(y)i‿tagain.", "y + linking"]],
    practice: ["I am so happy to see you.", "Go on, try it again.", "How about the other one?", "Do it as soon as you can."] },
  { id: "cs-weak", title: "Formas débiles: to, for, of, and, can…", explain: `<p>Las palabras gramaticales casi siempre se dicen <b>débiles</b>, con la vocal neutra /ə/ (schwa):</p><ul><li><b>to</b> → tə · <b>for</b> → fər · <b>of</b> → əv · <b>and</b> → ən · <b>or</b> → ər</li><li><b>can</b> → kən · <b>was</b> → wəz · <b>were</b> → wər · <b>are</b> → ər · <b>a</b> → ə · <b>the</b> → thə</li><li><b>him</b> → im · <b>her</b> → ər · <b>them</b> → əm (la h y la th a veces desaparecen)</li></ul><p>Se dicen fuertes solo al final de la frase o si quieres enfatizarlas: <i>Yes, I <b>can</b>!</i> Ojo: <b>can't</b> nunca se reduce; por eso se distingue de <i>can</i> por la vocal: «kən» vs «kænt».</p>`,
    examples: [["I want to go to the bank.", "I wanna go tə thə bank.", "to → tə"], ["A cup of tea for me, please.", "Ə cup əv tea fər me, please.", "of → əv, for → fər"], ["Fish and chips.", "Fish ən chips.", "and → ən"], ["I can swim, but I can't dive.", "I kən swim, bət I can't dive.", "can débil vs can't fuerte"], ["Tell him I was at work.", "Tell‿im I wəz ət work.", "him → im"], ["Where are they from?", "Where ər they from?", "from al final: fuerte"]],
    practice: ["I'd like a cup of coffee and a sandwich.", "She was waiting for her friends.", "I can come at five or six.", "Tell them to call me back."] },
  { id: "cs-reductions", title: "Reducciones: gonna, wanna, gotta…", explain: `<p>En el habla informal ciertas combinaciones se funden en una sola palabra. Las verás escritas en chats y canciones, pero en textos formales se escriben completas:</p><ul><li><b>going to</b> → gonna · <b>want to</b> → wanna · <b>got to</b> → gotta · <b>have to</b> → hafta</li><li><b>let me</b> → lemme · <b>give me</b> → gimme · <b>kind of</b> → kinda · <b>sort of</b> → sorta · <b>out of</b> → outta · <b>a lot of</b> → a lotta</li><li><b>don't know</b> → dunno · <b>what do you</b> → whaddya · <b>what are you</b> → whatcha</li></ul><p>Importante: <i>going to</i> solo se reduce cuando es futuro (<i>I'm gonna eat</i>), no cuando vas a un lugar (<i>I'm going to the park</i>).</p>`,
    examples: [["I'm going to tell you something.", "I'm gonna tell you something.", ""], ["Do you want to come?", "D'you wanna come?", ""], ["I've got to go.", "I've gotta go.", ""], ["Let me see.", "Lemme see.", ""], ["Give me a second.", "Gimme ə second.", ""], ["It's kind of weird.", "It's kinda weird.", ""], ["I don't know.", "I dunno.", ""], ["What are you doing?", "Whatcha doing?", ""]],
    practice: ["I'm going to need some help with this.", "Do you want to grab a coffee?", "I have to finish this today.", "Let me think about it.", "It's kind of hard to explain.", "What are you going to do?"] },
  { id: "cs-assimilation", title: "Asimilación: did you → «didja»", explain: `<p>Cuando una palabra termina en <b>t</b> o <b>d</b> y la siguiente es <b>you / your</b>, los sonidos se mezclan:</p><ul><li><b>t + you</b> → «cha»: <i>meet you</i> → «meecha», <i>don't you</i> → «doncha», <i>what you</i> → «whatcha», <i>got you</i> → «gotcha».</li><li><b>d + you</b> → «ja»: <i>did you</i> → «didja», <i>would you</i> → «wouldja», <i>could you</i> → «couldja», <i>and you</i> → «anja».</li></ul><p>También: <i>this year</i> → «thishyear», <i>miss you</i> → «mishyou».</p>`,
    examples: [["Nice to meet you.", "Nice tə meetcha.", "t + you"], ["Did you see that?", "Didja see that?", "d + you"], ["Would you like some tea?", "Wouldja like some tea?", "d + you"], ["Don't you think so?", "Doncha think so?", "t + you"], ["Could you help me?", "Couldja help me?", "d + you"], ["I'll let you know.", "I'll letcha know.", "t + you"]],
    practice: ["Did you get my message?", "Would you mind closing the door?", "Nice to meet you, I'm Laura.", "What did you say?", "Could you send it to me?"] },
  { id: "cs-elision", title: "Elisión: sonidos que desaparecen", explain: `<p>Una <b>t</b> o <b>d</b> entre dos consonantes casi no se pronuncia: <i>next week</i> → «nex week», <i>last night</i> → «las night», <i>sandwich</i> → «sanwich», <i>don't know</i> → «don know».</p><p>Esto explica por qué a veces no oyes el pasado: <i>I walked to work</i> suena casi «I walk to work». El contexto te ayuda a entender.</p>`,
    examples: [["Next week.", "Nex week.", ""], ["Last night.", "Las night.", ""], ["I don't know.", "I don know.", ""], ["She must be tired.", "She mus be tired.", ""], ["I asked them.", "I ask them.", "La -ed casi desaparece"], ["The best part.", "The bes part.", ""]],
    practice: ["See you next Monday.", "I couldn't sleep last night.", "You must be joking.", "We stopped by the old market.", "It's the best day of my life."] },
  { id: "cs-flap", title: "La T americana (flap T)", explain: `<p>En inglés de Estados Unidos, una <b>t</b> entre vocales (y sin acento después) suena como una <b>d muy rápida</b>, casi como la «r» de «pero»: <i>water</i> → «wader», <i>better</i> → «bedder», <i>city</i> → «cidy», <i>a lot of</i> → «a lodda».</p><p>También pasa entre palabras: <i>get it</i> → «gedit», <i>what about</i> → «whadabout», <i>put it on</i> → «pudidon».</p><p>En inglés británico la t suele mantenerse clara. Ambas formas son correctas.</p>`,
    examples: [["A glass of water.", "Ə glass əv wader.", ""], ["It's getting better.", "It's gedding bedder.", ""], ["What about you?", "Whadabout you?", ""], ["Get it out of here.", "Gedi doudda here.", ""], ["I bought a lot of things.", "I bough də lodda things.", ""], ["It's a beautiful city.", "It's ə beaudiful cidy.", ""]],
    practice: ["Put it on the table.", "It's a little bit better.", "What about a glass of water?", "Get out of the city for a while.", "I forgot it at home."] },
  { id: "cs-rhythm", title: "Ritmo: palabras fuertes y débiles", explain: `<p>El inglés tiene un ritmo marcado por el acento: las <b>palabras de contenido</b> (sustantivos, verbos principales, adjetivos, adverbios, negativos) se dicen fuertes y claras; las <b>palabras gramaticales</b> (artículos, preposiciones, auxiliares, pronombres) se dicen rápidas y débiles.</p><p>Por eso <i>CATS eat FISH</i> y <i>the CATS have been EATing the FISH</i> duran casi lo mismo: se "comprimen" las palabras débiles. Practica marcando un golpe en cada palabra fuerte.</p>`,
    examples: [["I WANT to GO to the BEACH.", "I want tə go tə thə beach.", "3 golpes"], ["She's BEEN WORKing at the BANK for YEARS.", "She's been working ət thə bank fər years.", "4 golpes"], ["WHAT do you THINK about it?", "Whaddya think əbou‿tit?", "2 golpes"], ["I DIDN'T SAY that.", "I didn't say that.", "Los negativos van fuertes"]],
    practice: ["I want to go to the beach this weekend.", "She's been working at the bank for years.", "What do you think about the new plan?", "We should have called them earlier."] }
];

  { title: "Postmortem: checkout outage", text: `Summary: On March 14, the checkout service was unavailable for 42 minutes. During this time, about 3,200 customers were unable to complete their purchases.\n\nTimeline: At 14:05, a new version of the payment service was deployed. At 14:12, monitoring alerts showed a sharp increase in error rates. The on-call engineer started investigating at 14:15. At 14:40, the team decided to roll back the deployment, and the service fully recovered at 14:47.\n\nRoot cause: The new version introduced a connection leak. Database connections were opened but never closed, so the connection pool was exhausted after a few minutes of normal traffic.\n\nWhat went well: Alerts were triggered quickly, and the rollback process worked as expected.\n\nWhat went wrong: The issue was not detected in staging because staging traffic is much lower than production traffic. It also took 25 minutes to decide to roll back.\n\nAction items: add load tests to the deployment pipeline; create a rule to roll back automatically if error rates exceed 5%; add a check for unclosed connections in code reviews.`, q: [

  { title: "README: quick-cache library", text: `quick-cache is a lightweight in-memory cache for Node.js applications. It helps you reduce latency and database load by storing the results of expensive operations.\n\nInstallation: run npm install quick-cache. Node.js 18 or later is required.\n\nUsage: create a cache with a default time-to-live, or TTL, in seconds. Call the get method with a key; if the value is not cached, provide a function that loads it. The result will be stored and returned on the next call until it expires.\n\nConfiguration: you can set a maximum number of entries. When the limit is reached, the least recently used items are removed first. Setting the TTL to zero disables expiration, which is not recommended for data that changes often.\n\nContributing: pull requests are welcome. Please open an issue first to discuss what you would like to change, and make sure to update the tests as appropriate. This project is licensed under the MIT License.`, q: [

  { title: "Blog: How to write better pull requests", text: `A good pull request makes life easier for everyone on the team. Reviewers understand your changes faster, bugs are caught earlier, and the project history becomes a useful source of documentation.\n\nKeep it small. Large pull requests are hard to review, so they often receive superficial feedback. If a change touches many files, consider splitting it into several smaller pull requests that can be reviewed independently.\n\nWrite a clear description. Explain what the change does, why it is needed and how it was tested. Screenshots are extremely helpful for user interface changes. If there are parts you are unsure about, say so: it shows honesty and directs the reviewer's attention to where it matters most.\n\nRespond to feedback professionally. Comments on your code are not comments on you. Thank reviewers for their time, ask questions when something isn't clear, and don't be afraid to explain your reasoning if you disagree. The goal is not to win the discussion but to ship better software together.`, q: [

const PRON = [
  { id: "p-ii", title: "ship / sheep: la i corta y la i larga", type: "pairs", explain: `<p>El español tiene una sola <b>i</b>. El inglés tiene dos: la <b>/ɪ/ corta y relajada</b> (<i>ship, sit, live</i>), entre la i y la e del español, y la <b>/iː/ larga y tensa</b> (<i>sheep, seat, leave</i>), como una i española alargada y sonriendo.</p><p>Confundirlas cambia el significado, y a veces mucho: <i>beach / bitch, sheet / shit</i>.</p>`, pairs: [["ship", "sheep"], ["sit", "seat"], ["live", "leave"], ["fill", "feel"], ["hit", "heat"], ["bin", "bean"], ["slip", "sleep"], ["chip", "cheap"], ["fit", "feet"], ["still", "steal"], ["rich", "reach"], ["it", "eat"]] },
  { id: "p-ae", title: "cat / cut / cart: tres vocales que en español son «a»", type: "pairs", explain: `<p><b>/æ/</b> (<i>cat, bad, man</i>): abre mucho la boca, entre a y e. <b>/ʌ/</b> (<i>cut, bus, love</i>): una a corta, relajada, casi sin abrir. <b>/ɑː/</b> (<i>cart, father, car</i>): a larga y profunda.</p><p>Truco: sonríe un poco para la /æ/; relaja la cara para la /ʌ/.</p>`, pairs: [["cat", "cut"], ["bad", "bud"], ["hat", "hut"], ["cap", "cup"], ["ran", "run"], ["match", "much"], ["bag", "bug"], ["hut", "heart"], ["cut", "cart"], ["fan", "fun"], ["lack", "luck"], ["track", "truck"]] },
  { id: "p-bv", title: "b / v: very no es berry", type: "pairs", explain: `<p>En español, b y v suenan igual. En inglés son distintas: <b>/b/</b> junta los dos labios; <b>/v/</b> apoya los <b>dientes de arriba sobre el labio de abajo</b> y vibra (como una f con voz).</p><p>Practica exagerando: <i>very, vest, vote, never, have</i>.</p>`, pairs: [["berry", "very"], ["ban", "van"], ["best", "vest"], ["boat", "vote"], ["bet", "vet"], ["base", "vase"], ["curb", "curve"], ["bowl", "vole"], ["bent", "vent"], ["marble", "marvel"]] },
  { id: "p-th", title: "th: think, this (y no tink, dis)", type: "pairs", explain: `<p>La <b>/θ/</b> (<i>think, three, mouth</i>) es como la z del español de España: lengua entre los dientes, sin voz. La <b>/ð/</b> (<i>this, they, mother</i>) es igual pero con voz, vibrando.</p><p>Errores típicos: decir <i>tink</i>, <i>sink</i> o <i>dis</i>. Saca un poquito la punta de la lengua.</p>`, pairs: [["thin", "tin"], ["three", "tree"], ["think", "sink"], ["thank", "tank"], ["they", "day"], ["then", "den"], ["mouth", "mouse"], ["path", "pass"], ["thought", "taught"], ["faith", "face"], ["those", "doze"], ["breathe", "breed"]] },
  { id: "p-h", title: "h aspirada: hat no es at", type: "pairs", explain: `<p>La <b>h</b> inglesa suena: es un soplo suave de aire, como cuando empañas un vidrio. No es la j española (no raspa la garganta) y no es muda.</p><p>Excepciones con h muda: <i>hour, honest, honour, heir</i>.</p>`, pairs: [["hat", "at"], ["hair", "air"], ["heat", "eat"], ["hold", "old"], ["hand", "and"], ["hit", "it"], ["heart", "art"], ["hear", "ear"], ["high", "eye"], ["hate", "eight"]] },
  { id: "p-shch", title: "sh / ch: share no es chair", type: "pairs", explain: `<p><b>/ʃ/</b> (<i>she, shop, wash</i>) es un sonido continuo, como pedir silencio: «shhh». <b>/tʃ/</b> (<i>chair, watch</i>) es la ch del español: empieza con un pequeño golpe.</p>`, pairs: [["share", "chair"], ["ship", "chip"], ["wash", "watch"], ["sheep", "cheap"], ["shoes", "choose"], ["cash", "catch"], ["sheet", "cheat"], ["shop", "chop"], ["wish", "witch"], ["dish", "ditch"]] },
  { id: "p-jy", title: "y / j: yes no es Jess", type: "pairs", explain: `<p>La <b>y</b> inglesa (<i>yes, you, year</i>) es suave, como la i en <i>«ieso»</i>. La <b>j</b> inglesa (<i>job, juice, Jess</i>) es como la «ll» argentina fuerte o la «dy»: <i>«dyob»</i>.</p><p>Muchos hispanohablantes dicen <i>«jes»</i> en vez de <i>yes</i>, o <i>«yob»</i> en vez de <i>job</i>.</p>`, pairs: [["yes", "Jess"], ["yolk", "joke"], ["yam", "jam"], ["yell", "jell"], ["yet", "jet"], ["Yale", "jail"], ["year", "jeer"], ["use", "juice"]] },
  { id: "p-final", title: "Consonantes finales: no te las comas", type: "pairs", explain: `<p>En español casi ninguna palabra termina en <i>b, d, g, p, t, k, v, z</i>. En inglés sí, y cambian el significado. Pronuncia el final con claridad.</p><p>Además, una vocal antes de consonante sonora (b, d, g, v, z) se alarga: <i>bed</i> suena más largo que <i>bet</i>.</p>`, pairs: [["bed", "bet"], ["cab", "cap"], ["eyes", "ice"], ["leave", "leaf"], ["prize", "price"], ["bag", "back"], ["card", "cart"], ["rise", "rice"], ["dog", "dock"], ["half", "have"], ["plays", "place"], ["send", "sent"]] },
  { id: "p-ed", title: "Terminación -ed: /t/, /d/ o /ɪd/", type: "class", options: ["/t/ como «workt»", "/d/ como «playd»", "/ɪd/ sílaba extra «wanted»"], explain: `<p>La -ed del pasado <b>casi nunca</b> es una sílaba extra. Regla:</p><ul><li>Después de <b>t</b> o <b>d</b> → <b>/ɪd/</b>, sílaba extra: <i>wanted, needed, decided</i>.</li><li>Después de sonido sordo (p, k, f, s, sh, ch, th) → <b>/t/</b>: <i>worked, stopped, washed, laughed</i>.</li><li>Después de sonido sonoro y vocales → <b>/d/</b>: <i>played, lived, called, cleaned</i>.</li></ul><p>Decir <i>«work-ed»</i> con dos sílabas es uno de los errores más comunes.</p>`, items: [["worked", 0], ["played", 1], ["wanted", 2], ["stopped", 0], ["lived", 1], ["needed", 2], ["washed", 0], ["called", 1], ["decided", 2], ["laughed", 0], ["cleaned", 1], ["started", 2], ["watched", 0], ["opened", 1], ["visited", 2], ["helped", 0], ["arrived", 1], ["ended", 2], ["kissed", 0], ["changed", 1]] },
  { id: "p-s", title: "Terminación -s / -es: /s/, /z/ o /ɪz/", type: "class", options: ["/s/ como «cats»", "/z/ como «dogs»", "/ɪz/ sílaba extra «buses»"], explain: `<p>Plurales, tercera persona (<i>he works</i>) y posesivos siguen la misma regla:</p><ul><li>Después de s, z, sh, ch, j, x → <b>/ɪz/</b>, sílaba extra: <i>buses, watches, pages, boxes</i>.</li><li>Después de sonido sordo (p, t, k, f, th) → <b>/s/</b>: <i>cats, books, stops</i>.</li><li>Después de sonido sonoro y vocales → <b>/z/</b>: <i>dogs, plays, lives, goes</i>.</li></ul>`, items: [["cats", 0], ["dogs", 1], ["buses", 2], ["books", 0], ["plays", 1], ["watches", 2], ["stops", 0], ["lives", 1], ["pages", 2], ["works", 0], ["goes", 1], ["boxes", 2], ["laughs", 0], ["friends", 1], ["washes", 2], ["months", 0], ["calls", 1], ["changes", 2]] },
  { id: "p-stress", title: "Acento de las palabras", type: "stress", explain: `<p>En inglés la sílaba acentuada se dice más fuerte, más larga y más aguda; las demás se «comen» (se reducen a una vocal neutra). Poner el acento en la sílaba equivocada hace que no te entiendan aunque los sonidos estén bien.</p><p>Patrones útiles: palabras en <b>-tion, -sion, -ic, -ity</b> llevan el acento justo antes del sufijo (<i>informAtion, ecOnomic, possiBIlity</i>). Muchos sustantivos de 2 sílabas lo llevan en la primera (<i>PREsent</i>) y los verbos en la segunda (<i>to preSENT</i>).</p>`, items: [["photograph", ["pho", "to", "graph"], 0], ["photography", ["pho", "to", "gra", "phy"], 1], ["photographic", ["pho", "to", "gra", "phic"], 2], ["comfortable", ["com", "for", "ta", "ble"], 0], ["vegetable", ["ve", "ge", "ta", "ble"], 0], ["important", ["im", "por", "tant"], 1], ["develop", ["de", "ve", "lop"], 1], ["economy", ["e", "co", "no", "my"], 1], ["economic", ["e", "co", "no", "mic"], 2], ["hotel", ["ho", "tel"], 1], ["interesting", ["in", "te", "res", "ting"], 0], ["determine", ["de", "ter", "mine"], 1], ["opportunity", ["op", "por", "tu", "ni", "ty"], 2], ["record (sustantivo)", ["re", "cord"], 0], ["record (verbo)", ["re", "cord"], 1], ["technology", ["tech", "no", "lo", "gy"], 1], ["Japanese", ["Ja", "pa", "nese"], 2], ["chocolate", ["cho", "co", "late"], 0]] },
  { id: "p-s-cluster", title: "s + consonante: speak, no «espeak»", type: "shadow", explain: `<p>En español ninguna palabra empieza por <b>s + consonante</b>, así que tendemos a agregar una «e»: <i>«espeak», «estudent», «Espain»</i>. En inglés la s va directo: alarga la s como una serpiente y luego la consonante: <i>sssspeak</i>.</p>`, lines: ["Speak slowly, please.", "I study at a small school in Spain.", "The students stopped at the station.", "She speaks Spanish and Swedish.", "Start the story from the beginning.", "Stay strong and stop stressing."] },
  { id: "p-schwa", title: "La vocal neutra (schwa) y las formas débiles", type: "shadow", explain: `<p>El sonido más común del inglés es la <b>schwa /ə/</b>: una «e» muy corta y relajada que aparece en sílabas sin acento: <i>about, banana, teacher, problem</i>.</p><p>Las palabras gramaticales (<i>to, for, of, can, was, and, a, the</i>) casi siempre se dicen débiles: <i>I want <b>tə</b> go</i>, <i>a cup <b>əv</b> tea</i>, <i>I <b>kən</b> swim</i>. Si las pronuncias fuertes sonarás robótico y te costará entender a los nativos.</p>`, lines: ["I want to go to the cinema.", "Can you give me a cup of tea?", "I was at the doctor's for an hour.", "Fish and chips for two, please.", "What are you going to do?", "She can swim, but she can't dive."] },
  { id: "p-linking", title: "Unir palabras (linking) y ritmo", type: "shadow", explain: `<p>Los nativos unen las palabras: una consonante final se une con la vocal siguiente (<i>turn_off → «tur-noff», pick_it_up → «pi-ki-tup»</i>). También acentúan solo las palabras importantes y aceleran las demás: es un idioma de <b>ritmo marcado por el acento</b>, no sílaba por sílaba como el español.</p><p>Escucha el modelo y fíjate en el ritmo más que en cada sonido.</p>`, lines: ["Turn it off and put it away.", "Pick it up and give it back.", "What do you want to eat?", "I'll call you as soon as I get home.", "Not at all, it's an old idea.", "Could you hold on a minute?"] }
];

    ${isL && (shownT || all) && !o.exam ? `<details class="card" ${all ? "open" : ""}><summary><b>Transcripción</b></summary>${item.lines.map(([sp, t], i) => `<div class="line" data-line="${i}"><p><b>${esc(sp)}:</b> ${esc(t)} ${speakBtn(t)}</p>${csBox(t, false)}</div>`).join("")}</details>` : ""}

// ---------- Generadores ----------
function vocabQuestions(levels, n) {
  const pool = ALL_VOCAB.filter((v) => levels.includes(v.level));
  return shuffle(pool).slice(0, n).map((w, k) => {
    const others = shuffle(pool.filter((x) => x.id !== w.id && x.es !== w.es)).slice(0, 3);
    if (k % 2) { const opts = shuffle([w, ...others]); return ["mc", `¿Cómo se dice “${w.es}” en inglés?`, opts.map((x) => x.en), opts.indexOf(w), w.ex]; }
    const opts = shuffle([w, ...others]); return ["mc", `¿Qué significa “${w.en}”?`, opts.map((x) => x.es), opts.indexOf(w), w.ex];
  });
}
function grammarQuestions(lv, n, types) { return shuffle(LESSONS[lv].flatMap((l) => l.ex).filter((e) => !types || types.includes(e[0]))).slice(0, n); }

function placementTest(m) {
  const levels = LEVELS.slice(); let li = 0, reached = "A2";
  const runLevel = () => {
    const lv = levels[li];
    const items = shuffle(grammarQuestions(lv, 6, ["mc", "fill"]).concat(vocabQuestions([lv], 3)));
    exerciseRunner(m, items, {
      title: "Prueba de ubicación", subtitle: `Bloque ${li + 1} de ${levels.length} · Si no sabes, no adivines: elige la que creas y sigue.`, strict: true,
      onExit: () => render(),
      onFinish: (c, n) => {
        const ok = c / n >= 0.7;
        if (ok && li < levels.length - 1) { li++; reached = levels[li]; runLevel(); return; }
        const final = ok ? "C2" : levels[li];

}

function grammarReview(m, lessons, title) {

      wrongs.forEach((w) => addMistake({ type: "Gramática", wrong: w.given, right: w.answer, note: w.why || "Repaso", q: w.q }));
      skill("grammar", c, n); markDaily("grammar"); addXP(c * 4);
      m.innerHTML = `<div class="card center"><div class="big">🔁</div><h2>${c} de ${n} correctas</h2><p>${lessons ? "Sigue reforzando estos temas hasta superar el 80%." : "Programé el próximo repaso de cada lección según tu resultado."}</p><button class="btn" id="ok">Continuar</button></div>`;

}
function levelExam(m, lv) {
  const sections = [
    { name: "Gramática", kind: "ex", items: grammarQuestions(lv, 12) },
    { name: "Vocabulario", kind: "ex", items: vocabQuestions([lv], 8) }
  ];
  if ((READINGS[lv] || []).length) sections.push({ name: "Lectura", kind: "reading", item: pick(ALL_READINGS.filter((r) => r.level === lv)) });
  if ((LISTENING[lv] || []).length) sections.push({ name: "Escucha", kind: "listening", item: pick(ALL_LISTENING.filter((r) => r.level === lv)) });
  const res = []; let si = 0;
  const exit = () => { stopSpeech(); render(); };
  const intro = () => {
    m.innerHTML = `<div class="card"><h1>Examen de nivel ${lv}</h1><p>${sections.map((s, i) => `${i + 1}. <b>${s.name}</b>`).join(" · ")}</p><p class="muted">Sin explicaciones durante el examen. Al final verás tu resultado por sección. Necesitas <b>75% en total</b> y <b>60% en cada sección</b>.</p><div class="row"><button class="btn big-btn" id="go">Empezar</button><button class="btn ghost" id="x">Cancelar</button></div></div>`;
    $("#go").onclick = runS; $("#x").onclick = exit;
  };
  const runS = () => {
    const s = sections[si]; if (!s) return finish();
    const sub = `Examen ${lv} · Sección ${si + 1}/${sections.length}: ${s.name}`;
    const done = (c, n) => { res.push({ name: s.name, c, n }); si++; runS(); };
    if (s.kind === "ex") exerciseRunner(m, s.items, { title: s.name, subtitle: sub, strict: true, onExit: exit, onFinish: (c, n) => done(c, n) });
    else comprehension(m, s.item, { kind: s.kind, exam: true, subtitle: sub, onExit: exit, onFinish: done });
  };
  const finish = () => {
    const C = res.reduce((a, r) => a + r.c, 0), N = res.reduce((a, r) => a + r.n, 0), total = C / N;
    const passed = total >= 0.75 && res.every((r) => r.c / r.n >= 0.6);
    const r = S.exams[lv] || { best: 0, passed: false }; r.best = Math.max(r.best, total); r.placement = false;
    let msg = "";
    if (passed) {
      r.passed = true; const nx = LEVELS[lvlIdx(lv) + 1];
      if (nx) { if (!S.unlocked.includes(nx)) S.unlocked.push(nx); if (lvlIdx(nx) > lvlIdx(S.level)) { S.level = nx; gLevel = nx; vq = null; } msg = `¡Felicitaciones! Subiste a <b>${nx}</b>. Se desbloquearon nuevas lecciones, vocabulario, lecturas, audios, conversaciones y temas de escritura.`; }
      else msg = "¡Completaste el camino hasta C2! Sigue con tarjetas, lecturas y escritura para mantener el nivel.";
    } else msg = "Todavía no. Revisa las secciones más bajas: repite las lecciones con menor puntaje, haz más lecturas o audios del nivel y vuelve a intentarlo.";
    S.exams[lv] = r;
    res.forEach((x) => skill({ Gramática: "grammar", Vocabulario: "vocab", Lectura: "reading", Escucha: "listening" }[x.name], x.c, x.n));
    addXP(C * 5);
    m.innerHTML = `<div class="card center"><div class="big">${passed ? "🎓" : "📚"}</div><h2>${pct(C, N)}% en total</h2>
      <div class="secs">${res.map((x) => `<div class="sec ${x.c / x.n >= 0.6 ? "ok" : "low"}"><b>${x.name}</b><span>${x.c}/${x.n} · ${pct(x.c, x.n)}%</span></div>`).join("")}</div><p>${msg}</p><button class="btn" id="ok">Continuar</button></div>`;
    $("#ok").onclick = () => render();
  };

}

// ---------- Grabadora (comparar tu voz con el modelo) ----------
let recState = { rec: null, chunks: [], blobs: {}, active: null, stream: null };
const recorderHTML = (k) => `<span class="recbox"><button class="icon-btn" data-rec="${k}" title="Grabarme">⏺️ Grabar</button><button class="icon-btn" data-play="${k}" ${recState.blobs[k] ? "" : "hidden"} title="Escuchar mi voz">▶️ Mi voz</button></span>`;
function bindRecorders(box) {
  $$("[data-rec]", box).forEach((b) => b.onclick = async () => {
    const k = b.dataset.rec;
    if (recState.active === k && recState.rec) { recState.rec.stop(); return; }
    if (recState.rec) { toast("Termina la grabación actual primero"); return; }
    try {
      if (!recState.stream) recState.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const r = new MediaRecorder(recState.stream); recState.rec = r; recState.chunks = []; recState.active = k;
      r.ondataavailable = (e) => recState.chunks.push(e.data);
      r.onstop = () => { recState.blobs[k] = new Blob(recState.chunks, { type: r.mimeType || "audio/webm" }); recState.rec = null; recState.active = null; b.textContent = "⏺️ Grabar"; b.classList.remove("on"); const p = $(`[data-play="${CSS.escape(k)}"]`, box); if (p) { p.hidden = false; } playBlob(k); };
      r.start(); b.textContent = "⏹️ Detener"; b.classList.add("on");
      setTimeout(() => { if (recState.active === k && recState.rec) recState.rec.stop(); }, 15000);
    } catch (e) { toast("No se pudo usar el micrófono para grabar (funciona en Chrome desde tu versión publicada)"); }
  });
  $$("[data-play]", box).forEach((b) => b.onclick = () => playBlob(b.dataset.play));
}
function playBlob(k) { const bl = recState.blobs[k]; if (!bl) return; try { const a = new Audio(URL.createObjectURL(bl)); a.play().catch(() => {}); } catch (e) {} }

      else ctl = `<input class="gap ${fieldCls(i, ok)}" data-g="${i}" placeholder="(${n})${part.type === "wf" ? " " + part.gaps[i][0] : ""}" value="${esc(v)}" ${ck ? "disabled" : ""} autocomplete="off" autocapitalize="off" spellcheck="false">`;
      const fix = ck && !ok ? `<span class="fixans">${esc(part.type === "mcc" ? part.gaps[i][0][part.gaps[i][1]] : part.type === "wf" ? part.gaps[i][1][0] : part.gaps[i][0])}</span>` : "";
      return `${ctl}${part.type === "wf" && !ck ? "" : ""}${fix}`;
    });

  ${ck ? `<div class="card center"><b>${correct} de ${count} correctas en esta parte</b></div><button class="btn wide" id="next">${st.part + 1 < mk.parts.length ? "Siguiente parte →" : "Ver resultado"}</button>` : `<button class="btn wide" id="check">Comprobar esta parte</button>`}`;
  const tick = () => { const s2 = Math.floor((Date.now() - st.start) / 1000); const el = $("#timer"); if (!el) return clearInterval(mockTimer); el.textContent = `⏱️ ${Math.floor(s2 / 60)}:${String(s2 % 60).padStart(2, "0")} / ${mk.minutes}:00`; el.classList.toggle("late", s2 > mk.minutes * 60); };
  tick(); mockTimer = setInterval(tick, 1000);

  $$("[data-g]", m).forEach((el) => { el.oninput = el.onchange = () => { vals[tag(+el.dataset.g)] = el.value; }; });

let lookupCache = {};

}

  if (r.status === 404) { cacheLookup(k, { none: true }); return { none: true }; }

// ---------- CORRECTOR (LanguageTool) ----------
async function languageTool(text) {
  const r = await fetch("https://api.languagetool.org/v2/check", { method: "POST", headers: { "content-type": "application/x-www-form-urlencoded" }, body: new URLSearchParams({ text, language: "en-US", motherTongue: "es" }) });

  if (!r.ok) throw new Error("El corrector no respondió (" + r.status + ")");
  return (await r.json()).matches || [];
}

    box.innerHTML = `<div class="card"><h3>El corrector encontró ${matches.length} posible(s) problema(s)</h3>${matches.map((mt, i) => { const ctx = mt.context; const bad = ctx.text.substr(ctx.offset, ctx.length); return `<div class="ltm"><div>…${esc(ctx.text.slice(0, ctx.offset))}<mark>${esc(bad)}</mark>${esc(ctx.text.slice(ctx.offset + ctx.length))}…</div><div class="small">${esc(mt.message)}</div>${mt.replacements.length ? `<div class="row">${mt.replacements.slice(0, 3).map((r, j) => `<button class="btn ghost small" data-fix="${i}" data-r="${j}">→ ${esc(r.value || "(borrar)")}</button>`).join("")}<button class="btn ghost small" data-ign="${i}">Ignorar</button></div>` : `<button class="btn ghost small" data-ign="${i}">Ignorar</button>`}</div>`; }).join("")}</div>`;
    $$("[data-fix]", box).forEach((b) => b.onclick = () => {
      const i = +b.dataset.fix, mt = matches[i], rep = mt.replacements[+b.dataset.r].value, v = t.value;
      if (v.substr(mt.offset, mt.length) !== mt.context.text.substr(mt.context.offset, mt.context.length)) { toast("El texto cambió; vuelve a revisar"); return; }
      t.value = v.slice(0, mt.offset) + rep + v.slice(mt.offset + mt.length);
      const delta = rep.length - mt.length; matches.splice(i, 1); matches.forEach((x) => { if (x.offset > mt.offset) x.offset += delta; });
      t.oninput && t.oninput(); draw();
    });
    $$("[data-ign]", box).forEach((b) => b.onclick = () => { matches.splice(+b.dataset.ign, 1); draw(); });
  };
  return async () => {
    const text = t.value.trim(); if (text.split(/\s+/).length < 5) { toast("Escribe algo primero"); return; }

      matches.filter((x) => x.replacements.length).slice(0, 8).forEach((x) => addMistake({ type: "Escritura", wrong: t.value.substr(x.offset, x.length), right: x.replacements[0].value, note: x.message }));
      skill("writing", matches.length ? 0 : 1, 1); draw();
    } catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
    setTimeout(() => { if ($("#lt")) $("#lt").disabled = false; }, 4000);
  };
}

  ${u.examples.map(([w, sounds, note], i) => `<div class="csex"><div><b>${esc(w)}</b>${note ? ` <span class="tag">${esc(note)}</span>` : ""}<div class="cssay">Suena como: <i>${esc(sounds)}</i></div></div><div class="row">${speakBtn(w, "🔊")}<button class="icon-btn" data-speak="${esc(w)}" data-rate="0.7">🐢</button>${recorderHTML("cs" + i)}</div></div>`).join("")}</div>
  <button class="btn big-btn" id="dict">🎧 Dictado a velocidad natural (${u.practice.length})</button>`;
  $("#back").onclick = () => { sub = null; render(); };
  $$(".explain i", m).forEach((it) => { it.classList.add("sp"); it.onclick = () => speak(it.textContent); });
  bindRecorders(m);
  $("#dict").onclick = () => csDictation(m, u);
}
function csDictation(m, u) {
  const items = shuffle(u.practice); let i = 0, total = 0;
  const show = () => {
    const s = items[i];
    if (!s) { const p = total / items.length; S.cs = S.cs || {}; S.cs[u.id] = Math.max(S.cs[u.id] || 0, p); skill("listening", Math.round(total), items.length); addXP(Math.round(total * 5));
      m.innerHTML = `<div class="card center"><div class="big">${p >= 0.8 ? "👂✨" : "👂"}</div><h2>${Math.round(p * 100)}% de precisión</h2><p>${p >= 0.8 ? "¡Tu oído ya reconoce estos sonidos!" : "Vuelve a escuchar los ejemplos, fíjate en el recuadro «Así suena» y repite el dictado."}</p><div class="row center"><button class="btn" id="again">Repetir</button><button class="btn ghost" id="back">Volver</button></div></div>`;
      $("#again").onclick = () => csDictation(m, u); $("#back").onclick = () => csPage(m, u); return; }
    m.innerHTML = `<div class="row between"><h1>Dictado: ${esc(u.title)}</h1><button class="btn ghost small" id="exit">Salir</button></div><div class="bar"><i style="width:${(i / items.length) * 100}%"></i></div><div class="muted small">${i + 1}/${items.length} · Velocidad natural: escribe la frase completa (con las palabras «escondidas»).</div>
    <div class="card excard"><div class="row center"><button class="btn big-btn" id="play">🔊 Escuchar</button><button class="btn ghost" id="slow">🐢</button></div><form id="cf"><textarea id="ci" rows="2" autocapitalize="off" spellcheck="false" placeholder="Escribe lo que escuchas…"></textarea><button class="btn wide">Comprobar</button></form><div id="fb"></div></div>`;
    $("#exit").onclick = () => csPage(m, u);
    $("#play").onclick = () => speak(s, 1.1); $("#slow").onclick = () => speak(s, 0.7);
    setTimeout(() => speak(s, 1.1), 250);
    $("#ci").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#cf").requestSubmit(); } };
    $("#cf").onsubmit = (e) => { e.preventDefault(); if ($("#nx")) return; const v = $("#ci").value; if (!v.trim()) return; const sc = similarity(s, v); total += sc;
      $("#fb").innerHTML = `<div class="feedback ${sc >= 0.9 ? "good" : "bad"}"><b>${Math.round(sc * 100)}%</b><p class="big-text">${diffWords(s, v)}</p>${csBox(s, true)}</div><button class="btn wide" id="nx">Siguiente ⏎</button>`;
      $("#nx").onclick = () => { i++; show(); }; $("#nx").focus(); };
  };
  show();
}

// ---------- INGLÉS PARA DESARROLLADORES ----------
const DEV_VOCAB = (() => { const out = []; let topic = "General", i = 0; DEV.vocab.split("\n").forEach((raw) => { const line = raw.trim(); if (line.startsWith("#")) { topic = line.replace(/^#\s*/, ""); return; } if (!line.includes("|")) return; const [en, es, ex] = line.split("|").map((x) => (x || "").trim()); out.push({ id: "DEV-" + i++, level: "DEV", topic, en, es, ex }); }); return out; })();
const DEV_RP = DEV.roleplays.map((x, i) => ({ ...x, id: "dev-p" + i, level: "TI" }));
const DEV_LI = DEV.listening.map((x, i) => ({ ...x, id: "dev-l" + i, level: "TI" }));
const DEV_RD = DEV.readings.map((x, i) => ({ ...x, id: "dev-r" + i, level: "TI" }));
const DEV_WR = DEV.writing.map((x, i) => ({ ...x, id: "dev-w" + i, level: "TI" }));
const DEV_NEW_PER_DAY = 5;
let devTab = "lecciones";
const DEV_TABS = [["lecciones", "📘 Situaciones"], ["vocab", "🗂️ Vocabulario"], ["conversa", "💬 Conversaciones"], ["escuchar", "🎧 Escuchar"], ["leer", "📖 Leer"], ["escribir", "✍️ Escribir"], ["entrevistas", "🎯 Entrevistas"], ["pron", "🗣️ Pronunciación técnica"]];
RENDER.ti = (m) => {
  if (sub && sub.devLesson) return devLessonPage(m, sub.devLesson);
  if (sub && sub.rp) return roleplay(m, sub.rp);
  if (sub && sub.w) return writingPage(m, sub.w);
  if (sub && sub.item) { const kind = sub.kind; return comprehension(m, sub.item, { kind, subtitle: "Inglés para desarrolladores", onExit: () => { sub = null; render(); }, onFinish: (c, n) => { (kind === "reading" ? S.done.reading : S.done.listening)[sub.item.id] = Math.max((kind === "reading" ? S.done.reading : S.done.listening)[sub.item.id] || 0, c / n); skill(kind === "reading" ? "reading" : "listening", c, n); addXP(c * 5); sub = null; render(); } }); }
  m.innerHTML = `<h1>💻 Inglés para desarrolladores</h1><p class="muted">El inglés que usarás en tu trabajo: dailies, code reviews, bugs, planning, documentación, entrevistas y comunicación escrita con equipos internacionales.</p>
  <div class="tabs">${DEV_TABS.map(([k, l]) => `<button class="tab ${devTab === k ? "on" : ""}" data-dt="${k}">${l}</button>`).join("")}</div><div id="dbody"></div>`;
  $$("[data-dt]", m).forEach((b) => b.onclick = () => { devTab = b.dataset.dt; render(); });
  const box = $("#dbody");
  const listItems = (arr, done, extra) => `<div class="lessons">${arr.map((x) => `<button class="lesson" data-i="${x.id}"><span class="num">💻</span><span><b>${esc(x.title)}</b><small>${extra(x)}${done && done[x.id] !== undefined ? (typeof done[x.id] === "number" ? ` · Mejor: ${Math.round(done[x.id] * 100)}%` : " · Hecho") : ""}</small></span><span class="st">${done && (done[x.id] === true || done[x.id] >= 0.75 || (done[x.id] && done[x.id].done)) ? "✅" : ""}</span></button>`).join("")}</div>`;
  if (devTab === "lecciones") {
    box.innerHTML = `<div class="lessons">${DEV.lessons.map((l) => { const r = S.lessons[l.id]; return `<button class="lesson" data-l="${l.id}"><span class="num">${l.icon}</span><span><b>${esc(l.title)}</b><small>${l.phrases.length} frases clave · ${l.ex.length} ejercicios${r ? ` · Mejor: ${Math.round(r.best * 100)}%` : ""}</small></span><span class="st">${r && r.best >= 0.7 ? "✅" : ""}</span></button>`; }).join("")}</div>`;
    $$("[data-l]", box).forEach((b) => b.onclick = () => { sub = { devLesson: DEV.lessons.find((l) => l.id === b.dataset.l) }; render(); });
  }
  if (devTab === "vocab") {
    const learned = DEV_VOCAB.filter((v) => S.cards[v.id] && S.cards[v.id].reps >= 2).length;
    const topics = [...new Set(DEV_VOCAB.map((v) => v.topic))];
    box.innerHTML = `<div class="card hero"><label class="cando"><input type="checkbox" id="devcards" ${S.settings.devCards === false ? "" : "checked"}> <span><b>Incluir en mis tarjetas diarias</b> (${DEV_NEW_PER_DAY} palabras técnicas nuevas por día, con repaso espaciado)</span></label><div class="bar"><i style="width:${pct(learned, DEV_VOCAB.length)}%"></i></div><div class="small muted">${learned} de ${DEV_VOCAB.length} aprendidas</div><button class="btn" id="quiz">⚡ Práctica rápida (12)</button></div>
    ${topics.map((t) => `<h2>${esc(t)}</h2><div class="card list">${DEV_VOCAB.filter((v) => v.topic === t).map((v) => { const st = S.cards[v.id]; return `<div class="li"><div><b>${esc(v.en)}</b> — ${esc(v.es)}<div class="muted small">${esc(v.ex)}</div></div>${speakBtn(v.en)}${v.ex ? speakBtn(v.ex, "💬") : ""}<span class="tag">${st ? (st.reps >= 2 ? "Aprendida" : "En curso") : "Nueva"}</span></div>`; }).join("")}</div>`).join("")}`;
    $("#devcards").onchange = (e) => { S.settings.devCards = e.target.checked; vq = null; save(); };
    $("#quiz").onclick = () => { const pool = shuffle(DEV_VOCAB).slice(0, 12); const items = pool.map((w, k) => { const others = shuffle(DEV_VOCAB.filter((x) => x.id !== w.id && x.es !== w.es)).slice(0, 3), opts = shuffle([w, ...others]); return k % 2 ? ["mc", `¿Cómo se dice “${w.es}” en inglés?`, opts.map((x) => x.en), opts.indexOf(w), w.ex] : ["mc", `¿Qué significa “${w.en}”?`, opts.map((x) => x.es), opts.indexOf(w), w.ex]; });
      exerciseRunner(m, items, { title: "Vocabulario técnico", onExit: () => render(), onFinish: (c, n) => { skill("vocab", c, n); addXP(c * 2); m.innerHTML = `<div class="card center"><h2>${c} de ${n}</h2><button class="btn" id="ok">Volver</button></div>`; $("#ok").onclick = () => render(); } }); };
  }
  if (devTab === "conversa") { box.innerHTML = `<p class="muted">Situaciones reales de trabajo: responde en voz alta o escribiendo y compárate con respuestas modelo.</p>` + listItems(DEV_RP, S.done.roleplay, (x) => esc(x.intro)); $$("[data-i]", box).forEach((b) => b.onclick = () => { sub = { rp: DEV_RP.find((x) => x.id === b.dataset.i), t: 0, scores: [] }; render(); }); }
  if (devTab === "escuchar") { box.innerHTML = `<p class="muted">Reuniones y llamadas reales con varias voces. Al terminar, revisa la transcripción con el connected speech.</p>` + listItems(DEV_LI, S.done.listening, (x) => `${x.lines.length} intervenciones · ${x.q.length} preguntas`); $$("[data-i]", box).forEach((b) => b.onclick = () => { sub = { item: DEV_LI.find((x) => x.id === b.dataset.i), kind: "listening" }; render(); }); }
  if (devTab === "leer") { box.innerHTML = `<p class="muted">Textos que leerás en tu trabajo: ofertas de empleo, postmortems, documentación y blogs técnicos. Tip: pega documentación real en <b>Leer → Mi lector</b>.</p>` + listItems(DEV_RD, S.done.reading, (x) => `~${x.text.split(/\s+/).length} palabras · ${x.q.length} preguntas`); $$("[data-i]", box).forEach((b) => b.onclick = () => { sub = { item: DEV_RD.find((x) => x.id === b.dataset.i), kind: "reading" }; render(); }); }
  if (devTab === "escribir") { box.innerHTML = `<p class="muted">Commits, bug reports, PRs, Slack, correos a reclutadores y tu perfil de LinkedIn, con corrector y texto modelo.</p>` + listItems(DEV_WR, S.done.writing, (x) => `${esc(x.words)} palabras`); $$("[data-i]", box).forEach((b) => b.onclick = () => { sub = { w: DEV_WR.find((x) => x.id === b.dataset.i) }; render(); }); }
  if (devTab === "entrevistas") {
    box.innerHTML = `<p class="muted">Las preguntas más comunes en entrevistas para empresas internacionales. Lee el consejo, prepara tu respuesta en voz alta y grábate; luego compárala con la respuesta modelo y adáptala a tu experiencia real.</p>
    ${DEV.interview.map((x, i) => `<div class="card iq"><div class="row between"><h3 style="margin:0">${i + 1}. ${esc(x.q)}</h3>${speakBtn(x.q)}</div><p class="small">💡 ${esc(x.tip)}</p><div class="row">${recorderHTML("iq" + i)}<span class="muted small">Grábate respondiendo (máx. 15 s por toma)</span></div><details><summary><b>Ver respuesta modelo</b></summary><p>${esc(x.model)} ${speakBtn(x.model)}</p>${csBox(x.model, false)}</details></div>`).join("")}`;
    bindRecorders(box);
  }
  if (devTab === "pron") {
    box.innerHTML = `<p class="muted">Términos técnicos que muchos hispanohablantes pronuncian mal. Escucha, repite y grábate.</p><div class="card list">${DEV.pron.map(([term, say, note], i) => `<div class="li"><div><b>${esc(term)}</b><div class="muted small">${esc(note)}</div></div>${speakBtn(say)}<button class="icon-btn" data-speak="${esc(say)}" data-rate="0.7">🐢</button>${recorderHTML("dp" + i)}</div>`).join("")}</div>`;
    bindRecorders(box);
  }
};
function devLessonPage(m, l) {
  m.innerHTML = `<div class="row between"><h1>${l.icon} ${esc(l.title)}</h1><button class="btn ghost small" id="back">← Inglés TI</button></div>
  <div class="card explain">${l.explain}</div>
  <div class="card"><h2>Frases clave</h2><p class="muted small">Escúchalas, repítelas y grábate. Abre «Así suena» para ver cómo se pronuncian a velocidad normal.</p>
  ${l.phrases.map(([en, es], i) => `<div class="phrase"><div class="row between"><div><b>${esc(en)}</b><div class="muted small">${esc(es)}</div></div><div class="row">${speakBtn(en)}<button class="icon-btn" data-speak="${esc(en)}" data-rate="0.7">🐢</button>${recorderHTML("dl" + i)}<button class="icon-btn" data-addc="${i}" title="Agregar a tarjetas">＋</button></div></div>${csBox(en, false)}</div>`).join("")}</div>
  <button class="btn big-btn" id="start">Practicar (${l.ex.length} ejercicios)</button>`;
  $("#back").onclick = () => { sub = null; render(); };
  $$(".explain i", m).forEach((it) => { it.classList.add("sp"); it.onclick = () => speak(it.textContent); });
  bindRecorders(m);
  $$("[data-addc]", m).forEach((b) => b.onclick = () => { const [en, es] = l.phrases[+b.dataset.addc]; addCustomCard(en, es, ""); b.textContent = "✓"; b.disabled = true; });
  $("#start").onclick = () => exerciseRunner(m, shuffle(l.ex), { title: l.title, onExit: () => devLessonPage(m, l), onFinish: (c, n, wrongs) => {
    const r = S.lessons[l.id] || { best: 0, tries: 0 }; r.best = Math.max(r.best, c / n); r.tries++; S.lessons[l.id] = r;
    wrongs.forEach((w) => addMistake({ type: "Inglés TI", wrong: w.given, right: w.answer, note: `${l.title}${w.why ? ": " + w.why : ""}`, q: w.q }));
    skill("grammar", c, n); addXP(c * 5);
    m.innerHTML = `<div class="card center"><div class="big">${c / n >= 0.7 ? "🏆" : "💪"}</div><h2>${c} de ${n}</h2><p>${c / n >= 0.7 ? "¡Muy bien! Usa estas frases en tu próxima reunión." : "Repasa las frases clave y vuelve a intentarlo."}</p><div class="row center"><button class="btn" id="again">Repetir</button><button class="btn ghost" id="back2">Volver</button></div></div>`;
    $("#again").onclick = () => devLessonPage(m, l); $("#back2").onclick = () => { sub = null; render(); };
  } });
}
