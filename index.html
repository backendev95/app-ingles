  : `<div class="center">${micButton("rec")}</div><p class="muted center" id="live"></p><form id="tf" class="row"><input id="ti" placeholder="O escribe tu respuesta en inglés"><button class="btn">Enviar</button></form><button class="btn ghost small" id="help">💡 Ver una respuesta modelo</button>`}`;

}

function addMistake(x) { if (!x.wrong || !x.right || norm(x.wrong) === norm(x.right)) return; S.mistakes.unshift({ ...x, at: Date.now() }); S.mistakes = S.mistakes.slice(0, 300); save(); }
function addCustomCard(en, es, ex, silent) {
  if (!en || !es) return;
  if (allCards().some((c) => norm(c.en) === norm(en))) { if (!silent) toast("Esa palabra ya está en tus tarjetas"); return; }
  S.custom.push({ id: "MIS-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), level: "MIS", topic: "Mías", en, es, ex: ex || "" }); vq = null; save();
  if (!silent) toast("Agregada a tus tarjetas");
}

// ---------- CORRECTOR (LanguageTool) ----------
async function languageTool(text) {
  const r = await fetch("https://api.languagetool.org/v2/check", { method: "POST", headers: { "content-type": "application/x-www-form-urlencoded" }, body: new URLSearchParams({ text, language: "en-US", motherTongue: "es" }) });
  if (r.status === 429) throw new Error("Demasiadas revisiones seguidas. Espera un minuto.");
  if (!r.ok) throw new Error("El corrector no respondió (" + r.status + ")");
  return (await r.json()).matches || [];
}
function ltPanel(m, t, w) {
  const box = $("#ltbox"); let matches = [];
  const draw = () => {
    if (!matches.length) { box.innerHTML = `<div class="feedback good"><b>✓ El corrector no encontró errores.</b> <span class="small">Ojo: revisa gramática y ortografía, no si el texto es natural o tiene buen estilo. Compáralo también con el modelo.</span></div>`; return; }
    box.innerHTML = `<div class="card"><h3>El corrector encontró ${matches.length} posible(s) problema(s)</h3>${matches.map((mt, i) => { const ctx = mt.context; const bad = ctx.text.substr(ctx.offset, ctx.length); return `<div class="ltm"><div>…${esc(ctx.text.slice(0, ctx.offset))}<mark>${esc(bad)}</mark>${esc(ctx.text.slice(ctx.offset + ctx.length))}…</div><div class="small">${esc(mt.message)}</div>${mt.replacements.length ? `<div class="row">${mt.replacements.slice(0, 3).map((r, j) => `<button class="btn ghost small" data-fix="${i}" data-r="${j}">→ ${esc(r.value || "(borrar)")}</button>`).join("")}<button class="btn ghost small" data-ign="${i}">Ignorar</button></div>` : `<button class="btn ghost small" data-ign="${i}">Ignorar</button>`}</div>`; }).join("")}</div>`;
    $$("[data-fix]", box).forEach((b) => b.onclick = () => {
      const i = +b.dataset.fix, mt = matches[i], rep = mt.replacements[+b.dataset.r].value, v = t.value;
      if (v.substr(mt.offset, mt.length) !== mt.context.text.substr(mt.context.offset, mt.context.length)) { toast("El texto cambió; vuelve a revisar"); return; }
      t.value = v.slice(0, mt.offset) + rep + v.slice(mt.offset + mt.length);
      const delta = rep.length - mt.length; matches.splice(i, 1); matches.forEach((x) => { if (x.offset > mt.offset) x.offset += delta; });
      t.oninput && t.oninput(); draw();
    });
    $$("[data-ign]", box).forEach((b) => b.onclick = () => { matches.splice(+b.dataset.ign, 1); draw(); });
  };
  return async () => {
    const text = t.value.trim(); if (text.split(/\s+/).length < 5) { toast("Escribe algo primero"); return; }
    if (inClaude()) { box.innerHTML = `<div class="card note">El corrector automático funciona en tu versión publicada (GitHub Pages). Dentro de Claude no puede conectarse a servicios externos.</div>`; return; }
    const btn = $("#lt"); btn.disabled = true; box.innerHTML = `<p class="muted">Revisando…</p>`;
    try {
      matches = (await languageTool(t.value)).filter((x) => x.rule && x.rule.issueType !== "whitespace");
      matches.filter((x) => x.replacements.length).slice(0, 8).forEach((x) => addMistake({ type: "Escritura", wrong: t.value.substr(x.offset, x.length), right: x.replacements[0].value, note: x.message }));
      skill("writing", matches.length ? 0 : 1, 1); draw();
    } catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
    setTimeout(() => { if ($("#lt")) $("#lt").disabled = false; }, 4000);
  };
}

const CHUNK_CARDS = CHUNKS.flatMap((g) => g.items.map((it, k) => ({ id: "CH-" + g.id.slice(3) + "-" + k, level: g.level, topic: g.title, en: it[0], es: it[1], ex: it[2], chunk: true })));
const chunkCore = (c) => c.replace(/\.\.\.|…|\?|\+.*$|\(.*?\)/g, "").split("/")[0].trim();

// Convierte los ejercicios del contenido al formato del motor de ejercicios
function chunkDrills(g) {
  const conv = g.drills.map((d) => d[0] === "sub" ? ["sub", d[1], d[3], d[4] || "", d[2]] : d[0] === "blocks" ? ["blocks", d[1], d[2]] : d);
  const meaning = shuffle(g.items.slice()).slice(0, 3).map((it) => {
    const others = shuffle(g.items.filter((x) => x !== it)).slice(0, 2).map((x) => x[1]);
    const opts = shuffle([it[1], ...others]);
    return ["mc", `¿Qué significa «${it[0]}»?`, opts, opts.indexOf(it[1]), it[2]];
  });
  return shuffle(conv.concat(meaning));
}

// ---------- Sesión de habla cronometrada (grabación + transcripción) ----------
function timedSpeak(box, o) {
  // o: { key, seconds, onDone(text, secs) }
  let left = o.seconds, timer = null, text = "", running = false, started = 0;
  box.innerHTML = `<div class="card center"><div class="timer" id="tm">${fmtSec(left)}</div><p class="muted small" id="tmh">Cuando toques “Empezar” se grabará tu voz${dictApi ? " y se transcribirá lo que digas" : ""}. Habla sin parar: si te bloqueas, usa una muletilla (<i>Let me think…</i>) y sigue.</p>
    <div class="row center"><button class="btn big-btn" id="go">▶️ Empezar</button><button class="btn ghost" id="end" hidden>⏹️ Terminar</button></div>
    <div class="hidden-rec" hidden>${recorderHTML(o.key, o.seconds + 2)}</div><p class="live" id="live"></p></div>`;
  bindRecorders(box);
  const recBtn = $("[data-rec]", box);
  const stopAll = () => {
    if (!running) return; running = false; clearInterval(timer);
    if (recState.active === o.key && recState.rec) recState.rec.stop();
    if (dictApi) dictApi.stop().catch(() => {});
    const secs = Math.round((Date.now() - started) / 1000);
    $("#end").hidden = true; $("#tmh").textContent = "✓ Terminado. Revisa tu resultado abajo."; $("#tm").classList.remove("warn");
    setTimeout(() => o.onDone(text.trim(), secs), dictApi ? 900 : 100);
  };
  $("#go").onclick = () => {
    running = true; started = Date.now(); $("#go").hidden = true; $("#end").hidden = false; $("#tmh").textContent = "Grabando… habla en inglés.";
    try { recBtn.click(); } catch (e) {}
    if (dictApi) {
      dictH.partial = ({ text: t }) => { const l = $("#live"); if (l) l.textContent = (text + " " + t).trim(); };
      dictH.final = ({ text: t }) => { text = (text + " " + t).trim(); const l = $("#live"); if (l) l.textContent = text; };
      dictH.state = ({ state }) => { if (state !== "listening" && running) dictApi.start().catch(() => {}); };
      dictApi.start().catch(() => {});
    }
    timer = setInterval(() => { left--; const t = $("#tm"); if (t) { t.textContent = fmtSec(Math.max(0, left)); t.classList.toggle("warn", left <= 10); } if (left <= 0) stopAll(); }, 1000);
  };
  $("#end").onclick = stopAll;
}

// ---------- Pronunciación ----------
const PHON_TIPS = {
  silent_k: "La «k» inicial es muda (knife = <i>naif</i>).", silent_w: "La «w» inicial es muda (write = <i>rait</i>).", silent_b: "La «b» no suena (climb = <i>klaim</i>).",
  silent_p: "La «p» inicial es muda.", silent_h: "La «h» es muda en esta palabra.", silent_t: "La «t» no suena (listen = <i>lisen</i>).", silent_l: "La «l» no suena (walk = <i>uok</i>).",
  silent_gh: "La «gh» no suena.", silent_s: "La «s» no suena (island = <i>ailend</i>).", silent_d: "La primera «d» no suena.", silent_g: "La «g» no suena.",
  ed_t: "La terminación -ed suena como «t», sin agregar sílaba.", ed_d: "La terminación -ed suena como «d», sin agregar sílaba.", ed_id: "Aquí la -ed sí se dice como sílaba aparte: «id».",
  s_cons: "No digas «e» al principio: es <i>school</i>, no <i>eschool</i>.",
  th: "«th» (θ): la lengua entre los dientes y sopla, como la «z» de España.", dh: "«th» suave (ð): la lengua entre los dientes, vibrando, como la «d» de «cada».",
  v: "La «v» se dice con los dientes de arriba sobre el labio de abajo; no es «b».", z: "La «z» zumba como una abeja (zzz); no es «s».",
  ih: "La «i» es corta y relajada, casi una «e» (ship, sit).", iy: "La «i» es larga y tensa (sheep, seat): estira los labios.", ae: "La «a» (æ) es abierta, entre «a» y «e»: abre la boca y sonríe.",
  schwa: "Las vocales sin acento se reducen a un sonido débil (ə), como una «e» muy corta.", sh: "«sh» (ʃ): como cuando pides silencio, ¡shh!", jh: "«j/g» (dʒ): como «ll» fuerte, «yo» bien pronunciado.",
  zh: "«ʒ»: como «sh» pero con vibración (vision, usually).", h: "La «h» se aspira suave, como una «j» muy suave.", r: "La «r» no vibra: enrosca la lengua hacia atrás sin tocar el paladar.",
  ng: "«ng» (ŋ): la «g» final casi no se oye; el sonido sale por la nariz.", final: "Pronuncia las consonantes finales, no las cortes.",
};
const syl = (c) => c.startsWith("syl") ? `Se dice en ${c.slice(3)} sílaba${c.slice(3) === "1" ? "" : "s"}, menos de las que parece por la escritura.` : "";
const phonKey = (w) => w.toLowerCase().replace(/[’‘]/g, "'").replace(/^'+|'+$/g, "");
function phonFor(text) {
  const clean = String(text || "").replace(/\(.*?\)|\.\.\.|…|\+.*$/g, " ").replace(/\//g, " ").trim();
  const ws = clean.match(/[A-Za-z]+(?:['’][a-z]+)?/g);
  if (!ws || ws.length > 7) return null;
  const ps = ws.map((w) => PHON[phonKey(w)]);
  if (ps.some((p) => !p)) return null;
  const tips = [];
  ps.forEach((p) => p[2].split(",").filter(Boolean).forEach((c) => { if (!tips.includes(c)) tips.push(c); }));
  const prio = (c) => c.startsWith("silent") || c.startsWith("syl") || c.startsWith("ed_") || c === "s_cons" ? 0 : 1;
  tips.sort((a, b) => prio(a) - prio(b));
  return { ipa: ps.map((p) => p[0]).join(" "), es: ps.map((p) => p[1]).join(" "), tips: tips.slice(0, ws.length > 1 ? 2 : 3), one: ws.length === 1 };
}
const tipText = (c) => PHON_TIPS[c] || syl(c);
function pronHTML(text, o = {}) {
  if (S.settings.pronShow === false) return "";
  const p = phonFor(text); if (!p) return "";
  const ipa = S.settings.ipaShow !== false;
  return `<div class="pron ${o.big ? "big" : ""}">${ipa ? `<span class="ipa">/${esc(p.ipa)}/</span>` : ""}${ipa ? " · " : ""}<span class="resp" title="Pronunciación a la española. MAYÚSCULAS = sílaba fuerte">${esc(p.es)}</span>${o.tips && p.tips.length ? `<ul class="ptips">${p.tips.map((c) => `<li>${tipText(c)}</li>`).join("")}</ul>` : ""}</div>`;
}

function photoHTML(key, cls = "") { return PHOTOS[key] ? `<img class="pxphoto ${cls}" src="img/px/${PHOTOS[key][0]}.webp" alt="${esc(key)}" loading="lazy">` : ""; }

// ===== CONVERSACIONES: RAMIFICACIONES, CORRECCIÓN, MAPA Y RESULTADOS =====

// Convierte una conversación lineal (turns) al formato de nodos
function convoNodes(item) {
  if (item.nodes) return { start: item.start, nodes: item.nodes };
  const nodes = {};
  item.turns.forEach((t, i) => { nodes["t" + i] = { npc: t[0], task: t[1], opts: [{ label: "", say: t[2], next: i + 1 < item.turns.length ? "t" + (i + 1) : null }] }; });
  return { start: "t0", nodes };
}
const allConvos = () => SCENES.concat(ALL_ROLEPLAY, typeof DEV_RP !== "undefined" ? DEV_RP : []);
const convoById = (id) => allConvos().find((c) => c.id === id);
const convoOK = (c) => c.level === "TI" || S.unlocked.includes(c.level);

// ---------- Corrección gramatical de lo que dices (LanguageTool) ----------
const LT_IGNORE_CAT = new Set(["CASING", "TYPOGRAPHY", "PUNCTUATION", "STYLE", "REDUNDANCY"]);
const LT_IGNORE_RULE = new Set(["UPPERCASE_SENTENCE_START", "PUNCTUATION_PARAGRAPH_END", "COMMA_PARENTHESIS_WHITESPACE", "WHITESPACE_RULE", "EN_QUOTES", "SENTENCE_WHITESPACE", "I_LOWERCASE"]);
async function checkSpoken(said) {
  let t = said.trim(); if (!t) return [];
  t = t[0].toUpperCase() + t.slice(1); if (!/[.!?]$/.test(t)) t += ".";
  const ms = await languageTool(t);
  return ms.filter((m) => !LT_IGNORE_CAT.has((m.rule.category || {}).id) && !LT_IGNORE_RULE.has(m.rule.id)).map((m) => ({ bad: t.substr(m.offset, m.length), msg: m.message, fix: (m.replacements[0] || {}).value || "" }));
}
function ltHTML(res) {
  if (res.lt === undefined) return `<p class="small muted">⏳ Revisando gramática…</p>`;
  if (res.lt === null) return `<p class="small muted">El corrector de gramática no está disponible ahora (necesita internet).</p>`;
  if (!res.lt.length) return `<p class="small">✅ <b>Gramática:</b> no se encontraron errores.</p>`;
  return `<div class="ltspoken"><b>Gramática: ${res.lt.length} posible(s) error(es)</b>${res.lt.map((e) => `<div class="ltm"><mark>${esc(e.bad)}</mark>${e.fix ? ` → <b>${esc(e.fix)}</b>` : ""}<div class="small muted">${esc(e.msg)}</div></div>`).join("")}</div>`;
}

// ---------- Motor de conversación ----------
function runConvo(m, item, back) {
  if (!sub.cv) { const g = convoNodes(item); sub.cv = { g, node: g.start, log: [], res: null, shown: Date.now(), hints: {} }; }
  const cv = sub.cv, node = cv.g.nodes[cv.node];
  if (!node || node.end) return convoEnd(m, item, back, node);
  const r = cv.res;
  const branching = !!item.nodes;
  m.innerHTML = `<div class="row between"><div><h1>${esc(item.title)}</h1><div class="muted small">${esc(item.intro)}${branching ? " · 🔀 La conversación cambia según lo que digas" : ""}</div></div><button class="btn ghost small" id="exit">Salir</button></div>
  <div class="chat">${cv.log.map((l) => `<div class="msg bot">${esc(l.npc)}</div><div class="msg me">${esc(l.said)}</div>`).join("")}
    <div class="msg bot">${esc(node.npc)} ${speakBtn(node.npc)}${csBox(node.npc, false)}</div></div>
  ${node.task ? `<div class="card task-box"><b>Tu turno:</b> ${esc(node.task)}</div>` : ""}
  ${r ? `<div class="feedback ${r.s >= 0.6 ? "good" : "bad"}"><b>Dijiste:</b> “${esc(r.said)}”
      ${r.s < 0.3 ? `<p>🤔 No quedó muy claro. Prueba con una de las ideas de abajo o dilo de otra forma.</p>` : ""}
      <p><b>Frase modelo más cercana</b> (${Math.round(r.s * 100)}%): ${esc(r.model)} ${speakBtn(r.model)}</p>${csBox(r.model, false)}
      ${branching && r.opt.label ? `<p class="small muted">Camino elegido: ${esc(r.opt.label)}</p>` : ""}
      <div id="ltres">${ltHTML(r)}</div></div>
    <div class="row"><button class="btn" id="next">Continuar</button><button class="btn ghost" id="retry">Intentar de nuevo</button></div>`
  : `<div class="center">${micButton("rec")}</div><p class="muted center" id="live"></p><form id="tf" class="row"><input id="ti" placeholder="O escribe tu respuesta en inglés" autocapitalize="off"><button class="btn">Enviar</button></form>
    <details class="card hints"><summary>💡 ${node.opts.length > 1 ? "Ideas de qué decir" : "Ver una respuesta posible"}</summary>${node.opts.map((o, k) => `<div class="hint">${o.label ? `<b>${esc(o.label)}</b>` : ""} <button class="btn ghost small" data-h="${k}">Ver frase</button><div id="h${k}"></div></div>`).join("")}<p class="small muted">Escucha la frase y luego dila tú sin mirar.</p></details>`}`;
  $("#exit").onclick = () => { stopSpeech(); back(); };
  if (!r) setTimeout(() => speakLines([[1, node.npc]]), 200);
  const answer = (said) => {
    let best = { s: -1 };
    node.opts.forEach((o) => o.say.forEach((x) => { const s = similarity(x, said); if (s > best.s) best = { s, model: x, opt: o }; }));
    cv.res = { said, s: Math.max(0, best.s), model: best.model, opt: best.opt, secs: Math.round((Date.now() - cv.shown) / 1000), lt: undefined };
    const res = cv.res; render();
    checkSpoken(said).then((lt) => { res.lt = lt; }).catch(() => { res.lt = null; }).then(() => { const b = $("#ltres"); if (b && cv.res === res) b.innerHTML = ltHTML(res); });
  };
  bindMic("rec", answer, (t) => { const l = $("#live"); if (l) l.textContent = t; });
  if ($("#tf")) $("#tf").onsubmit = (e) => { e.preventDefault(); const v = $("#ti").value.trim(); if (v) answer(v); };
  $$("[data-h]", m).forEach((b) => b.onclick = () => { const o = node.opts[+b.dataset.h], x = o.say[0]; $("#h" + b.dataset.h).innerHTML = `<p>${esc(x)} ${speakBtn(x)}</p>`; b.remove(); cv.hints[cv.node] = true; });
  if ($("#next")) $("#next").onclick = () => { cv.log.push({ npc: node.npc, said: r.said, model: r.model, s: r.s, secs: r.secs, lt: r.lt || [], task: node.task || "", hint: !!cv.hints[cv.node] }); cv.node = r.opt.next; cv.res = null; cv.shown = Date.now(); render(); };
  if ($("#retry")) $("#retry").onclick = () => { cv.res = null; cv.shown = Date.now(); render(); };
}

function convoEnd(m, item, back, endNode) {
  const cv = sub.cv;
  if (endNode && endNode.end && !cv.closed) {
    m.innerHTML = `<div class="row between"><h1>${esc(item.title)}</h1></div><div class="chat">${cv.log.map((l) => `<div class="msg bot">${esc(l.npc)}</div><div class="msg me">${esc(l.said)}</div>`).join("")}<div class="msg bot">${esc(endNode.npc)} ${speakBtn(endNode.npc)}</div></div><button class="btn wide" id="res">Ver mi resultado</button>`;
    setTimeout(() => speakLines([[1, endNode.npc]]), 200);
    $("#res").onclick = () => { cv.closed = true; render(); };

// ---------- Resultado completo ----------
const STOP = new Set("i you he she it we they a an the and or but to of in on at for with is are was were be been am do does did have has had my your our their this that these those me him her us them so if then not no yes can could would will just very".split(" "));
function convoResults(m, item, back) {
  const cv = sub.cv, L = cv.log, n = L.length || 1;
  if (!cv.stats) {
    const acc = L.reduce((a, l) => a + l.s, 0) / n;
    const errs = L.reduce((a, l) => a + l.lt.length, 0);
    const words = L.map((l) => (l.said.match(/[A-Za-z']+/g) || []).length);
    const avgW = words.reduce((a, b) => a + b, 0) / n;
    const avgT = L.reduce((a, l) => a + l.secs, 0) / n;
    const hints = L.filter((l) => l.hint).length;
    const toks = [...new Set(L.flatMap((l) => (l.said.toLowerCase().match(/[a-z']+/g) || [])))];
    const known = new Set(allCards().map((c) => c.en.toLowerCase()).filter((w) => !w.includes(" ")));
    const courseWords = toks.filter((w) => known.has(w) && !STOP.has(w));
    const flu = Math.min(1, avgW / 7) * (avgT <= 20 ? 1 : avgT <= 35 ? 0.8 : 0.6);
    const gram = Math.max(0, 1 - errs / n / 1.5);
    const score = acc * 0.55 + gram * 0.25 + flu * 0.2 - Math.min(0.15, hints * 0.03);
    const stars = score >= 0.78 ? 3 : score >= 0.58 ? 2 : score >= 0.35 ? 1 : 0;
    cv.stats = { acc, errs, avgW, avgT, hints, toks, courseWords, flu, gram, stars, score };
    const prev = (S.rpStars || {})[item.id] || 0;
    S.rpStars = S.rpStars || {}; S.rpStars[item.id] = Math.max(prev, stars);
    S.done.roleplay[item.id] = true;
    skill("speaking", Math.round(acc * n), n); if (extraTask().go === "hablar") markDaily("extra"); addXP(10 + stars * 5); save();
  }
  const st = cv.stats, pct = (x) => Math.round(x * 100);
  const review = L.filter((l) => l.s < 0.7 || l.lt.length);
  const meter = (label, v, note) => `<div class="meter"><div class="row between"><b>${label}</b><span>${pct(v)}%</span></div><div class="bar"><i style="width:${pct(v)}%"></i></div><div class="small muted">${note}</div></div>`;
  m.innerHTML = `<div class="card center"><div class="stars">${[1, 2, 3].map((i) => `<span class="${i <= st.stars ? "on" : ""}">★</span>`).join("")}</div>
    <h2>${["Sigue practicando", "¡Bien!", "¡Muy bien!", "¡Excelente!"][st.stars]}</h2><p class="muted">${esc(item.title)} · ${L.length} respuestas</p></div>
  <div class="card">${meter("Precisión", st.acc, "Qué tanto se pareció lo que dijiste a una frase natural para esa situación.")}
    ${meter("Gramática", st.gram, st.errs ? `${st.errs} posible(s) error(es) encontrados por el corrector.` : "El corrector no encontró errores.")}
    ${meter("Fluidez", st.flu, `${st.avgW.toFixed(1)} palabras por respuesta · ${Math.round(st.avgT)} s en responder, en promedio${st.hints ? ` · usaste ${st.hints} pista(s)` : ""}.`)}
    <div class="meter"><b>Vocabulario</b><div class="small muted">${st.toks.length} palabras distintas${st.courseWords.length ? `, ${st.courseWords.length} del curso:` : "."}</div>${st.courseWords.length ? `<div class="chips">${st.courseWords.slice(0, 20).map((w) => `<span class="chip">${esc(w)}</span>`).join("")}</div>` : ""}</div></div>
  ${review.length ? `<div class="card"><h3>Frases para repasar</h3>${review.map((l, k) => `<div class="li col"><div class="small muted">${esc(l.npc)}</div><div>Dijiste: “${esc(l.said)}”</div><div><b>Mejor así:</b> ${esc(l.lt.length && l.s >= 0.7 ? fixWith(l.said, l.lt) : l.model)} ${speakBtn(l.model)}</div><button class="btn ghost small" data-add="${k}">➕ Añadir a mis tarjetas</button></div>`).join("")}</div>` : `<div class="feedback good">Ninguna frase para repasar. ¡Muy bien!</div>`}
  <div class="row center"><button class="btn" id="again">Repetir${item.nodes ? " (prueba otro camino)" : ""}</button><button class="btn ghost" id="lst">Volver</button></div>`;
  $$("[data-add]", m).forEach((b) => b.onclick = () => { const l = review[+b.dataset.add]; addCustomCard(l.model, l.task || item.title, l.npc); b.textContent = "✓ Añadida"; b.disabled = true; });
  $("#again").onclick = () => { sub = { rp: item }; render(); };
  $("#lst").onclick = back;
}

// Línea de tiempo en SVG
function tlSVG(tl, big) {
  const W = 320, H = big ? 120 : 64, Y = big ? 70 : 38, X = (p) => 12 + (p / 100) * (W - 24);
  const parts = [];
  parts.push(`<line x1="8" y1="${Y}" x2="${W - 8}" y2="${Y}" class="tl-axis"/><polygon points="${W - 8},${Y - 5} ${W},${Y} ${W - 8},${Y + 5}" class="tl-head"/>`);
  parts.push(`<line x1="${X(50)}" y1="${Y - (big ? 26 : 16)}" x2="${X(50)}" y2="${Y + (big ? 26 : 16)}" class="tl-now"/>`);
  if (big) parts.push(`<text x="${X(50)}" y="${Y + 44}" class="tl-lbl now">ahora</text><text x="${X(8)}" y="${Y + 44}" class="tl-lbl">pasado</text><text x="${X(92)}" y="${Y + 44}" class="tl-lbl">futuro</text>`);
  if (tl.ref !== 50) parts.push(`<line x1="${X(tl.ref)}" y1="${Y - (big ? 22 : 14)}" x2="${X(tl.ref)}" y2="${Y + (big ? 22 : 14)}" class="tl-ref"/>${big ? `<text x="${X(tl.ref)}" y="${Y - 28}" class="tl-lbl ref">${esc(tl.refLabel)}</text>` : ""}`);
  tl.marks.forEach((mk) => {
    if (mk[0] === "x") { const x = X(mk[1]), s = big ? 7 : 5; parts.push(`<path d="M${x - s} ${Y - s} L${x + s} ${Y + s} M${x + s} ${Y - s} L${x - s} ${Y + s}" class="tl-x"/>`); }
    if (mk[0] === "bar") { const a = X(mk[1]), b = X(mk[2]), amp = big ? 5 : 3.5, step = big ? 10 : 7; let d = `M${a} ${Y}`; for (let x = a, k = 0; x < b; x += step / 2, k++) d += ` L${Math.min(b, x + step / 2)} ${Y + (k % 2 ? amp : -amp)}`; parts.push(`<path d="${d}" class="tl-bar"/>`); }
    if (mk[0] === "arr") { const a = X(mk[1]), b = X(mk[2]), up = big ? 22 : 13; parts.push(`<path d="M${a} ${Y - 4} Q${(a + b) / 2} ${Y - up - 8} ${b - 2} ${Y - 6}" class="tl-arr"/><polygon points="${b - 2},${Y - 6} ${b - 9},${Y - 9} ${b - 6},${Y - 1}" class="tl-arrh"/>`); }
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="tl ${big ? "big" : ""}" role="img" aria-label="${esc(tl.note)}">${parts.join("")}</svg>`;
}

  $("#back").onclick = () => { sub = { tenses: true }; render(); };

  $$("[data-tense]", m).forEach((b) => b.onclick = () => { sub = { tense: b.dataset.tense }; render(); window.scrollTo(0, 0); });

function tenseDrill(m, items, title, id) {
  exerciseRunner(m, items.map((d) => d[1]), { title: "🕒 " + title, subtitle: "Elige o escribe el tiempo correcto", onExit: () => { sub = id ? { tense: id } : { tenses: true }; render(); },

      const weak = Object.entries(per).filter(([k, [ok, tot]]) => k !== "mix" && ok / tot < 0.7).map(([k]) => TENSES.find((t) => t.id === k));
      m.innerHTML = `<div class="card center"><div class="big">🕒</div><h2>${c} de ${n} correctas</h2>${weak.length ? `<p>Repasa: ${weak.map((t) => `<button class="btn ghost small" data-tense="${t.id}">${esc(t.name)}</button>`).join(" ")}</p>` : `<p class="muted">¡Muy bien! Dominas estos tiempos.</p>`}

const epProg = (s, n) => { const p = sProg(s.id), k = epKey(s, n); return (p[k] = p[k] || { phase: "", steps: [false, false, false, false], words: [], sums: [] }); };
const epPeek = (s, n) => (sProg(s.id))[epKey(s, n)] || {};
const watchURL = (s, n) => s.videos ? `https://www.youtube.com/watch?v=${s.videos[n - 1].vid}` : `https://www.youtube.com/watch?list=${encodeURIComponent(s.list)}&index=${n}`;
let seriesSel = null, epSel = null, ytPlayer = null, addPick = null;

function loadYT() {
  if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
  if (window.__ytLoading) return window.__ytLoading;
  window.__ytLoading = new Promise((res, rej) => {
    window.onYouTubeIframeAPIReady = () => res(window.YT);
    const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; sc.onerror = () => { window.__ytLoading = null; rej(new Error("sin conexión")); };
    document.head.appendChild(sc); setTimeout(() => rej(new Error("tiempo agotado")), 12000);
  });
  return window.__ytLoading;
}

// ---------- Control de subtítulos del reproductor ----------
function captionStatus(t) { const el = $("#ccmsg"); if (el) el.textContent = t; }
function applyCaptions(p, phase) {
  if (!p || !phase) return;
  try {
    if (phase === "sin_subs") { p.setOption("captions", "track", {}); p.unloadModule("captions"); captionStatus("🎧 Subtítulos apagados. Si aún ves texto, está grabado en el video y no se puede quitar."); return; }
    p.loadModule("captions");
    const list = p.getOption("captions", "tracklist") || [];
    if (!list.length) { captionStatus(p.__ccTried ? "Este video no tiene subtítulos disponibles." : "⏳ Activando subtítulos… (empiezan a funcionar cuando el video se reproduce)"); p.__ccTried = true; return; }
    const has = (lc) => list.find((t) => (t.languageCode || "").toLowerCase().startsWith(lc));
    if (phase === "subs_en") { const t = has("en"); if (t) { p.setOption("captions", "track", { languageCode: t.languageCode }); captionStatus("🇬🇧 Subtítulos en inglés activados."); } else captionStatus("Este video no tiene subtítulos en inglés."); return; }
    const es = has("es");
    if (es) { p.setOption("captions", "track", { languageCode: es.languageCode }); captionStatus("🇪🇸 Subtítulos en español activados."); return; }
    const base = has("en") || list[0];
    p.setOption("captions", "track", { languageCode: base.languageCode, translationLanguage: { languageCode: "es", languageName: "Spanish" } });
    captionStatus("🇪🇸 Este video no trae subtítulos en español: intenté la traducción automática de YouTube. Si no aparece, usa CC → Configuración → Traducir automáticamente.");
  } catch (er) { captionStatus("No pude cambiar los subtítulos desde la app; usa el botón CC del reproductor."); }
}

function episodePage(box, s, n) {
  if (!s || n > s.eps || n < 1) { seriesSel = epSel = null; return immSeries(box); }
  const e = epProg(s, n), v = s.videos ? s.videos[n - 1] : null;
  const label = v ? (v.title || e.title || "Video") : `${s.name} · Episodio ${n}`;
  box.innerHTML = `<div class="row between"><div><h2>${esc(label)}</h2><div class="small muted" id="eptitle">${v ? "Mis videos" : esc(e.title || "")}</div></div><button class="btn ghost small" id="eback">← ${v ? "Volver" : "Episodios"}</button></div>
    <div class="ytwrap"><div id="ytp"></div><div class="ytfallback" id="ytfb" hidden><p>Este video no se puede reproducir dentro de la app.</p><a class="btn" href="${watchURL(s, n)}" target="_blank" rel="noopener">▶️ Ver en YouTube</a></div></div>
    <p class="small center"><a href="${watchURL(s, n)}" target="_blank" rel="noopener">Abrir en YouTube</a></p>
    <div class="card"><h3>1. Subtítulos</h3><div class="phasechips">${SERIES_PHASES.map(([k, l]) => `<label class="chipradio"><input type="radio" name="eph" value="${k}" ${e.phase === k ? "checked" : ""}> ${l}</label>`).join("")}</div>
      <p class="small" id="ccmsg">${e.phase ? "" : "Elige con qué subtítulos lo vas a ver: la app los activa en el video y lo anota en tu registro."}</p>
      <p class="small muted">Tu fase actual de inmersión: <b>${esc(curPhase().title)}</b></p></div>
    <div class="card"><h3>2. Los 4 pasos</h3>${SERIES_STEPS.map((t, i) => `<label class="cando"><input type="checkbox" data-step="${i}" ${e.steps[i] ? "checked" : ""}> <span>${t}</span></label>`).join("")}
      <div id="sumbox"></div>${e.sums.length ? `<details><summary class="small">Tus resúmenes (${e.sums.length})</summary>${e.sums.map((x) => `<p class="small"><b>${new Date(x.at).toLocaleDateString()}</b> · ${x.words} palabras · ${esc(x.text || "(solo grabación)")}</p>`).join("")}</details>` : ""}</div>
    <div class="card"><h3>3. Palabras nuevas</h3><form id="wf" class="row"><input id="wen" placeholder="Palabra o frase en inglés" autocapitalize="off"><input id="wes" placeholder="Significado (opcional)"><button class="btn">Añadir</button></form>
      <div id="wbox"></div></div>
    <div class="row" id="wrow">${e.watched ? `<span class="feedback good">✓ Visto</span>` : `<button class="btn" id="ewatched">✓ Marcar como visto</button>`}${v ? `<button class="btn red small" id="vdel">Quitar video</button>` : ""}</div><div id="vdc"></div>
    <div class="row between">${n > 1 ? `<button class="btn ghost small" id="eprev">← ${v ? "Anterior" : "Episodio " + (n - 1)}</button>` : "<span></span>"}${n < s.eps ? `<button class="btn ghost small" id="enext">${v ? "Siguiente" : "Episodio " + (n + 1)} →</button>` : ""}</div>`;
  const kill = () => { try { ytPlayer && ytPlayer.destroy(); } catch (er) {} ytPlayer = null; };
  const go2 = (k) => { kill(); epSel = k; render(); window.scrollTo(0, 0); };
  $("#eback").onclick = () => { kill(); epSel = null; seriesSel = null; render(); };
  if ($("#eprev")) $("#eprev").onclick = () => go2(n - 1);
  if ($("#enext")) $("#enext").onclick = () => go2(n + 1);
  $$("[name=eph]", box).forEach((r) => r.onchange = () => { e.phase = r.value; save(); if (ytPlayer) applyCaptions(ytPlayer, e.phase); else captionStatus("Se aplicará cuando cargue el video."); });
  $$("[data-step]", box).forEach((c) => c.onchange = () => { e.steps[+c.dataset.step] = c.checked; save(); if (+c.dataset.step === 3 && c.checked) startSummary(); });
  const startSummary = () => {
    timedSpeak($("#sumbox"), { key: `ser-${s.id}-${epKey(s, n)}`, seconds: 60, onDone: (said, used) => {
      const words = said ? said.split(/\s+/).length : 0;
      $("#sumbox").innerHTML = `<div class="feedback good"><b>Resumen guardado</b>${said ? `<p>${esc(said)}</p><p class="small">${words} palabras en ${used} s.</p>` : `<p class="small">Escucha tu grabación para evaluarte.</p>`}${recorderHTML(`ser-${s.id}-${epKey(s, n)}`, 62)}</div>`;
      bindRecorders($("#sumbox")); e.sums.unshift({ at: Date.now(), text: said, words, secs: used }); e.steps[3] = true; const c3 = $('[data-step="3"]'); if (c3) c3.checked = true; skill("speaking", 1, 1); addXP(8); save();
    } });
  };
  $("#sumbox").innerHTML = `<button class="btn ghost small" id="sumgo">🗣️ Contarlo ahora (1 minuto)</button>`;
  $("#sumgo").onclick = startSummary;
  // La lista de palabras se actualiza sola, sin recargar el video
  const toCard = (w) => { if (w.card) return; addCustomCard(w.en, w.es || "(completa el significado)", v ? (v.title || "Video") : `${s.name} · episodio ${n}`, true); w.card = true; };
  const drawWords = () => {
    const wb = $("#wbox"); if (!wb) return;
    wb.innerHTML = `<div class="list">${e.words.map((w, i) => `<div class="li">${picHTML(w.en, "lst")}<div><b>${esc(w.en)}</b> — ${esc(w.es || "…")}${pronHTML(w.en)}</div>${speakBtn(w.en)}${w.card ? `<span class="small muted">✓ en tarjetas</span>` : `<button class="btn ghost small" data-wcard="${i}">➕ Tarjeta</button>`}<button class="icon-btn" data-wdel="${i}">✕</button></div>`).join("")}</div>
      ${e.words.some((w) => !w.card) ? `<button class="btn ghost small" id="wall">➕ Pasar todas a mis tarjetas</button>` : ""}`;
    $$("[data-wdel]", wb).forEach((b) => b.onclick = () => { e.words.splice(+b.dataset.wdel, 1); save(); drawWords(); });
    $$("[data-wcard]", wb).forEach((b) => b.onclick = () => { toCard(e.words[+b.dataset.wcard]); save(); toast("✓ Añadida a tus tarjetas"); drawWords(); });
    if ($("#wall", wb)) $("#wall", wb).onclick = () => { e.words.forEach(toCard); save(); toast("✓ Palabras añadidas a tus tarjetas"); drawWords(); };
  };
  drawWords();
  $("#wf").onsubmit = async (ev) => {
    ev.preventDefault(); const en = $("#wen").value.trim(); const es = $("#wes").value.trim(); if (!en) return;
    const w = { en, es }; e.words.push(w); save(); $("#wen").value = ""; $("#wes").value = ""; drawWords();
    if (!es) { try { w.es = await translateText(en); save(); drawWords(); } catch (er) {} }
  };
  if ($("#ewatched")) $("#ewatched").onclick = () => {
    e.watched = Date.now(); if (!e.phase) e.phase = curPhase().n <= 2 ? "subs_es" : "subs_en"; e.steps[0] = true;
    const min = (v && v.min) || e.min || 25;
    S.immersion.unshift({ d: Date.now(), type: v ? "video" : "serie", mode: e.phase, min, title: v ? (v.title || e.title || "Video") : `${s.name} · ep. ${n}` });
    addXP(10); if (extraTask().go === "inmersion") markDaily("extra"); save(); toast(`✓ Registrado (${min} min de inmersión)`); $("#ewatched").outerHTML = `<span class="feedback good">✓ Visto</span>`; const c0 = $('[data-step="0"]'); if (c0) c0.checked = true;
  };
  if ($("#vdel")) $("#vdel").onclick = () => confirmBox($("#vdc"), "¿Quitar este video de Mis videos? Las palabras que pasaste a tarjetas se conservan.", () => { kill(); const id = v.id; S.videos = S.videos.filter((x) => x.id !== id); delete sProg(MYV)[id]; save(); epSel = null; render(); });
  // Reproductor
  const fb = () => { const f = $("#ytfb"), p = $("#ytp"); if (f) f.hidden = false; if (p) p.remove(); };
  const phase0 = e.phase;
  // Título, duración y total de episodios que informa el reproductor
  const meta = (p) => {
    try {
      if (!v) {
        const pl = p.getPlaylist && p.getPlaylist();
        if (pl && pl.length && pl.length !== s.eps) { if (s.builtin) { S.seriesOverride = S.seriesOverride || {}; S.seriesOverride[s.id] = { eps: pl.length }; } else { const x = (S.series || []).find((y) => y.id === s.id); if (x) x.eps = pl.length; } save(); }
      }
      const d = p.getVideoData && p.getVideoData();
      if (d && d.title && e.title !== d.title) { e.title = d.title; if (v && !v.title) v.title = d.title; save(); const t = $(v ? "h2" : "#eptitle", box); if (t) t.textContent = v ? v.title : d.title; }
      const dur = p.getDuration && p.getDuration();
      if (dur > 0 && !e.min) { e.min = Math.max(1, Math.round(dur / 60)); if (v && !v.min) v.min = e.min; save(); }
    } catch (er) {}
  };
  loadYT().then((YT) => {
    if (!$("#ytp") || epSel !== n) return;
    const pv = { rel: 0, hl: "es", cc_load_policy: phase0 && phase0 !== "sin_subs" ? 1 : 0, cc_lang_pref: phase0 === "subs_es" ? "es" : "en", playsinline: 1 };
    const opts = { width: "100%", height: "100%", host: "https://www.youtube-nocookie.com", playerVars: v ? pv : { ...pv, listType: "playlist", list: s.list },
      events: {
        onReady: (ev) => { try { if (!v) ev.target.cuePlaylist({ listType: "playlist", list: s.list, index: n - 1 }); } catch (er) {} setTimeout(() => meta(ev.target), 800); },
        onApiChange: (ev) => { if (e.phase) applyCaptions(ev.target, e.phase); },
        onStateChange: (ev) => { if (ev.data === 1 && e.phase) applyCaptions(ev.target, e.phase); meta(ev.target); },
        onError: fb } };
    if (v) opts.videoId = v.vid;
    ytPlayer = new YT.Player("ytp", opts);
  }).catch(fb);
}
